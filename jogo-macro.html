<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fluxo Circular: o jogo de Macroeconomia</title>
<meta name="description" content="Jogo de estudo de Macroeconomia para o concurso do Banco Central do Brasil: contas nacionais, moeda e agregados monetários, e balanço de pagamentos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --mesa:#223041;
  --mesa-2:#1a2634;
  --papel:#FCFBF7;
  --barra:#F0E8D8;
  --linha:#D9CCB4;
  --tinta:#16233A;
  --tinta-2:#53637B;
  --selo:#7A5A16;
  --carimbo:#B3341F;
  --latao:#A8791A;
  --foco:#0E6E5C;
  --disp:"Fraunces","Georgia",serif;
  --ui:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--mesa);
  background-image:radial-gradient(ellipse at 50% -10%, #2c3d51 0%, var(--mesa) 55%, var(--mesa-2) 100%);
  background-attachment:fixed;
  font-family:var(--ui);
  color:var(--tinta);
  line-height:1.5;
  padding:22px 12px 60px;
  -webkit-text-size-adjust:100%;
}

/* ---------- a folha de formulário contínuo ---------- */
.folha{
  position:relative;
  max-width:800px;
  margin:0 auto;
  background:var(--papel);
  border-radius:2px;
  box-shadow:0 18px 40px rgba(0,0,0,.35), 0 2px 0 rgba(255,255,255,.06);
  padding:26px 24px 30px 24px;
}
.folha::before,.folha::after{
  content:"";position:absolute;top:0;bottom:0;width:20px;
  background-image:radial-gradient(circle at 10px 12px, var(--mesa) 3.4px, rgba(0,0,0,.06) 4.2px, transparent 4.8px);
  background-size:20px 24px;
  border-right:1px dashed var(--linha);
}
.folha::before{left:0}
.folha::after{right:0;border-right:0;border-left:1px dashed var(--linha)}
.folha > *{position:relative;z-index:1}
@media(min-width:640px){ .folha{padding:30px 44px 34px 44px} }
@media(max-width:520px){
  .folha::before,.folha::after{display:none}
  .folha{padding:20px 15px 24px}
}

/* ---------- cabeçalho ---------- */
.cabecalho{
  display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between;
  border-bottom:2px solid var(--tinta);padding-bottom:8px;margin-bottom:18px;
}
.marca{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--tinta-2)}
.placar{font-family:var(--mono);font-size:13px;display:flex;gap:14px;align-items:center}
.placar b{color:var(--latao);font-weight:600}
.vidas span{letter-spacing:2px}
.vidas .gasta{opacity:.22}

/* ---------- tipografia ---------- */
h1{font-family:var(--disp);font-weight:700;font-size:clamp(34px,8vw,60px);line-height:.95;margin:0 0 6px;letter-spacing:-.02em}
h2{font-family:var(--disp);font-weight:600;font-size:clamp(22px,4.6vw,31px);line-height:1.1;margin:0 0 8px;letter-spacing:-.01em}
h3{font-family:var(--ui);font-weight:600;font-size:15px;margin:20px 0 6px}
p{margin:0 0 12px;max-width:64ch}
.sub{color:var(--tinta-2);font-size:16px;max-width:52ch}
.mono{font-family:var(--mono)}
.oculto{display:none !important}

/* ---------- capa ---------- */
.capa-selo{
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--carimbo);
  border:1.5px solid var(--carimbo);border-radius:2px;display:inline-block;
  padding:4px 9px;transform:rotate(-1.6deg);margin-bottom:18px;
}
.capa h1{margin-top:4px}
.capa .lead{font-size:18px;max-width:46ch;margin-top:14px}
.regras{
  margin:22px 0 6px;border-top:1px solid var(--linha);border-bottom:1px solid var(--linha);
  padding:14px 0;display:grid;gap:10px;
}
@media(min-width:620px){.regras{grid-template-columns:1fr 1fr 1fr;gap:22px}}
.regra{font-size:14px;color:var(--tinta-2)}
.regra b{display:block;color:var(--tinta);font-size:14px;font-weight:600;margin-bottom:2px}

/* ---------- botões ---------- */
.btn{
  font-family:var(--ui);font-size:15px;font-weight:500;
  background:var(--tinta);color:var(--papel);border:1.5px solid var(--tinta);
  padding:11px 20px;border-radius:2px;cursor:pointer;
  transition:background .13s ease,color .13s ease;
}
.btn:hover{background:#28374f}
.btn.fantasma{background:transparent;color:var(--tinta)}
.btn.fantasma:hover{background:rgba(22,35,58,.07)}
.btn.selo{background:var(--selo);border-color:var(--selo)}
.btn.selo:hover{background:#654a10}
.btn:disabled{opacity:.4;cursor:default}
.acoes{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
:focus-visible{outline:2.5px solid var(--foco);outline-offset:2px}

/* ---------- mapa de fases ---------- */
.mapa{margin-top:14px;border-top:1px solid var(--linha)}
.fase-linha{
  display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;
  width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--linha);
  padding:12px 8px;cursor:pointer;font-family:var(--ui);color:var(--tinta);
}
.fase-linha:nth-child(odd){background:var(--barra)}
.fase-linha:hover:not(:disabled){background:#e8ddc8}
.fase-linha:disabled{cursor:default;color:#98a3b2}
.fase-num{font-family:var(--mono);font-size:17px;color:var(--tinta-2)}
.fase-nome{font-weight:600;font-size:15.5px;display:block}
.fase-tag{font-size:13px;color:var(--tinta-2);display:block}
.fase-linha:disabled .fase-tag{color:#a8b2be}
.fase-status{font-family:var(--mono);font-size:12px;white-space:nowrap}
.fase-status.ok{color:var(--selo)}
.medalha{font-size:15px}

/* ---------- colinha ---------- */
.colinha{font-size:15px}
.colinha p{margin-bottom:10px}
.colinha ul{margin:0 0 14px;padding-left:20px}
.colinha li{margin-bottom:6px;max-width:62ch}
.colinha code{font-family:var(--mono);font-size:.92em;background:var(--barra);padding:1px 5px;border-radius:2px}
.colinha .aviso{
  border-left:3px solid var(--carimbo);background:#fbf1ef;
  padding:10px 14px;margin:14px 0;font-size:14.5px;
}
.colinha .aviso b{color:var(--carimbo)}
.tabela{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 16px}
.tabela th{text-align:left;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--tinta-2);border-bottom:1.5px solid var(--tinta);padding:5px 8px 5px 0}
.tabela td{padding:5px 8px 5px 0;border-bottom:1px solid var(--linha)}
.tabela tr:nth-child(even) td{background:var(--barra)}
.tabela td.cod{font-family:var(--mono)}

/* oficina do dígito de controle */
.oficina{border:1px solid var(--linha);background:var(--barra);padding:14px;margin:6px 0 16px}
.oficina label{font-size:13px;display:block;margin-bottom:6px;color:var(--tinta-2)}
.oficina input{font-family:var(--mono);font-size:16px;padding:8px 10px;border:1.5px solid var(--tinta);background:var(--papel);width:190px;border-radius:2px}
.oficina .saida{font-family:var(--mono);font-size:13px;margin-top:10px;white-space:pre;overflow-x:auto}
.oficina .dv{font-size:17px;color:var(--selo);font-weight:600}

/* ---------- jogo ---------- */
.trilho{height:5px;background:var(--barra);margin:0 0 18px;position:relative;overflow:hidden}
.trilho i{position:absolute;left:0;top:0;bottom:0;background:var(--selo);width:0;transition:width .3s ease}
.enunciado{font-family:var(--disp);font-weight:600;font-size:clamp(19px,3.6vw,25px);line-height:1.25;margin:4px 0 4px;letter-spacing:-.01em}
.contexto{font-family:var(--mono);font-size:12px;letter-spacing:.09em;color:var(--tinta-2);margin-bottom:10px}
.lancamento{border:1px solid var(--linha);margin:14px 0 18px;font-family:var(--mono);font-size:13.5px}
.lancamento .lin{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:7px 12px;border-bottom:1px solid var(--linha)}
.lancamento .lin:last-child{border-bottom:0}
.lancamento .lin:nth-child(odd){background:var(--barra)}
@media(max-width:520px){
  .lancamento .lin{grid-template-columns:20px 1fr;row-gap:2px}
  .lancamento .lin span:last-child{grid-column:2;color:var(--tinta-2)}
}
.lancamento .dc{font-weight:600}
.lancamento .d{color:var(--tinta)}
.lancamento .c{color:var(--selo)}
.opcoes{display:grid;gap:8px;margin-top:6px}
.opcoes.grade{grid-template-columns:1fr}
@media(min-width:560px){.opcoes.grade{grid-template-columns:1fr 1fr}}
.op{
  display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
  background:var(--papel);border:1.5px solid var(--linha);border-radius:2px;
  padding:11px 14px;font-family:var(--ui);font-size:15px;color:var(--tinta);cursor:pointer;
  transition:border-color .12s ease,background .12s ease;
}
.op:hover:not(:disabled){border-color:var(--tinta);background:var(--barra)}
.op .tecla{font-family:var(--mono);font-size:12px;color:var(--tinta-2);border:1px solid var(--linha);border-radius:2px;padding:0 5px;line-height:19px;flex:0 0 auto;margin-top:1px}
.op:disabled{cursor:default}
.op.certa{border-color:var(--selo);background:#f4ecdb}
.op.certa .tecla{border-color:var(--selo);color:var(--selo)}
.op.errada{border-color:var(--carimbo);background:#fbf0ee}
.op.errada .tecla{border-color:var(--carimbo);color:var(--carimbo)}
.op.apagada{opacity:.45}
.campo-num{display:flex;gap:10px;align-items:center;margin-top:10px}
.campo-num input{font-family:var(--mono);font-size:22px;width:92px;text-align:center;padding:9px;border:1.5px solid var(--tinta);border-radius:2px;background:var(--papel)}

/* ---------- resposta ---------- */
.resposta{position:relative;margin-top:20px;border-top:2px solid var(--tinta);padding-top:16px}
.carimbo{
  position:absolute;right:12px;top:-16px;
  font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.12em;
  border:2.5px solid currentColor;border-radius:3px;padding:5px 10px;
  transform:rotate(-8deg);opacity:0;background:var(--papel);
}
.carimbo.ok{color:var(--selo)}
.carimbo.nao{color:var(--carimbo)}
.carimbo.bate{animation:bate .42s cubic-bezier(.2,.85,.3,1) forwards}
@keyframes bate{
  0%{transform:rotate(-19deg) scale(2.5);opacity:0}
  55%{transform:rotate(-7deg) scale(.94);opacity:1}
  100%{transform:rotate(-8deg) scale(1);opacity:1}
}
.explica{font-size:15px;max-width:62ch;padding-right:96px}
.explica b{color:var(--tinta)}
@media(max-width:520px){
  .explica{padding-right:0;margin-top:26px}
  .carimbo{top:-14px;right:6px;font-size:12px}
}

/* ---------- fim de fase / diploma ---------- */
.nota{font-family:var(--disp);font-size:clamp(48px,13vw,86px);line-height:.9;font-weight:700;letter-spacing:-.03em}
.nota small{font-family:var(--ui);font-size:15px;font-weight:400;letter-spacing:0;color:var(--tinta-2);display:block;margin-top:4px}
.revisar{border-top:1px solid var(--linha);margin-top:18px;padding-top:12px}
.revisar li{font-size:14px;margin-bottom:8px;max-width:62ch}
.diploma{border:3px double var(--tinta);padding:26px 22px;text-align:center;margin:10px 0}
.diploma .selo-final{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--carimbo);border:1.5px solid var(--carimbo);display:inline-block;padding:5px 10px;transform:rotate(-2deg);margin-top:14px}

.rodape{max-width:800px;margin:16px auto 0;font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.42);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:0 6px}
.rodape button{background:none;border:0;color:inherit;font:inherit;cursor:pointer;text-decoration:underline;padding:0}
.rodape button:hover{color:rgba(255,255,255,.75)}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
  .carimbo.bate{opacity:1}
}
</style>
</head>
<body>

<main class="folha" id="folha">
  <div class="cabecalho">
    <span class="marca" id="marca">FLUXO CIRCULAR · MACROECONOMIA</span>
    <span class="placar oculto" id="placar">
      <span class="vidas" id="vidas"></span>
      <span>XP <b id="xp">0</b></span>
      <span id="combo"></span>
    </span>
  </div>
  <div id="tela"></div>
</main>

<div class="rodape">
  <span>Macroeconomia · aulas 1 a 3 · 12 fases · 142 perguntas comentadas</span>
  <span><button id="btn-som" type="button">som: ligado</button> · <button id="btn-zerar" type="button">apagar progresso</button></span>
</div>

<script>
/* ============================================================
   FLUXO CIRCULAR: o jogo de Macroeconomia
   Conteúdo: Aulas 1 a 3 de Fundamentos de Macroeconomia (BACEN)
   ============================================================ */

const MODULOS = [

/* ============================================================ MÓDULO 1 */
{
nome: "Contas Nacionais",
subtitulo: "Aula 1 · Contabilidade social, conceitos básicos, identidades e mensurações do produto",
fases: [

/* ---- 1.1 */
{
  nome: "O território da Macro",
  tag: "Objetivos, agentes e os quatro instrumentos da contabilidade social",
  colinha: `
    <table class="tabela">
      <tr><th>Microeconomia</th><th>Macroeconomia</th></tr>
      <tr><td>Analisa o comportamento individual de firmas e consumidores em mercados específicos</td><td>Analisa a economia como um todo, em nível <b>agregado</b></td></tr>
      <tr><td>Avalia a formação de preços e a quantidade de transações</td><td>Avalia agregados como inflação, câmbio, juros, produção e renda</td></tr>
      <tr><td>Estuda "a árvore"</td><td>Estuda "a floresta"</td></tr>
    </table>
    <p>A Macro não investiga o preço de um bem específico, e sim o <b>nível agregado de preços</b>; não a produção de uma empresa, e sim o <b>produto agregado</b>. A agregação normalmente significa um país, mas pode ser um município, um estado ou um bloco econômico.</p>
    <p>Ela ganhou corpo como disciplina <b>após a Grande Depressão de 1929</b>, quando ficou claro que as teorias da época não conseguiam explicar o que estava acontecendo.</p>
    <h3>Os quatro objetivos</h3>
    <p>Mais precisamente, são os objetivos da <b>política macroeconômica</b>:</p>
    <ol>
      <li><b>Estabilidade de preços</b>: controlar a inflação, definida como o aumento generalizado dos preços. A inflação dificulta o financiamento de longo prazo e corrói o poder de compra.</li>
      <li><b>Alto nível de emprego</b>: aqui "emprego" significa a <b>utilização dos fatores de produção</b> (trabalhadores, máquinas, equipamentos, terra), não apenas mão de obra.</li>
      <li><b>Crescimento e desenvolvimento econômico</b>.</li>
      <li><b>Distribuição de renda</b>.</li>
    </ol>
    <div class="aviso">Esses quatro objetivos se relacionam por <b>tradeoffs</b>. É muito difícil atingir todos: nível de emprego muito alto desestabiliza os preços, e crescimento muito acelerado pode concentrar a renda.</div>
    <h3>Os agentes econômicos</h3>
    <p>São quatro: <b>famílias</b>, <b>empresas (firmas)</b>, <b>governo</b> e <b>resto do mundo</b>. São entidades abstratas com objetivos e comportamentos próprios, uma simplificação do mundo real.</p>
    <h3>Contabilidade social</h3>
    <p>Um país não usa a contabilidade de uma empresa. Usa a <b>contabilidade social</b>, assim chamada porque existe para auxiliar a sociedade e seus representantes na tomada de decisões econômicas. São <b>quatro instrumentos</b>, cada um com seu órgão e seu manual internacional:</p>
    <table class="tabela">
      <tr><th>Instrumento</th><th>O que mede</th><th>Quem apura</th><th>Manual</th></tr>
      <tr><td><b>Contas Nacionais</b></td><td>Produção, renda e despesa agregados</td><td><b>IBGE</b></td><td><b>SNA</b> (ONU)</td></tr>
      <tr><td><b>Balanço de Pagamentos</b></td><td>Transações do país com os demais países</td><td><b>BCB</b></td><td><b>BPM</b> (FMI)</td></tr>
      <tr><td><b>Contas do Sistema Monetário</b></td><td>Moeda em circulação</td><td><b>BCB</b></td><td><b>MFSM</b> (FMI)</td></tr>
      <tr><td><b>Contabilidade Fiscal</b></td><td>Contas do governo e dívida pública</td><td><b>BCB e Tesouro</b></td><td><b>GFSM</b> (FMI)</td></tr>
    </table>
    <div class="aviso"><b>Guarde o par que mais cai:</b> Contas Nacionais é do <b>IBGE</b>, com manual da <b>ONU</b>. Todos os outros três são do FMI, e os três últimos envolvem o <b>Banco Central</b>.</div>
    <h3>Fluxo e estoque</h3>
    <table class="tabela">
      <tr><th>Variável</th><th>Mensuração</th><th>Pergunta que cabe</th><th>Exemplo</th></tr>
      <tr><td><b>Fluxo</b></td><td>Em relação a um <b>período</b> de tempo</td><td>"Quanto foi o valor disso em determinado período?"</td><td>Salário</td></tr>
      <tr><td><b>Estoque</b></td><td>Em um <b>instante</b> de tempo</td><td>"Quanto é o valor disso agora?"</td><td>Saldo bancário</td></tr>
    </table>
    <p>Os fluxos <b>determinam</b> os estoques: o saldo bancário é resultado dos vários fluxos na conta. E todas as variáveis da contabilidade nacional são do tipo <b>fluxo</b>.</p>
  `,
  qs: [
    {t:"pool", pool:["Microeconomia","Macroeconomia"], p:"Analisa a formação de preços e quantidades em mercados específicos, estudando \"a árvore\".", r:0,
     e:"<b>Microeconomia.</b> A Macro estuda \"a floresta\": a economia como um todo, em nível agregado, por meio dos grandes agregados econômicos."},
    {t:"mc", p:"A Macroeconomia ganhou corpo como disciplina após:",
     o:["A Primeira Guerra Mundial","A Grande Depressão de 1929","O choque do petróleo de 1973","A crise de 2008"], r:1,
     e:"<b>1929.</b> Com a bolsa de Nova Iorque caindo quase 90%, ficou claro que as teorias da época não conseguiam compreender nem explicar o que estava acontecendo, e que a ignorância custava muito caro."},
    {t:"mc", p:"São objetivos da política macroeconômica, EXCETO:",
     o:["Estabilidade de preços","Alto nível de emprego","Equilíbrio das contas públicas","Distribuição de renda"], r:2,
     e:"Os quatro objetivos são: <b>estabilidade de preços, alto nível de emprego, crescimento e desenvolvimento econômico e distribuição de renda</b>. Equilíbrio fiscal é instrumento ou consequência, não figura na lista clássica."},
    {t:"mc", p:"No contexto dos objetivos macroeconômicos, o termo emprego indica:",
     o:["Apenas os postos de trabalho formais","A utilização dos fatores de produção na economia, incluindo trabalhadores, máquinas, equipamentos e terra","O número de carteiras assinadas","A taxa de desocupação medida pelo IBGE"], r:1,
     e:"É um uso mais amplo do que o do dia a dia. Por isso alto nível de emprego implica maior bem-estar: uma economia que <b>utiliza seus recursos</b> produz mais, consome mais e se desenvolve mais."},
    {t:"mc", p:"A relação entre os quatro objetivos macroeconômicos é de:",
     o:["Complementaridade perfeita: atingir um facilita atingir os demais","Tradeoffs: é muito difícil atingir todos, pois emprego muito alto desestabiliza preços e crescimento acelerado pode concentrar renda","Independência total","Hierarquia, com a estabilidade de preços sempre em primeiro lugar"], r:1,
     e:"São fortemente relacionados em uma economia capitalista, na forma de <b>tradeoffs</b>. Um país com preços instáveis, desigualdade, alto desemprego e baixo crescimento é um pesadelo, mas atingir os quatro simultaneamente é muito difícil."},
    {t:"pool", pool:["Contas Nacionais","Balanço de Pagamentos","Contas do Sistema Monetário","Contabilidade Fiscal"], p:"Apurado pelo IBGE, segundo o System of National Accounts da ONU.", r:0,
     e:"<b>Contas Nacionais.</b> É o único dos quatro instrumentos que não é apurado pelo Banco Central nem segue manual do FMI. Mensura produção, renda e despesa agregados."},
    {t:"pool", pool:["Contas Nacionais","Balanço de Pagamentos","Contas do Sistema Monetário","Contabilidade Fiscal"], p:"Apurado pelo Banco Central, registra as transações de um país com os demais países, seguindo manual do FMI.", r:1,

    {t:"pool", pool:["Contas Nacionais","Balanço de Pagamentos","Contas do Sistema Monetário","Contabilidade Fiscal"], p:"Apurada pelo Banco Central e pelo Tesouro Nacional, evidencia as contas do governo e a dívida pública.", r:3,

/* ---- 1.2 */
{
  nome: "Os sete conceitos",
  tag: "Produto, renda, consumo, poupança, investimento, absorção e despesa",
  colinha: `
    <p>Segundo Simonsen e Cysne, toda a contabilidade nacional é desenvolvida a partir de <b>sete conceitos básicos</b>: produto, renda, consumo, poupança, investimento, absorção e despesa. Todos são variáveis do tipo <b>fluxo</b>.</p>
    <h3>1. Produto</h3>
    <p>Total da produção, de bens e serviços, em determinado período. Três traços essenciais:</p>
    <ul>
      <li>Medido em <b>valores monetários</b>, não em unidades produzidas, porque só o preço permite somar soja, serviços de limpeza e aviões;</li>
      <li>Considera apenas os <b>bens e serviços finais</b>, desconsiderando os intermediários;</li>
      <li>Duas formas de aferição: soma do valor dos bens e serviços finais, ou <b>valor adicionado</b>.</li>
    </ul>
    <div class="aviso"><b>Final ou intermediário não é natureza do bem.</b> Depende de o bem <b>ter ou não sido utilizado na produção de outro</b>. O pneu comprado no supermercado é bem final; o pneu agregado ao automóvel zero quilômetro é bem intermediário.</div>
    <p><b>Valor adicionado</b> é o valor bruto de uma etapa produtiva menos o valor dos consumos intermediários. Notebook vendido a R$ 3.000 com R$ 2.000 de componentes gera valor adicionado de <b>R$ 1.000</b>. Somando o valor adicionado de todas as unidades produtivas, chega-se ao produto total.</p>
    <h3>2. Renda</h3>
    <p>Total recebido a título de <b>remuneração pelos fatores de produção</b>. Os fatores são <b>trabalho e capital</b>, este subdividido em capital de empréstimo, capital de risco e capital físico.</p>
    <table class="tabela">
      <tr><th>Fator</th><th>Remuneração</th></tr>
      <tr><td>Trabalho</td><td>Salários (s)</td></tr>
      <tr><td>Capital de empréstimo</td><td>Juros (j)</td></tr>
      <tr><td>Capital de risco</td><td>Lucros (l)</td></tr>
      <tr><td>Capital físico</td><td>Aluguéis (a)</td></tr>
    </table>
    <p><code>Y = s + j + l + a</code>. Os donos dos fatores são as <b>famílias</b>. Como as empresas pagam rendas às famílias e as famílias compram os produtos das empresas, chega-se à primeira identidade: <b>Produto = Renda</b>, ou <code>P = Y</code>.</p>
    <p>É preciso evitar recontagem: elimina-se a remuneração que as empresas pagam umas às outras, pois o aluguel que A paga a B já será contabilizado como lucro em B.</p>
    <h3>3. Consumo</h3>
    <p>Valor dos bens e serviços adquiridos para satisfação de desejos ou necessidades. Divide-se em <b>C</b>, consumo pessoal das famílias, e <b>G</b>, gastos do governo com bens de uso coletivo (segurança, educação, saúde).</p>
    <p><code>C total = C + G</code>. Atenção: quando o <b>C aparece sozinho</b>, refere-se apenas ao gasto das <b>famílias</b>.</p>
    <h3>4. Poupança</h3>
    <p>É a parte da renda <b>não destinada ao consumo</b>. Muito mais ampla do que o depósito bancário homônimo.</p>
    <p><code>S = Y − C</code></p>
    <h3>5. Investimento</h3>
    <p>Em Contas Nacionais, investimento <b>não é aplicação financeira</b>. É o acréscimo de estoque físico de capital:</p>
    <p><code>I = FBKF + ΔE</code></p>
    <ul>
      <li><b>FBKF</b> (formação bruta de capital fixo): investimento das empresas em aumento da capacidade produtiva;</li>
      <li><b>ΔE</b> (variação de estoques): variação líquida nos estoques de bens acabados ou em elaboração e de matérias-primas.</li>
    </ul>
    <p><code>IL = I − Depreciação</code>. Regra de leitura de prova: quando a questão disser apenas "produto" ou "investimento", entenda <b>BRUTO</b>. É a <b>depreciação</b> que torna líquido o que era bruto.</p>
    <h3>6. Absorção interna</h3>
    <p>O que a sociedade absorve em bens e serviços para consumo ou aumento do estoque de capital. Soma dos gastos dos <b>três agentes internos</b>:</p>
    <p><code>Ab = C + G + I</code> &nbsp;ou&nbsp; <code>Ab = C + G + FBKF + ΔE</code> &nbsp;ou&nbsp; <code>Ab = C total + I</code></p>
    <h3>7. Despesa (demanda ou dispêndio)</h3>
    <p>Soma do gasto dos <b>quatro</b> agentes:</p>
    <p><code>D = C + I + G + X − M</code></p>
    <p>As importações entram com <b>sinal negativo</b> porque são produção do resto do mundo, não nacional. As exportações entram somando porque são despesas do resto do mundo com a nossa produção.</p>
    <div class="aviso">Em economia <b>fechada</b>, a absorção interna <b>coincide</b> com a despesa. Em economia aberta, a diferença entre as duas é exatamente as <b>exportações líquidas</b> (X − M).</div>
  `,

  nome: "Identidades e as três óticas",
  tag: "P = Y = D, fluxo circular, poupança e investimento",
  colinha: `
    <div class="aviso">A identidade macroeconômica fundamental é <b>P ≡ Y ≡ D</b> (Produto ≡ Renda ≡ Despesa). O símbolo ≡ significa "é idêntico a": os termos são equivalentes <b>por suas próprias definições</b>, o que se chama <b>tautologia</b>. Na prática usa-se o sinal de igual.</div>
    <p>A intuição: assim como <b>uma compra é uma venda</b>, não há produção que não seja também despesa e simultaneamente geração de renda. Compra e venda são dois nomes para o mesmo fenômeno, observado sob óticas diferentes.</p>
    <p>O picolé gourmet que vale R$ 10: produção de R$ 10; renda de R$ 10 (R$ 7 de salário do amigo e R$ 3 de lucro); despesa de R$ 10 de quem comprou. E se ninguém comprar? Equivale a você mesmo ter comprado um <b>estoque</b> do produto.</p>
    <h3>Fluxo circular da riqueza</h3>
    <p>Famílias e empresas interagem em <b>dois mercados</b>: o de <b>bens e serviços</b> e o de <b>fatores de produção</b>. As empresas recorrem ao mercado de fatores para comprá-los das famílias; as famílias vão ao mercado de bens e serviços para comprá-los das empresas.</p>
    <table class="tabela">
      <tr><th>Circuito</th><th>Famílias</th><th>Empresas</th></tr>
      <tr><td><b>Fluxo real</b></td><td>Demandam bens e serviços; oferecem fatores de produção</td><td>Entregam bens e serviços; adquirem fatores de produção</td></tr>
      <tr><td><b>Fluxo monetário</b></td><td><b>Pagam</b> pelos bens e serviços; <b>recebem</b> pelos fatores</td><td><b>Recebem</b> pelos bens e serviços; <b>pagam</b> pelos fatores</td></tr>
    </table>
    <h3>As três óticas</h3>
    <table class="tabela">
      <tr><th>Ótica</th><th>Como se mede</th><th>O que se obtém</th></tr>
      <tr><td><b>Produção</b></td><td>Valor adicionado em cada etapa produtiva; ou valor total produzido menos consumo intermediário</td><td>PIB a <b>custo de fatores</b></td></tr>
      <tr><td><b>Despesa</b></td><td>C + I + G + X − M; ou soma do valor dos bens e serviços finais</td><td>PIB a <b>preços de mercado</b></td></tr>
      <tr><td><b>Renda</b></td><td>s + j + l + a</td><td><b>Renda Nacional</b> (PNLCF)</td></tr>
    </table>
    <div class="aviso"><b>Pegadinha fina.</b> Rigorosamente, a soma do valor dos <b>bens e serviços finais</b> é ótica da <b>despesa</b>, e não da produção. Se a questão disser que "o PIB é apurado pela ótica da produção somando-se o valor de bens e serviços finais", marque <b>errado</b>. Se disser apenas que "o PIB pode ser mensurado como o valor total de bens e serviços finais produzidos", marque <b>certo</b>.</div>
    <p>Pela ótica da renda, dois agrupamentos merecem nome próprio:</p>
    <ul>
      <li><b>Excedente Operacional Bruto (EOB)</b> = lucros + juros + aluguéis. É a produção que <b>excede os salários</b>, o que sobra depois de pagá-los;</li>
      <li><b>Rendimento Misto Bruto</b> = remuneração dos <b>autônomos</b>. Menos frequente em provas.</li>
    </ul>
    <h3>Poupança e investimento: economia fechada e sem governo</h3>
    <p>A renda vai para consumo ou poupança: <code>Y = C + S</code>. A despesa se divide em gastos das famílias e investimento das empresas: <code>D = C + I</code>. Como <code>Y = D</code>:</p>
    <p><code>C + S = C + I → <b>S = I</b></code></p>
    <p>Os gastos das empresas são financiados pela poupança das famílias, com o sistema financeiro atuando como intermediador.</p>
    <h3>Economia aberta e com governo</h3>
    <p>A despesa vira <code>D = C + I + G + X − M</code>. A renda passa a se destinar a consumo, poupança, impostos e ao exterior, e o país ainda pode receber <b>transferências unilaterais (TUR)</b>:</p>
    <p><code>R = C + S + T + RLEE − TUR</code></p>
    <p>Igualando despesa e renda e isolando o investimento:</p>
    <p><code>I = S + (T − G) + (M − X + RLEE − TUR)</code>, ou seja, <b>I = S<sub>P</sub> + S<sub>G</sub> + S<sub>EXT</sub></b></p>
    <table class="tabela">
      <tr><th>Parcela</th><th>Significado</th></tr>
      <tr><td><b>S</b> (S<sub>P</sub>)</td><td>Poupança privada, das famílias</td></tr>
      <tr><td><b>T − G</b> (S<sub>G</sub>)</td><td>Poupança do governo: impostos recebidos menos gastos</td></tr>
      <tr><td><b>M − X + RLEE − TUR</b> (S<sub>EXT</sub>)</td><td>Poupança externa, do resto do mundo</td></tr>
    </table>
    <div class="aviso"><b>Poupança externa não é reservas internacionais.</b> Ela é a poupança <b>do resto do mundo</b>. Poupança externa <b>positiva</b> não é algo bom: indica que o país está sendo <b>financiado</b> pelo resto do mundo, porque gasta e envia mais rendas do que recebe. É devedor líquido, deficitário. Poupança externa <b>negativa</b> indica que o país está financiando o resto do mundo: é credor, superavitário.</div>
  `,

  nome: "As mensurações do produto",
  tag: "Interno e nacional, bruto e líquido, mercado e fatores, real e nominal",
  colinha: `
    <p>O PIB é uma medida dos <b>bens e serviços finais</b> gerados <b>dentro das fronteiras do país</b>, em <b>determinado período</b>, avaliados a <b>preço de mercado</b>. Cada um desses quatro elementos gera uma distinção.</p>
    <h3>Bens de capital e estoques entram; intermediários não</h3>
    <p>Bens intermediários não entram, para evitar dupla contagem. Mas <b>bens de capital</b> (máquinas e instalações) adquiridos no período <b>somam</b> ao PIB, assim como os <b>estoques</b> não vendidos. Note que o PIB tem recontagem inerente: no preço do guarda-roupas está embutida parte do desgaste da serra, que também foi contada. Esse problema é eliminado no <b>PIL</b>.</p>
    <p>O que <b>não</b> entra no PIB: bens e serviços não comercializados no mercado, como os serviços domésticos no próprio lar, e atividades ilegais, como jogo do bicho e tráfico.</p>
    <h3>Interno e nacional</h3>
    <table class="tabela">
      <tr><th>Critério</th><th>PIB</th><th>PNB</th></tr>
      <tr><td>Base</td><td><b>Territorial</b>: onde se produz</td><td><b>Nacionalidade dos fatores</b>: de quem é o fator</td></tr>
      <tr><td>Empresa brasileira no Brasil</td><td>Entra</td><td>Entra</td></tr>
      <tr><td>Empresa brasileira em Portugal</td><td>Não entra</td><td>Entra</td></tr>
      <tr><td>Empresa alemã no Brasil</td><td>Entra</td><td>Não entra</td></tr>
    </table>
    <p><code>RLEE = REE − RRE</code> &nbsp;e&nbsp; <code>PNB = PIB − RLEE</code></p>
    <p>No Brasil, com muitas empresas estrangeiras no território e poucas nacionais fora, a RLEE é <b>positiva</b> e o <b>PIB é maior que o PNB</b>.</p>
    <p>Exemplo numérico: brasileira no Brasil 500, brasileira em Portugal 350, alemã no Brasil 800. PIB = 1.300; PNB = 850; RLEE = 800 − 350 = 450. Confere: 850 = 1.300 − 450.</p>
    <h3>Bruto e líquido</h3>
    <p><code>PIL = PIB − Depreciação</code> &nbsp;e&nbsp; <code>IB = IL + Depreciação</code></p>
    <div class="aviso">Cuidado: nem sempre <b>líquido</b> significa "livre de depreciação". Na <b>RLEE</b>, líquido é a renda enviada livre da renda recebida. Nos <b>impostos líquidos</b>, é imposto indireto livre de subsídios.</div>
    <h3>Preços de mercado e custo de fatores</h3>
    <p><code>PIB<sub>CF</sub> = s + j + l + a</code></p>
    <p><code>PIB<sub>PM</sub> = PIB<sub>CF</sub> + impostos indiretos − subsídios = PIB<sub>CF</sub> + impostos líquidos</code></p>
    <p>Quanto maiores os impostos líquidos, maior a diferença entre as duas medidas. <b>Impostos diretos</b> incidem sobre a renda ou o patrimônio das pessoas; <b>indiretos</b>, sobre os produtos e serviços, ou seja, sobre transações. Em Contas Nacionais interessam os <b>indiretos</b>, porque são eles que impactam os preços.</p>
    <p>Para descer do PIB<sub>PM</sub> até qualquer outra medida, basta ir <b>subtraindo</b> o fator considerado: RLEE, depreciação e impostos indiretos, <b>somando</b> os subsídios. O ponto mais depurado é o <b>PNL<sub>CF</sub></b>, equivalente à <b>Renda Nacional</b>.</p>
    <h3>Real e nominal</h3>
    <p>O <b>PIB nominal</b> soma os preços correntes e pode crescer por dois motivos: aumento da produção ou aumento dos preços. O <b>PIB real</b> fixa os preços em um <b>ano-base</b>, sendo medido a <b>preços constantes</b>.</p>
    <p><code>Deflator implícito = PIB nominal ÷ PIB real</code></p>
    <p>Na nanoeconomia de livros: 2018 teve PIB nominal de 2.046 e real de 1.860, logo o deflator foi 2.046 ÷ 1.860 = <b>1,1</b>, ou 110%. E a <b>ilusão monetária</b> é a tendência de considerar a moeda em termos nominais em vez de reais, confundindo o valor nominal com o poder de compra.</p>
    <h3>Potencial, efetivo e hiato</h3>
    <table class="tabela">
      <tr><th>Situação</th><th>Hiato</th><th>Efeito</th></tr>
      <tr><td>PIB efetivo <b>&gt;</b> PIB potencial</td><td>Positivo: hiato <b>inflacionário</b></td><td>Produzindo acima da capacidade; pressão de alta nos preços</td></tr>
      <tr><td>PIB efetivo <b>&lt;</b> PIB potencial</td><td>Negativo: hiato <b>deflacionário</b></td><td>Produzindo abaixo da capacidade; pressão de queda nos preços</td></tr>
    </table>
    <p>PIB potencial é o nível mais alto de produção possível <b>sem causar inflação</b>. Ele tende a crescer ao longo do tempo por avanços tecnológicos, enquanto o efetivo flutua com mais frequência.</p>
    <h3>Os conceitos de renda</h3>
    <ul>
      <li><b>Renda Nacional</b> = PNL<sub>CF</sub>. Atenção: <b>RNB ≠ Renda Nacional</b>;</li>
      <li><b>Renda Pessoal</b> = Renda Nacional − lucros retidos − impostos sobre lucros − contribuições previdenciárias + transferências recebidas;</li>
      <li><b>Renda Pessoal Disponível</b> = Renda Pessoal − impostos diretos;</li>
      <li><b>Renda Disponível Bruta (RDB)</b> = RNB + transferências unilaterais correntes;</li>
      <li><b>Renda Líquida do Governo (RLG)</b> = impostos diretos + impostos indiretos − transferências do governo − subsídios;</li>
      <li><b>Renda Privada Disponível (RPD)</b> = RDB − RLG = C + S.</li>
    </ul>

  colinha: `
    <div class="aviso"><b>Moeda é todo ativo que pode ser utilizado de forma imediata para realizar transações.</b> A definição econômica é mais ampla do que a do dia a dia: ela não se limita a cédulas e moedas metálicas.</div>
    <h3>As três funções</h3>

    <table class="tabela">
      <tr><th>Função</th><th>Significado</th></tr>
      <tr><td><b>Reserva de valor</b></td><td>A moeda pode ser guardada para comprar depois: reter moeda transfere o poder de compra do presente para o futuro. Não é reserva perfeita, porque a <b>inflação</b> corrói o valor. Por isso, em inflação alta, as pessoas trocam moeda por títulos que paguem juros ou por moedas estrangeiras mais estáveis.</td></tr>
      <tr><td><b>Unidade de conta</b></td><td>Permite dizer que uma camisa custa R$ 300 em vez de dizer que custa 100 refrigerantes. A moeda é o <b>padrão oficial de preços</b>. Algumas bancas chamam essa função de <b>Padrão de Valor</b>.</td></tr>
      <tr><td><b>Meio de troca</b></td><td>Serve para comprar qualquer bem ou serviço. Elimina o <b>escambo</b>, a troca direta de uma mercadoria por outra.</td></tr>
    </table>
    <h3>As características (atributos)</h3>
    <p>São qualidades <b>desejáveis</b> para que um ativo possa ser moeda: baixo custo de estocagem, baixo custo de transação, difícil de falsificar, alta durabilidade, divisibilidade, transportável, manuseável e homogeneidade. A lista não é rígida, e cai bem menos que as funções.</p>
    <h3>Os tipos de moeda</h3>

    <p>A ordem cronológica de surgimento é moeda-mercadoria, padrão-ouro e fiduciária. E a conclusão que fecha o tópico: a moeda torna possível <b>separar uma troca em duas partes</b>, uma compra e uma venda, tornando o mercado muito mais eficiente.</p>

    <h3>Os três motivos da demanda por moeda</h3>
    <table class="tabela">
      <tr><th>Motivo</th><th>Relação</th><th>Lógica</th></tr>
      <tr><td><b>Transação</b></td><td>Direta com a <b>renda</b></td><td>Quanto mais renda, mais moeda se quer para comprar e vender</td></tr>
      <tr><td><b>Precaução</b></td><td>Direta com a <b>renda</b></td><td>Guarda-se dinheiro contra imprevistos, e quanto maior a renda, mais se guarda</td></tr>
      <tr><td><b>Especulação</b></td><td><b>Inversa</b> com a <b>taxa de juros</b></td><td>Juros sobem, cai a demanda por moeda para especulação; juros caem, ela aumenta</td></tr>
    </table>
    <p>A demanda por moeda para especulação também é chamada de <b>motivo portfólio</b> ou <b>motivo financeiro</b>, e se relaciona ao <b>custo de oportunidade</b> de manter dinheiro como saldo de caixa. Além disso, para dado nível de renda, a demanda pode ser maior quanto maior for a <b>velocidade de circulação</b> da moeda.</p>
    <h3>Onde está o papel-moeda</h3>
    <p>A emissão é atribuição <b>exclusiva</b> do banco central. Do total emitido, uma parte fica com ele, e o resto circula. Do que circula, parte fica no caixa dos bancos comerciais e o que sobra fica com o público:</p>
    <p><code>PME = PMC + CX<sub>BACEN</sub> = PMPP + CX<sub>BACOMS</sub> + CX<sub>BACEN</sub></code></p>
    <div class="aviso"><b>Público</b>, aqui, é todo mundo que <b>não</b> é Banco Central nem banco comercial. Bancos de investimento e bancos múltiplos <b>sem</b> carteira comercial são, para esse fim, parte do público.</div>
    <h3>Os agregados monetários</h3>
    <table class="tabela">
      <tr><th>Agregado</th><th>Composição</th></tr>
      <tr><td><b>M1</b></td><td>Papel-moeda em poder do público <b>+</b> depósitos à vista</td></tr>
      <tr><td><b>M2</b></td><td>M1 + depósitos de poupança + títulos emitidos por instituições depositárias + depósitos especiais remunerados</td></tr>
      <tr><td><b>M3</b></td><td>M2 + cotas de fundos de investimento + operações compromissadas com títulos federais (Selic)</td></tr>
      <tr><td><b>M4</b></td><td>M3 + títulos públicos federais de alta liquidez</td></tr>
    </table>
    <p>O <b>M1</b> é chamado de <b>Moeda</b> ou <b>Meios de Pagamento Estritos</b>. Os demais são os meios de pagamento em sentido <b>amplo</b>, e os ativos que os compõem são chamados de <b>quase moeda</b>, por terem menos liquidez que os depósitos à vista. O <b>M4</b> é o conceito mais amplo e recebe o nome de <b>poupança financeira</b>. Mas é o M1 que mais cai.</p>
    <div class="aviso"><b>O critério de classificação.</b> A classificação antiga era por <b>grau de liquidez</b>. Desde <b>2001</b>, oficialmente, o critério é o <b>sistema emissor</b>: M1 pelo Banco Central e bancos comerciais (emissores de haveres monetários); M2 por outros bancos e instituições financeiras não bancárias; M3 por fundos de investimento; M4 pelo Governo Federal.<br>Em prova: se houver conflito entre apontar <b>sistema emissor</b> ou <b>liquidez</b>, marque <b>emissor</b>. Mas se a questão disser apenas que são classificados por grau de liquidez, não marque errado só por isso.</div>

    <h3>O sistema de reservas fracionárias</h3>
    <p>O exemplo que constrói a intuição. O Bacen coloca R$ 100 em circulação e reduz o compulsório para 30%:</p>
    <ol>
      <li>Ana deposita os R$ 100 no banco. O banco recolhe R$ 30 ao Bacen;</li>
      <li>Empresta R$ 70 a Bruno, depositando na conta dele. Novo recolhimento de R$ 21;</li>
      <li>Empresta R$ 49 a Carla, que saca o valor.</li>
    </ol>
    <p>O M1 foi de R$ 100 para <b>R$ 219</b>: R$ 100 de depósito de Ana, R$ 70 de depósito de Bruno e R$ 49 de papel-moeda com Carla. O que permitiu isso foi o <b>sistema de reservas fracionárias</b>, em que apenas parte dos depósitos é recolhida e o restante pode ser emprestado.</p>
    <h3>O multiplicador monetário</h3>
    <p>Por definição, é a quantidade de vezes que os meios de pagamento (M1) são maiores que a base monetária (B).</p>
    <div class="aviso"><b>m = M1 ÷ B = 1 ÷ [1 − d(1 − r)]</b><br>
    <b>d</b> = depósitos à vista ÷ M1 (parte dos meios de pagamento mantida em depósitos à vista)<br>
    <b>r</b> = encaixes totais ÷ depósitos à vista (parte dos depósitos que não será emprestada)<br>
    Tanto d quanto r assumem valores <b>entre 0 e 1</b>.</div>
    <p>Há uma forma alternativa, útil quando se conhece <b>c</b>, o percentual de M1 mantido em papel-moeda: <code>m = (c + 1) ÷ (c + r)</code>. Lembrando que <code>c + d = 1</code>, então quanto maior o c, menor o m.</p>
    <h3>As duas relações</h3>
    <table class="tabela">
      <tr><th>Variável</th><th>Relação com m</th><th>Lógica</th></tr>
      <tr><td><b>d</b> (depósitos à vista)</td><td><b>Direta</b></td><td>Quanto mais as pessoas depositam, mais os bancos têm para emprestar</td></tr>
      <tr><td><b>r</b> (encaixes)</td><td><b>Inversa</b></td><td>Quanto mais os bancos guardam, menos crédito concedem</td></tr>
    </table>
    <p>Dois casos-limite conduzem ao mesmo resultado, <b>m = 1</b>, situação em que a base monetária é exatamente igual aos meios de pagamento:</p>
    <ul>
      <li><b>r = 1</b> (encaixes de 100%): tudo o que entra é retido, nada é emprestado;</li>
      <li><b>d = 0</b> (sem depósitos à vista): todo o M1 fica em papel-moeda.</li>
    </ul>
    <p>Exemplos numéricos: d = 0,4 e r = 0,6 dão m = 1,19; d = 0,4 e r = 0,4 dão m = 1,32; d = 0,8 e r = 0,4 dão m = 1,92; d = 0,9 e r = 0,1 dão <b>m = 5,26</b>.</p>
    <h3>Balancetes</h3>
    <p><b>Ativos</b> são bens e direitos, ou seja, as <b>aplicações</b>. <b>Passivos</b> são obrigações e fontes de recursos, ou seja, as <b>captações</b>. Pelo método das partidas dobradas, os dois lados têm o mesmo valor.</p>
    <table class="tabela">
      <tr><th>Balancete do Banco Central: Ativo</th><th>Passivo</th></tr>
      <tr><td>Redescontos e empréstimos<br>Títulos públicos<br>Reservas internacionais<br>Outros ativos</td><td><b>Base monetária</b> (papel-moeda em poder do público e reservas bancárias)<br>Empréstimos no exterior<br>Outras fontes</td></tr>
    </table>
    <p>Três funções do Bacen se refletem em contas do balancete: <b>emitir papel-moeda</b> aparece na base monetária; <b>emprestador de última instância</b> aparece em redescontos e empréstimos; <b>guardião das reservas internacionais</b> aparece em reservas internacionais, expressas em moeda nacional pela taxa de câmbio.</p>
    <div class="aviso">O Banco Central do Brasil <b>não pode</b> financiar o governo comprando títulos <b>diretamente</b> do Tesouro: é proibido por lei. Mas pode e efetivamente compra e vende títulos públicos no mercado, nunca diretamente "para" ou "do" governo, para executar a política monetária (operações de mercado aberto).</div>
    <h3>Bancos comerciais e sistema monetário</h3>
    <p>Quando um banco concede crédito, ele faz uma operação puramente contábil: registra o valor em <b>depósitos à vista</b> (passivo) e o mesmo valor em <b>empréstimos</b> (ativo). Ou seja, <b>ao conceder crédito, o banco cria moeda escritural</b>. Um banco <b>não precisa receber depósitos antes</b> de emprestar; precisa apenas ser autorizado pelo Bacen a criar depósitos à vista.</p>
    <p>Ao consolidar os dois balancetes no <b>balancete do sistema monetário</b>, as rubricas que aparecem como passivo de um e ativo do outro se <b>anulam</b> (reservas bancárias, redescontos), enquanto as que aparecem do mesmo lado nos dois se <b>somam</b> (títulos públicos no ativo). No passivo consolidado destacam-se os <b>meios de pagamento</b>: papel-moeda em poder do público e depósitos à vista.</p>

  colinha: `
    <div class="aviso">Balanço de Pagamentos é <b>o registro sistemático das transações entre residentes e não residentes de um país durante determinado período de tempo</b> (Simonsen e Cysne). Cada termo dessa definição importa.</div>
    <h3>Transações, não pagamentos</h3>
    <p>O nome é impreciso: <b>transações</b> é conceito mais amplo do que pagamentos. O BP registra também operações que <b>não</b> envolvem pagamento, como o auxílio humanitário enviado em produtos ou a remessa que um parente faz do exterior. Os registros são feitos em <b>dólares americanos</b>, pelo alto grau de conversibilidade da moeda, o que permite comparabilidade entre países.</p>
    <h3>BPM6</h3>
    <p>O manual do FMI está na <b>6ª edição</b>, adotada pelo Banco Central do Brasil desde <b>abril de 2015</b> para apuração e divulgação das estatísticas do setor externo. Cuidado com questões e materiais anteriores, que ainda aparecem.</p>
    <h3>Partidas dobradas</h3>
    <p>Cada registro em uma conta tem outro de mesmo valor em outra conta, um a débito e outro a crédito.</p>
    <table class="tabela">
      <tr><th>Lança-se a CRÉDITO</th><th>Lança-se a DÉBITO</th></tr>
      <tr><td>Exportações de bens e serviços<br>Receitas<br><b>Redução</b> de ativos de reserva<br><b>Aumento</b> de obrigações</td><td>Importações de bens e serviços<br>Despesas<br><b>Aumento</b> de ativos de reserva<br><b>Redução</b> de obrigações</td></tr>
    </table>
    <p>Em regra, o lançamento ocorre numa <b>conta operacional</b> (o fato gerador) com contrapartida numa <b>conta de caixa</b> ou de reserva, que registra o movimento dos meios de pagamento internacionais.</p>
    <h3>Residentes e não residentes</h3>
    <p>O critério <b>não é morar ou ter sede</b> no país: é ter ali o <b>centro de interesse econômico predominante</b>, ou seja, produzir e consumir o PIB do país. Configura-se quando há atividade por tempo indeterminado ou por prazo determinado <b>superior a 2 anos</b>, ou transação econômica de escala significante.</p>
    <table class="tabela">
      <tr><th>Residentes</th><th>Não residentes</th></tr>
      <tr><td>Pessoas com residência fixa no país, inclusive estrangeiros</td><td>Pessoas a turismo ou negócios no país</td></tr>
      <tr><td>Pessoas do país no exterior em caráter não permanente</td><td>Pessoas jurídicas instaladas fora do país, <b>inclusive filiais de empresas brasileiras</b></td></tr>
      <tr><td>Pessoas jurídicas instaladas no país, <b>inclusive filiais de empresas estrangeiras</b></td><td><b>Embaixadas instaladas</b> no país</td></tr>
      <tr><td><b>Embaixadas do país</b> no exterior e funcionários em serviço no exterior</td><td>Pessoas em trabalho temporário no país</td></tr>
    </table>
    <p>Há exceção à regra geral: transações em ativos estrangeiros entre <b>dois residentes</b> de setores diferentes podem ser registradas no BP, mas <b>não causam variação nos ativos de reserva</b>.</p>
    <h3>A estrutura</h3>
    <table class="tabela">
      <tr><th>Conta</th><th>Posição</th></tr>
      <tr><td>1. Balança comercial<br>2. Balança de serviços<br>3. Renda primária<br>4. Renda secundária</td><td><b>Acima da linha</b>: transações correntes (1+2+3+4)</td></tr>
      <tr><td>5. Conta capital<br>6. Conta financeira<br>7. Erros e omissões</td><td><b>Abaixo da linha</b>: contas de capitais</td></tr>
    </table>
    <p>A "linha" é o <b>saldo em transações correntes</b>, que também aparece como <b>saldo da conta corrente</b> ou <b>saldo do balanço de pagamentos em transações correntes</b>. É tudo a mesma coisa.</p>
    <table class="tabela">
      <tr><th>Capitais</th><th>Conteúdo</th></tr>
      <tr><td><b>Autônomos</b></td><td>Ativos não financeiros não produzidos, transferências de capital, investimentos diretos, investimentos em carteira, derivativos e outros investimentos. Recebem esse nome porque <b>não têm por objetivo precípuo financiar o BP</b>.</td></tr>
      <tr><td><b>Compensatórios</b></td><td>Movimentos usados precipuamente para <b>financiar o BP</b>: ativos de reserva, empréstimos de organismos internacionais como o FMI e os atrasados. Estes dois últimos são lançados em <b>Outros Investimentos</b>.</td></tr>
    </table>
    <p><b>Erros e omissões</b> tem caráter <b>residual</b>: serve para fazer a conta fechar, já que não é possível registrar todas as transações. Também é chamada de <b>conta de chegada</b>.</p>

    <h3>Balança comercial</h3>
    <p>Registra entradas (importações) e saídas (exportações) de <b>bens e mercadorias, tangíveis ou visíveis</b>. O Brasil usa o método <b>FOB</b> (free on board): cada mercadoria é contabilizada pelo seu valor <b>livre de frete e seguros</b>.</p>

    <p>Exportações são lançadas a <b>crédito</b> e importações a <b>débito</b>, ambas <b>com sinal positivo</b>. Para obter o saldo, <b>subtraem-se</b> as importações das exportações. Até o BPM5 as importações eram lançadas com sinal negativo, de modo que o saldo era obtido <b>somando</b> as duas. É mera questão matemática, mas pode ser explorada em prova.</p>

    <h3>Renda primária</h3>
    <p>Registra entrada e saída de recursos pela <b>remuneração dos fatores de produção</b>: <b>lucros</b> (capital de risco), <b>juros</b> (capital de empréstimo) e <b>salários</b> (trabalho).</p>
    <div class="aviso">A <b>RLEE</b> das Contas Nacionais é o <b>saldo inverso</b> da renda primária. Se a conta tem saldo <b>negativo</b>, o país está <b>enviando</b> renda líquida ao exterior.</div>
    <p>Regra que organiza tudo: em renda primária e secundária lançam-se <b>receitas e despesas</b> da operação; o <b>valor principal</b> vai para a <b>conta financeira</b>. Quem paga US$ 150 por US$ 100 emprestados registra US$ 50 de juros em renda primária e US$ 100 na conta financeira.</p>
    <p>Subcontas: <b>renda de investimento direto</b> (lucros e dividendos de participações, lucros reinvestidos, juros de operações intercompanhia), <b>renda de investimento em carteira</b>, <b>renda de outros investimentos</b> e <b>renda de reservas</b>.</p>
    <h3>Renda secundária</h3>
    <p>Chamava-se <b>Transferências Unilaterais</b> antes do BPM6. Apresenta a renda gerada em uma economia e distribuída para outra. O item mais importante são as <b>transferências pessoais</b>, expansão do antigo conceito de "manutenção de residentes".</p>
    <ul>
      <li>A mensuração mudou: antes, vinculava-se a geração dos recursos ao <b>trabalho</b>. No BPM6, basta que emissor e receptor sejam <b>pessoas físicas</b>, não importando como os recursos foram gerados. O escopo foi <b>ampliado</b>;</li>
      <li>Desde o BPM6, o <b>patrimônio de migrantes</b> não é registrado no BP, porque <b>não há mudança de titularidade</b>;</li>
      <li>Entram aqui também as <b>doações em dinheiro</b>.</li>
    </ul>
    <h3>Conta capital</h3>
    <p>Registra apenas capitais <b>autônomos</b>, em dois itens:</p>
    <ul>
      <li><b>Transferências de capital</b>: a propriedade de um ativo (exceto dinheiro ou estoques) muda de residente para não residente e vice-versa; também transações que obriguem à aquisição ou alienação de um ativo, ou o <b>perdão</b> de uma obrigação pelo credor;</li>
      <li><b>Ativos não financeiros não produzidos</b>: recursos naturais, contratos e licenças, e marketing assets como marcas e patentes.</li>
    </ul>
    <h3>Conta financeira</h3>
    <p>Registra as aquisições de <b>ativos e passivos</b>, com os mesmos nomes da renda primária, mas aqui entram os <b>valores principais</b>.</p>
    <table class="tabela">

      <tr><td><b>Outros investimentos</b></td><td>Conta <b>residual</b>: empréstimos de curto e longo prazo, moedas e depósitos. Destacam-se os <b>atrasados</b> (moratória) e os <b>empréstimos de regularização</b> (FMI, BIS).</td></tr>
      <tr><td><b>Ativos de reserva</b></td><td>Recursos à disposição e sob controle do Banco Central para financiar o BP ou intervir no câmbio.</td></tr>
    </table>
    <p><b>Greenfield</b> é capital novo, que aumenta o estoque de capital da economia; <b>brownfield</b> é apenas mudança de dono entre residente e não residente. Fusões e aquisições entram em investimento direto sem aumentar o capital produtivo. O BP <b>não diferencia</b> os dois: é classificação da literatura.</p>
    <h3>Ativos de reserva</h3>
    <p>Só entram ativos que <b>existem de fato</b> (ativos potenciais não contam) e que tenham <b>liquidez internacional</b>, ou seja, convertam-se facilmente em dólares sem perda de valor. São quatro categorias:</p>
    <ol>
      <li><b>Ouro monetário</b>: em poder do Banco Central, com pureza mínima de <b>99,5%</b>;</li>
      <li><b>Direitos Especiais de Saque (SDR)</b>: criados pelo FMI, com cotação atrelada a uma cesta de moedas (dólar, euro, libra e iene). Representam o direito incondicional de obter moeda estrangeira de <b>outro país membro</b>;</li>
      <li><b>Posição de reserva no FMI</b>: o saldo que o país pode exigir <b>do próprio FMI</b>, e não dos países membros;</li>

    <div class="aviso">O saldo da conta ativos de reserva no BP corresponde à <b>variação</b> do estoque de reservas internacionais. A <b>PII</b> é que mostra o <b>saldo</b>.</div>
    <h3>Posição Internacional de Investimentos</h3>
    <p>O BP registra <b>fluxos</b>; a PII registra <b>estoques</b>. Ela compara os ativos externos (inclusive reservas) com os passivos externos <b>em determinado momento</b>. No Brasil, como os passivos superam os ativos, a posição é chamada de <b>passivo externo líquido</b>. Apurada e publicada pelo <b>Banco Central</b>, trimestralmente, conforme orientações do FMI.</p>
    <p>A estrutura repete as contas da conta financeira, com uma diferença: em <b>ativos de reserva</b> a PII registra o <b>valor total</b> das reservas, e não a variação.</p>

  if (!salvo.som) return;
  try {
    if (!ctxAudio) ctxAudio = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctxAudio.createOscillator();
    const g = ctxAudio.createGain();
    o.type = tipo || "triangle";
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, ctxAudio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.09, ctxAudio.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, ctxAudio.currentTime + dur);
    o.connect(g); g.connect(ctxAudio.destination);
    o.start(); o.stop(ctxAudio.currentTime + dur + 0.02);
  } catch (e) {}
}
const somCerto = () => { bip(660, 0.09); setTimeout(() => bip(990, 0.12), 90); };
const somErro  = () => bip(160, 0.22, "sawtooth");
const somFase  = () => { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => bip(f, 0.14), i * 110)); };

/* ---------- utilitários ---------- */
function embaralhar(a) {
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
function semTags(s) { return String(s).replace(/<[^>]+>/g, ""); }
function opcoesDe(mod, fase, q) {
  return q.t === "pool" ? (q.pool || fase.pool) : q.o;
}
function digitoControle(cod) {
  const d = String(cod).replace(/\D/g, "");
  if (d.length !== 9) return null;
  const pesos = [3, 7, 1, 3, 7, 1, 3, 7, 1];
  let soma = 0, detalhe = [];
  for (let i = 0; i < 9; i++) {
    const alg = Number(d[8 - i]);
    soma += alg * pesos[i];
    detalhe.push({ alg: alg, peso: pesos[i], prod: alg * pesos[i] });
  }
  const resto = soma % 10;
  return { soma: soma, resto: resto, dv: resto === 0 ? 0 : 10 - resto, detalhe: detalhe };
}

/* ---------- progresso ---------- */
function fasesFeitas(m) {
  let n = 0;
  MODULOS[m].fases.forEach(function (_, f) { if (reg(m, f)) n++; });
  return n;
}
function moduloCompleto(m) { return fasesFeitas(m) === MODULOS[m].fases.length; }
function totalFases() {
  return MODULOS.reduce(function (a, mo) { return a + mo.fases.length; }, 0);
}
function totalFeitas() {
  return MODULOS.reduce(function (a, _, m) { return a + fasesFeitas(m); }, 0);
}
function medalhaDe(pct) { return pct === 100 ? "🏅" : pct >= 80 ? "🥈" : "🥉"; }

/* ---------- barra de status ---------- */
function pintarPlacar() {
  if (!jogo) { placar.classList.add("oculto"); return; }
  placar.classList.remove("oculto");
  let hp = "";
  for (let i = 0; i < 3; i++) hp += "<span class='" + (i < jogo.vidas ? "" : "gasta") + "'>◆</span>";
  elVidas.innerHTML = hp;
  elXp.textContent = salvo.xp + jogo.xpFase;
  elCombo.textContent = jogo.seq >= 3 ? "×" + multiplicador() : "";
}
function multiplicador() { return jogo.seq >= 6 ? 3 : (jogo.seq >= 3 ? 2 : 1); }

/* oficina do dígito de controle, usada na colinha da Aula 00 */
function montarOficina() {
  const alvo = document.getElementById("oficina-dv");

function comecarFase(m, i) {
  const f = MODULOS[m].fases[i];
  jogo = {
    mod: m,
    fase: i,
    qs: embaralhar(f.qs),
    idx: 0,
    vidas: 3,
    acertos: 0,
    seq: 0,
    xpFase: 0,
    errados: [],
    travado: false
  };
  elMarca.textContent = MODULOS[m].nome.toUpperCase() + " · " + f.nome.toUpperCase();
  desenharPergunta();
}

function desenharPergunta() {
  const f = MODULOS[jogo.mod].fases[jogo.fase];
  const q = jogo.qs[jogo.idx];
  jogo.travado = false;
  pintarPlacar();

  let html = '<div class="trilho"><i style="width:' + (jogo.idx / jogo.qs.length * 100) + '%"></i></div>';
  html += '<p class="contexto">PERGUNTA ' + (jogo.idx + 1) + " DE " + jogo.qs.length + " · " + f.nome.toUpperCase() + '</p>';
  html += '<p class="enunciado">' + q.p + '</p>';

  if (q.lanc) {
    html += '<div class="lancamento">';
    q.lanc.forEach(function (l) {
      html += '<div class="lin"><span class="dc ' + (l[0] === "D" ? "d" : "c") + '">' + l[0] + '</span>' +
              '<span>' + l[1] + '</span><span>R$ ' + l[2] + '</span></div>';
    });
    html += '</div>';
  }

  if (q.t === "num") {
    html += '<div class="campo-num"><input id="resp-num" inputmode="numeric" maxlength="3" autocomplete="off">' +
            '<button class="btn" id="conf-num">Conferir</button></div>';
  } else {
    const opcoes = opcoesDe(jogo.mod, f, q);
    const ordem = q.t === "pool" ? opcoes.map(function (_, k) { return k; }) : embaralhar(opcoes.map(function (_, k) { return k; }));
    const teclas = ["A", "B", "C", "D", "E", "F", "G", "H"];
    html += '<div class="opcoes' + (opcoes.length > 4 ? " grade" : "") + '" id="opcoes">';
    ordem.forEach(function (orig, pos) {
      html += '<button class="op" data-orig="' + orig + '">' +
              '<span class="tecla">' + teclas[pos] + '</span><span>' + opcoes[orig] + '</span></button>';
    });
    html += '</div>';
  }

  html += '<div id="area-resposta"></div>';
  tela.innerHTML = html;

  if (q.t === "num") {
    const inp = document.getElementById("resp-num");
    inp.focus();
    const enviarNum = function () {
      if (inp.value.trim() === "") { inp.focus(); return; }
      responder(Number(inp.value), q.r);
    };
    document.getElementById("conf-num").onclick = enviarNum;
    inp.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") { ev.preventDefault(); enviarNum(); }
    });
  } else {
    Array.prototype.forEach.call(tela.querySelectorAll(".op"), function (b) {
      b.onclick = function () { responder(Number(b.dataset.orig), q.r); };
    });
  }
  window.scrollTo(0, 0);
}

function responder(escolha, correta) {
  if (jogo.travado) return;
  jogo.travado = true;
  const q = jogo.qs[jogo.idx];
  const acertou = escolha === correta;

  if (q.t !== "num") {
    Array.prototype.forEach.call(tela.querySelectorAll(".op"), function (b) {
      const o = Number(b.dataset.orig);
      b.disabled = true;
      if (o === correta) b.classList.add("certa");
      else if (o === escolha) b.classList.add("errada");
      else b.classList.add("apagada");
    });
  } else {
    document.getElementById("resp-num").disabled = true;
    document.getElementById("conf-num").disabled = true;
  }

  if (acertou) {
    jogo.acertos++;
    jogo.seq++;
    jogo.xpFase += 10 * multiplicador();
    somCerto();
  } else {
    jogo.seq = 0;
    jogo.vidas--;
    jogo.errados.push(q);
    somErro();
  }
  pintarPlacar();

  const area = document.getElementById("area-resposta");
  area.innerHTML =
    '<div class="resposta" role="status">' +
      '<span class="carimbo ' + (acertou ? "ok" : "nao") + ' bate">' + (acertou ? "FECHOU" : "NÃO FECHOU") + '</span>' +
      '<p class="explica">' + q.e + '</p>' +
      '<div class="acoes"><button class="btn" id="seguir">' +
        (jogo.vidas === 0 ? "Ver o resultado" : (jogo.idx + 1 >= jogo.qs.length ? "Encerrar a fase" : "Próxima")) +
      '</button></div>' +
    '</div>';
  const b = document.getElementById("seguir");
  b.onclick = avancar;
  b.focus();
}

function avancar() {
  if (jogo.vidas === 0) return telaFimFase(false);
  jogo.idx++;
  if (jogo.idx >= jogo.qs.length) return telaFimFase(true);
  desenharPergunta();
}

function telaFimFase(concluiu) {
  const m = jogo.mod;
  const i = jogo.fase;
  const mo = MODULOS[m];
  const total = jogo.qs.length;
  const pct = Math.round(jogo.acertos / total * 100);
  const errados = jogo.errados.slice();
  const parciais = jogo.idx + 1;
  const acertos = jogo.acertos;
  const xpFase = jogo.xpFase;

  if (concluiu) {
    salvo.xp += xpFase;
    const r = reg(m, i);
    salvo.fases[m + ":" + i] = { melhor: r ? Math.max(r.melhor, pct) : pct };
    gravar();
    somFase();
  }

  let html = '<p class="contexto">' + mo.nome.toUpperCase() + " · FASE " + (i + 1) + " · " + mo.fases[i].nome.toUpperCase() + '</p>';

  if (concluiu) {
    html += '<div class="nota">' + pct + '%<small>' + acertos + " de " + total +
            " · " + xpFase + ' XP ganhos · ' + medalhaDe(pct) + '</small></div>';
  } else {
    html += '<h2>Acabaram as chances</h2><p class="sub">Você acertou ' + acertos + ' de ' + parciais +
            ' antes de perder as três. A fase reabre com as perguntas embaralhadas, e você já sabe onde tropeçou.</p>';
  }

  if (errados.length) {
    html += '<div class="revisar"><h3>Para revisar</h3><ul>';
    errados.forEach(function (q) {
      html += '<li><b>' + semTags(q.p) + '</b><br>' + q.e + '</li>';
    });
    html += '</ul></div>';
  } else if (concluiu) {
    html += '<p class="sub" style="margin-top:14px">Fase limpa, sem nenhum erro. Guarde essa sensação para a prova.</p>';
  }

  const proxima = i + 1 < mo.fases.length;
  html += '<div class="acoes">';
  if (concluiu && proxima) html += '<button class="btn selo" id="prox">Fase ' + (i + 2) + ': ' + mo.fases[i + 1].nome + '</button>';
  if (concluiu && !proxima) html += '<button class="btn selo" id="dipm">Diploma desta aula</button>';
  html += '<button class="btn fantasma" id="rep">Refazer a fase</button>';
  html += '<button class="btn fantasma" id="col">Reler a colinha</button>';
  html += '<button class="btn fantasma" id="mapa">Fases da aula</button></div>';

  jogo = null; pintarPlacar();
  tela.innerHTML = html;
  elMarca.textContent = mo.nome.toUpperCase() + " · XP " + salvo.xp;

  const p = document.getElementById("prox"); if (p) p.onclick = function () { telaColinha(m, i + 1); };
  const dm = document.getElementById("dipm"); if (dm) dm.onclick = function () { telaDiplomaModulo(m); };
  document.getElementById("rep").onclick = function () { comecarFase(m, i); };
  document.getElementById("col").onclick = function () { telaColinha(m, i); };
  document.getElementById("mapa").onclick = function () { telaMapa(m); };
  window.scrollTo(0, 0);
}

function telaDiplomaModulo(m) {
  jogo = null; pintarPlacar();
  const mo = MODULOS[m];
  const notas = mo.fases.map(function (_, i) { const r = reg(m, i); return r ? r.melhor : 0; });
  const media = Math.round(notas.reduce(function (a, b) { return a + b; }, 0) / notas.length);
  const fracas = mo.fases.filter(function (_, i) { return notas[i] < 80; });
  elMarca.textContent = "DIPLOMA · " + mo.nome.toUpperCase();

  let html =
    '<div class="diploma">' +
      '<p class="contexto" style="margin-bottom:16px">' + mo.subtitulo.toUpperCase() + '</p>' +
      '<h2>' + mo.nome + '</h2>' +
      '<div class="nota" style="margin:18px 0">' + media + '%<small>média das melhores notas nas ' + mo.fases.length + ' fases · ' + salvo.xp + ' XP acumulados</small></div>' +
      '<span class="selo-final">AULA CONCLUÍDA</span>' +
    '</div>';

  if (fracas.length) {
    html += '<div class="revisar"><h3>Onde ainda vale voltar</h3><ul>';
    fracas.forEach(function (f) { html += '<li><b>' + f.nome + '</b>: ' + f.tag + '</li>'; });
    html += '</ul></div>';
  }

  const proxMod = m + 1 < MODULOS.length;
  html += '<div class="acoes">';
  if (proxMod) html += '<button class="btn selo" id="prox">Aula ' + (m + 2) + ': ' + MODULOS[m + 1].nome + '</button>';
  html += '<button class="btn fantasma" id="mapa">Fases desta aula</button>';
  html += '<button class="btn fantasma" id="todas">Todas as aulas</button></div>';
  tela.innerHTML = html;
  const p = document.getElementById("prox"); if (p) p.onclick = function () { telaMapa(m + 1); };
  document.getElementById("mapa").onclick = function () { telaMapa(m); };
  document.getElementById("todas").onclick = telaModulos;
  window.scrollTo(0, 0);
}

function telaDiploma() {
  jogo = null; pintarPlacar();
  let soma = 0, n = 0;
  const fracas = [];
  MODULOS.forEach(function (mo, m) {
    mo.fases.forEach(function (f, i) {
      const r = reg(m, i);

      soma += nota; n++;
      if (nota < 80) fracas.push(mo.nome + " · " + f.nome);

  const media = Math.round(soma / n);
  elMarca.textContent = "DIPLOMA DO CURSO · XP " + salvo.xp;

  let html =
    '<div class="diploma">' +
      '<p class="contexto" style="margin-bottom:16px">FLUXO CIRCULAR · MACROECONOMIA · AULAS 1 A 3</p>' +

      '<div class="nota" style="margin:18px 0">' + media + '%<small>média das melhores notas em ' + n + ' fases · ' + salvo.xp + ' XP acumulados</small></div>' +
      '<span class="selo-final">PRONTA PARA A PROVA</span>' +
    '</div>';

  if (fracas.length) {
    html += '<div class="revisar"><h3>Onde ainda vale voltar</h3><ul>';
    fracas.forEach(function (t) { html += '<li>' + t + '</li>'; });

  html += '<p class="sub" style="margin-top:18px">Revisão espaçada funciona: refaça daqui a dois dias, e de novo em uma semana, as fases de mensurações do produto, criação e destruição de moeda, multiplicador e lançamentos do BP. São as que mais rendem em prova.</p>';
  html += '<div class="acoes"><button class="btn fantasma" id="todas">Todas as aulas</button></div>';

  window.scrollTo(0, 0);
}

};

document.getElementById("btn-zerar").onclick = function () {
  if (!confirm("Apagar todo o progresso e recomeçar do zero?")) return;
  salvo = { xp: 0, fases: {}, som: salvo.som };
  gravar();
  telaCapa();
};

/* ---------- início ---------- */
carregar();
btnSom.textContent = "som: " + (salvo.som ? "ligado" : "desligado");
telaCapa();
</script>
</body>
</html>
