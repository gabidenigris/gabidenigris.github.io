  tag: "Conceitos, modalidades e a nova estrutura de subtítulos",
  colinha: `
    <p><b>Operação de crédito</b> é a entrega de recursos, presente ou futura, contra promessa de devolução acrescida de remuneração. Três elementos a caracterizam: a <b>confiança</b> de que o valor será devolvido, o <b>prazo</b> que separa entrega e devolução, e o <b>risco</b> de que a devolução não ocorra nas condições pactuadas. Todo o arcabouço normativo existe para responder a uma pergunta: <b>quanto do valor emprestado a instituição espera de fato receber de volta?</b></p>
    <p>Para o Cosif, a operação de crédito é um <b>ativo financeiro</b> e segue as mesmas regras de classificação, mensuração e provisão de qualquer instrumento financeiro. O que a Aula 03 acrescenta é o tratamento do <b>risco de crédito</b> propriamente dito.</p>
    <h3>Os cinco Cs</h3>
    <table class="tabela">
      <tr><th>Elemento</th><th>O que avalia</th></tr>
      <tr><td><b>Caráter</b></td><td>Índole e disposição de pagar: histórico de pagamentos, restrições, ações judiciais</td></tr>
      <tr><td><b>Capacidade</b></td><td>Aptidão de gerar recursos: renda (PF); demonstrações e fluxo de caixa (PJ)</td></tr>
      <tr><td><b>Capital</b></td><td>Situação patrimonial: o que o tomador possui além da renda corrente</td></tr>
      <tr><td><b>Colateral</b></td><td>Garantias oferecidas, pessoais ou reais, e sua qualidade e liquidez</td></tr>
      <tr><td><b>Condições</b></td><td>Cenário econômico e setorial e circunstâncias específicas da operação</td></tr>
    </table>
    <p>Os cinco Cs não estão no Cosif, mas foram <b>absorvidos pela linguagem da norma</b>: caráter e capacidade viram indicadores internos e externos de risco de crédito da contraparte; colateral aparece na expectativa de recuperação; condições viram as alterações adversas nas condições de negócios, financeiras ou econômicas.</p>
    <div class="aviso"><b>Partes relacionadas: quase toda fonte erra aqui.</b> O art. 34 da Lei nº 4.595/1964, que <b>proibia</b> empréstimos a diretores, conselheiros, cônjuges, parentes até o 2º grau e sócios com mais de 10%, foi <b>revogado pela Lei nº 13.506/2017</b>. Hoje a operação com parte relacionada é <b>permitida</b>, em condições compatíveis com as de mercado, sem benefícios adicionais, observados limites e vedações da Resolução CMN nº 4.693/2018 — e é registrada em compensação, em 3.0.9.16 — Operações com Partes Relacionadas.</div>
    <h3>A linha do tempo</h3>
    <table class="tabela">
      <tr><th>Quando</th><th>O que vale</th></tr>
      <tr><td>Até 31/12/2024</td><td><b>Resolução CMN nº 2.682/1999</b>: nove níveis de risco de AA a H, percentuais fixos de provisão e migração automática por dias de atraso</td></tr>
      <tr><td>Desde 1º/1/2025</td><td><b>Res. CMN 4.966/2021</b> e <b>Res. BCB 352/2023</b>: três categorias de mensuração e provisão pelo modelo de <b>perdas esperadas em três estágios</b></td></tr>
    </table>
    <p>A expressão <b>provisão para créditos de liquidação duvidosa</b> e a sigla <b>PCLD não constam</b> do Cosif vigente. A nomenclatura é <b>provisão para perdas esperadas associadas ao risco de crédito</b> e, na camada específica, <b>provisão para perdas incorridas</b>.</p>
    <h3>O grupo 1.6 e os seis subgrupos</h3>
    <table class="tabela">
      <tr><th>Subgrupo</th><th>O que reúne</th></tr>

    <p><b>Empréstimo</b> é a operação <b>sem</b> vinculação com aquisição de bem ou serviço ou finalidade específica; <b>financiamento</b> é a operação com <b>destinação específica</b>. E a modalidade que os enunciados antigos chamam de "títulos descontados" hoje se chama <b>direitos creditórios descontados</b>.</p>

    </table>
    <p>Guarde três endereços: <b>.10 saldo contratual, .40 perda incorrida, .60 perda esperada</b>.</p>
    <h3>Operações com característica de concessão de crédito</h3>
    <p>Nem tudo o que gera risco de crédito está no grupo 1.6. A norma trabalha com categoria mais larga, que alcança arrendamento mercantil, valores a receber de transações de pagamento com usuários finais, garantias financeiras prestadas e compromissos de crédito e créditos a liberar. A diferença está na <b>contrapartida da provisão</b>:</p>

/* ---- 3.2 */
{
  nome: "Classificar e mensurar o crédito",
  tag: "A regra específica das operações de crédito",
  colinha: `
    <h3>A regra geral e a regra específica</h3>
    <p>A regra geral você já conhece: dois testes cumulativos e três categorias. Mas, para <b>operações de crédito e demais operações com característica de concessão de crédito</b>, a norma não manda percorrer esse caminho. Ela dá uma <b>regra direta</b>:</p>
    <div class="aviso">Essas operações devem ser classificadas em <b>custo amortizado</b>, salvo <b>três exceções</b>, que vão para <b>valor justo no resultado</b>:<br>
    <b>1.</b> modelo de negócios cujo objetivo seja gerar retorno <b>somente pela venda</b> do ativo;<br>
    <b>2.</b> fluxos de caixa contratuais que <b>não</b> se constituam exclusivamente em pagamentos de principal e juros;<br>
    <b>3.</b> exercício, no reconhecimento inicial e de forma <b>irrevogável</b>, da <b>opção de valor justo</b>.</div>
    <p><b>Consequência que vale ponto:</b> a categoria <b>VJORA não é destino de operação de crédito</b>. Para o crédito, a norma trabalha com duas saídas apenas — custo amortizado (regra) e valor justo no resultado (exceção). Se um enunciado disser que a carteira de crédito gerida para receber e vender vai para VJORA, ele contraria a regra específica.</p>
    <p>Há extensão expressa: a classificação em custo amortizado alcança também os ativos adquiridos ou originados para <b>liquidação total ou parcial com objetivo de reestruturação ou renegociação</b> de operações de crédito. O crédito novo que nasce de uma renegociação também é, em regra, custo amortizado.</p>
    <h3>O teste dos fluxos de caixa aplicado ao crédito</h3>
    <p>Reprovam no teste, entre outras: cláusulas que introduzam <b>alavancagem</b>, como multiplicadores de taxa; a vinculação a variáveis <b>não relacionadas ao risco básico</b>, como preço de mercadoria ou índice de ações; e <b>opções de conversão em instrumento patrimonial</b>. Uma operação de crédito com qualquer dessas cláusulas vai para VJR, <b>ainda que</b> a instituição pretenda mantê-la em carteira até o vencimento.</p>
    <h3>Reconhecimento e mensuração</h3>
    <p>Reconhecimento inicial pelo <b>valor justo</b> — que, na operação originada pela própria instituição, corresponde ao valor efetivamente desembolsado. Custos de transação atribuíveis individualmente são <b>acrescidos</b>; valores recebidos na originação são <b>deduzidos</b>. Presume-se material o custo ou a receita que supere <b>1%</b> da receita total do ativo.</p>
    <table class="tabela">
      <tr><th>Termo</th><th>Definição</th></tr>
      <tr><td><b>Custo amortizado</b></td><td>Valor inicial + receitas geradas − despesas incorridas − parcelas recebidas − <b>saldo da provisão para perdas esperadas</b></td></tr>
      <tr><td><b>Valor contábil bruto</b></td><td>O custo amortizado <b>antes</b> do ajuste por provisão</td></tr>
      <tr><td><b>Método de juros efetivos</b></td><td>Aplicação da taxa efetiva ao <b>valor contábil bruto</b></td></tr>
    </table>
    <p>A <b>base de cálculo da provisão</b> é o valor contábil bruto, e a receita de juros, em regra, também se calcula sobre ele. E a norma fixa uma <b>ordem</b> que a banca gosta de inverter: a provisão para perdas esperadas é reconhecida <b>depois</b> do reconhecimento das receitas. Primeiro se apropria a renda sobre o bruto; depois se mede a provisão.</p>
    <h3>A cessação das receitas no ativo problemático</h3>
    <div class="aviso">É <b>vedado</b> o reconhecimento, no resultado, de receita de qualquer natureza <b>ainda não recebida</b> relativa a ativo com problema de recuperação de crédito. Essas receitas só podem ser apropriadas <b>quando efetivamente recebidas</b>.</div>
    <p>Duas ressalvas completam a regra: a vedação <b>não se aplica</b> às receitas geradas pela <b>recuperação de ativos baixados para prejuízo</b>, que continuam sendo reconhecidas normalmente; e a instituição volta a reconhecer as receitas pelo regime normal, de forma <b>prospectiva</b>, a partir do período em que o instrumento deixar de ser problemático. Caracterizado o ativo como problemático, cessa também o reconhecimento das receitas e despesas apropriadas de forma segregada nos subtítulos de taxa de juros efetiva.</p>
    <h3>O exemplo que fecha a lógica</h3>
    <p>Empréstimo de R$ 500.000,00 por 3 meses a 2% ao mês, com R$ 3.000,00 de custos de transação. O valor contábil bruto inicial é <b>R$ 503.000,00</b> e o montante final, R$ 530.604,00. A taxa efetiva não é 2%, e sim <b>1,796812% ao mês</b>.</p>
    <table class="tabela">
      <tr><th>Mês</th><th>Saldo contratual</th><th>Subtítulo .11</th><th>Valor contábil bruto</th><th>Receita</th></tr>
      <tr><td>Início</td><td>500.000,00</td><td>3.000,00</td><td>503.000,00</td><td>—</td></tr>
      <tr><td>1</td><td>510.000,00</td><td>2.037,97</td><td>512.037,97</td><td>9.037,97</td></tr>
      <tr><td>2</td><td>520.200,00</td><td>1.038,33</td><td>521.238,33</td><td>9.200,36</td></tr>
      <tr><td>3</td><td>530.604,00</td><td>0,00</td><td>530.604,00</td><td>9.365,67</td></tr>
    </table>
    <p>O saldo contratual cresce pela taxa <b>do contrato</b>; a receita entra pela taxa <b>efetiva</b>; e a diferença amortiza o subtítulo .11, que chega a zero no fim. A soma das receitas, R$ 27.604,00, é exatamente a diferença entre o que será recebido e o que foi desembolsado.</p>

    <p>Este conceito é o eixo do assunto. É ele que define o terceiro estágio, dispara a cessação de receitas, aciona a regra de contágio e serve de referência para medir a própria perda esperada.</p>
    <div class="aviso">O instrumento se caracteriza como <b>ativo financeiro com problema de recuperação de crédito</b> quando ocorrer:<br>
    <b>a)</b> atraso <b>superior a 90 dias</b> no pagamento de principal ou de encargos; <b>ou</b><br>
    <b>b)</b> indicativo de que a obrigação <b>não será integralmente honrada</b> nas condições pactuadas, <b>sem que seja necessário recorrer a garantias ou colaterais</b>.</div>
    <p>As duas hipóteses são <b>alternativas</b>, não cumulativas — basta uma. E preste atenção à parte final da alínea "b", que é onde mora a pegadinha: a avaliação é feita <b>ignorando a garantia</b>. Ter garantia robusta <b>não descaracteriza</b> o ativo problemático.</p>
    <p>Além disso, a instituição deve considerar <b>prazo inferior a 90 dias</b> diante de evidência de redução significativa da capacidade financeira da contraparte. O prazo de 90 dias é <b>teto, não é piso</b>.</p>
    <h3>Os indicativos da alínea "b"</h3>
    <ul>
      <li>Constatação de que a contraparte não tem mais capacidade financeira de honrar a obrigação nas condições pactuadas;</li>
      <li><b>Reestruturação</b> do ativo financeiro associado à obrigação;</li>
      <li><b>Falência decretada</b>, recuperação judicial ou extrajudicial ou atos similares pedidos em relação à contraparte;</li>
      <li>Medida judicial que limite, atrase ou impeça o cumprimento das obrigações;</li>
      <li>Diminuição significativa da liquidez do ativo, por redução da capacidade financeira da contraparte;</li>
      <li>Descumprimento de cláusulas contratuais relevantes;</li>
      <li>Negociação de instrumentos de emissão da contraparte com <b>desconto significativo</b> que reflita perdas incorridas.</li>
    </ul>
    <div class="aviso"><b>Reestruturação × renegociação.</b> A <b>reestruturação</b> — renegociação com concessões em razão de deterioração da capacidade de pagamento — é, por si só, indicativo de ativo problemático. A <b>renegociação comum</b> é apenas fato a ser avaliado. É uma diferença de intensidade que a banca explora.</div>
    <h3>A ressalva da recuperação judicial</h3>
    <p>Para não asfixiar o crédito novo, admite-se a <b>não caracterização</b> como problemático dos créditos emitidos ou originados <b>após</b> o deferimento da recuperação judicial ou a homologação da extrajudicial, desde que fique comprovado, de forma documentada, que — além do próprio fato da recuperação — <b>não há outro indicativo</b> de que a obrigação não será honrada.</p>
    <h3>Quando o ativo deixa de ser problemático</h3>
    <p>A saída <b>não é automática</b> nem decorre do simples pagamento de uma parcela: depende de <b>comprovação de que a causa que originou a caracterização deixou de existir</b>. Os efeitos: a receita volta a ser reconhecida por competência, de forma <b>prospectiva</b>, e o instrumento é realocado entre os estágios segundo as regras próprias.</p>
    <h3>Problemático × inadimplido</h3>
    <table class="tabela">
      <tr><th></th><th>Ativo problemático</th><th>Ativo inadimplido</th></tr>
      <tr><td>Gatilho</td><td>Atraso &gt; 90 dias <b>ou</b> indicativo</td><td><b>Exclusivamente</b> atraso &gt; 90 dias</td></tr>

    </table>
    <p>Todo inadimplido é problemático; <b>nem todo problemático é inadimplido</b> — o ativo pode ser problemático sem atraso algum, pela via do indicativo.</p>

  tag: "Alocação, contágio e a régua dos 30 dias",
  pool: ["Primeiro estágio","Segundo estágio","Terceiro estágio"],
  colinha: `
    <p>A instituição aloca cada instrumento em um de três estágios, conforme a deterioração do risco de crédito <b>desde o reconhecimento inicial</b>, e o estágio determina o <b>horizonte</b> sobre o qual a perda esperada é medida.</p>
    <table class="tabela">
      <tr><th>Estágio</th><th>Quem entra</th><th>Como se mede a provisão</th></tr>
      <tr><td><b>Primeiro</b></td><td>O instrumento que, no reconhecimento inicial, não é problemático; e aquele cujo risco não aumentou significativamente desde então</td><td>Probabilidade de se tornar problemático nos <b>próximos 12 meses</b>, ou no prazo esperado se este for inferior</td></tr>
      <tr><td><b>Segundo</b></td><td>O instrumento cujo risco <b>aumentou significativamente</b>; e o instrumento que <b>deixou de ser problemático</b></td><td>Probabilidade de se tornar problemático durante <b>todo o prazo esperado</b></td></tr>
      <tr><td><b>Terceiro</b></td><td>O instrumento <b>com problema de recuperação de crédito</b></td><td>Considerando que ele <b>já é</b> ativo problemático</td></tr>
    </table>
    <div class="aviso"><b>A peculiaridade do segundo estágio.</b> Ele recebe <b>duas populações distintas</b>: quem <b>piorou</b>, vindo do primeiro, e quem <b>melhorou</b> o suficiente para deixar de ser problemático, vindo do terceiro. O ativo que sai do terceiro estágio não volta direto ao primeiro pela porta da frente.</div>
    <p>Há duas exceções a essa trajetória: o instrumento que <b>já estava no terceiro estágio no próprio reconhecimento inicial</b> e depois deixa de ser problemático é realocado <b>diretamente para o primeiro</b>; e admite-se a realocação para o primeiro estágio do instrumento que deixar de ser problemático quando o risco tiver sido reduzido a nível semelhante ao do reconhecimento inicial. Admite-se também a volta do segundo para o primeiro, desde que <b>fatos novos relevantes, devidamente comprovados</b>, indiquem redução do risco a nível semelhante ao da alocação original.</p>
    <h3>A regra de contágio</h3>
    <div class="aviso">Quando um instrumento for alocado no terceiro estágio, a instituição deve realocar <b>todos os instrumentos financeiros da mesma contraparte</b> para o terceiro estágio, <b>na data-base do balancete relativo ao mês</b> em que ocorreu essa alocação.</div>
    <p>Válvula de escape: admite-se, <b>em caráter de excepcionalidade</b>, a não realocação do instrumento que, em virtude de sua <b>natureza ou finalidade</b>, apresente risco de crédito significativamente inferior ao do instrumento problemático da mesma contraparte.</p>
    <h3>O aumento significativo do risco</h3>
    <p>É uma <b>comparação</b>, e é preciso saber o que se compara com o quê: o risco existente <b>quando da alocação original no primeiro estágio</b> contra o risco existente <b>na data da avaliação</b>.</p>
    <p>O risco é determinado pela probabilidade de o instrumento se tornar problemático durante <b>todo o prazo esperado</b>. A norma admite simplificação — considerar a probabilidade nos <b>12 meses seguintes</b> —, salvo em três hipóteses: quando o instrumento só tem obrigações significativas <b>após</b> os 12 meses; quando alterações macroeconômicas relevantes não são adequadamente refletidas na probabilidade de 12 meses; e quando as alterações nos fatores de risco só têm impacto, ou impacto mais significativo, <b>após</b> 12 meses.</p>
    <h3>A régua dos 30 dias</h3>
    <table class="tabela">
      <tr><th>Situação</th><th>Prazo</th></tr>
      <tr><td>Regra geral</td><td>Atraso superior a <b>30 dias</b> caracteriza aumento significativo, <b>independentemente de outros fatores</b></td></tr>
      <tr><td>Com evidências consistentes e verificáveis de que o aumento ocorre em período superior</td><td>Admite-se atraso de até <b>60 dias</b></td></tr>
      <tr><td>Caracterizado que em prazo menor já há aumento significativo</td><td>A instituição <b>deve</b> considerar prazo inferior a 30 dias</td></tr>
    </table>
    <p>Os quatro elementos mínimos a considerar na avaliação: mudanças significativas em <b>indicadores de risco de crédito da contraparte</b>, internos e externos; <b>alterações adversas</b> nas condições de negócios, financeiras ou econômicas; <b>reestruturação de outras obrigações</b> da contraparte; e <b>atraso</b> no pagamento de principal ou encargos.</p>
    <div class="aviso"><b>Não confunda.</b> <b>30 dias</b> é a régua do aumento significativo do risco, que leva do primeiro ao segundo estágio. <b>90 dias</b> é a régua do ativo problemático, que leva ao terceiro.</div>
    <h3>Revisão da alocação</h3>
    <table class="tabela">
      <tr><th>Quando</th><th>Situação</th></tr>
      <tr><td><b>Mensalmente</b></td><td>Em face de atraso no pagamento de principal ou encargos</td></tr>
      <tr><td><b>A cada 6 meses</b></td><td>Instrumentos de uma mesma contraparte cujo montante supere <b>5% do patrimônio líquido</b></td></tr>
      <tr><td><b>A cada 12 meses</b></td><td>Os demais instrumentos</td></tr>
      <tr><td>Sempre que houver fatos novos</td><td>Inclusive alterações nas condições de mercado ou no cenário econômico</td></tr>
      <tr><td>Na renegociação</td><td>Independentemente da periodicidade acima</td></tr>
    </table>
    <p>Há <b>dispensa</b> da revisão semestral e anual para instrumentos de <b>baixo risco de crédito</b>, definido por três condições cumulativas: probabilidade insignificante de o instrumento se tornar problemático no prazo esperado; capacidade comprovada da contraparte de honrar as obrigações; e capacidade financeira não impactada significativamente por alterações adversas. A dispensa <b>não</b> alcança a revisão mensal por atraso, nem a revisão por fatos novos, nem a constituição da provisão.</p>
  `,

{
  nome: "As três camadas de provisão",
  tag: "Perda incorrida, provisão adicional e perda esperada",
  colinha: `
    <p>Se a aula parasse nos estágios, estaria correta e incompleta. Aquela é a camada conceitual, comum às normas internacionais. O Cosif acrescenta <b>duas camadas quantitativas</b>, com percentuais fixos — uma especificidade brasileira, e exatamente o que a banca gosta de cobrar.</p>
    <table class="tabela">
      <tr><th>Subtítulo</th><th>Camada</th><th>Quem constitui</th></tr>
      <tr><td class="cod">.01.40</td><td><b>Perda incorrida</b></td><td><b>Todas</b> as instituições, sobre os ativos <b>inadimplidos</b>, pelos percentuais do <b>Anexo I</b> da Res. BCB 352/2023</td></tr>
      <tr><td class="cod">.01.50</td><td><b>Provisão adicional</b></td><td>Apenas quem adota a <b>metodologia simplificada</b>, pelos percentuais do <b>Anexo II</b></td></tr>
      <tr><td class="cod">.01.60</td><td><b>Perda esperada</b></td><td>A parcela apurada pela instituição que <b>exceder</b> o somatório das duas camadas anteriores</td></tr>
    </table>
    <div class="aviso">A palavra-chave é <b>segregada</b>. As três camadas não se somam em conta única e não se substituem: convivem em subtítulos próprios, e a terceira é <b>residual</b> em relação às duas primeiras. Uma questão que mandar registrar tudo numa só conta de provisão está errada.</div>
    <h3>A perda incorrida</h3>
    <p>É um <b>piso regulatório</b>, sem prejuízo da responsabilidade da instituição de provisionar a totalidade da perda esperada. Dois conceitos definidos expressamente: <b>ativo inadimplido</b> é o ativo com atraso <b>superior a 90 dias</b>; e <b>perda incorrida</b> é um <b>componente</b> da perda esperada. O nível resulta da aplicação dos percentuais do Anexo I, observados os períodos de atraso e as carteiras, sobre o <b>valor contábil bruto</b>.</p>
    <p>Regra de percentual cheio a decorar: contraparte <b>pessoa jurídica em processo falimentar</b> → a provisão para perdas incorridas corresponde, <b>a partir da data da decretação da falência</b>, a <b>100%</b> do valor contábil bruto.</p>
    <h3>As cinco carteiras</h3>
    <table class="tabela">
      <tr><th>Carteira</th><th>O que entra</th></tr>
      <tr><td><b>C1</b></td><td>Créditos garantidos por <b>alienação fiduciária de imóveis</b>; e com garantia fidejussória da <b>União</b>, de governos centrais estrangeiros e bancos centrais, ou de organismos multilaterais de desenvolvimento</td></tr>
      <tr><td><b>C2</b></td><td>Créditos de <b>arrendamento mercantil</b>; garantidos por <b>hipoteca de primeiro grau de imóveis residenciais</b>, por penhor de bens móveis ou imóveis, ou por <b>alienação fiduciária de bens móveis</b>; garantidos por depósitos à vista, a prazo ou de poupança; decorrentes de ativos emitidos por ente público federal ou por instituições autorizadas pelo BCB; com garantia fidejussória dessas instituições; e com seguro de crédito de entidade não relacionada</td></tr>
      <tr><td><b>C3</b></td><td>Créditos de <b>desconto de direitos creditórios</b>, inclusive recebíveis comerciais adquiridos; garantidos por cessão fiduciária, caução ou penhor de direitos creditórios; e com seguro, garantia real ou fidejussória não abrangidos por C1 e C2</td></tr>
      <tr><td><b>C4</b></td><td><b>Capital de giro</b>, adiantamentos sobre contratos de câmbio, adiantamentos sobre cambiais entregues, debêntures e demais títulos de empresas privadas, <b>sem garantias</b>; e crédito rural sem garantias destinado a <b>investimentos</b></td></tr>
      <tr><td><b>C5</b></td><td><b>Crédito pessoal</b> com ou sem consignação, crédito direto ao consumidor, crédito rural não abrangido pela C4, crédito rotativo sem garantias; demais créditos sem garantias; e operações mercantis com característica de concessão de crédito não abrangidas antes</td></tr>
    </table>
    <p>Três regras de desempate: enquadrando-se em mais de uma carteira por ter mais de uma garantia, considera-se a carteira <b>da qual resultar o menor valor de provisão</b> para ativos inadimplidos há menos de um mês, <b>sem proporcionalidade</b>; havendo mais de uma hipoteca sobre o mesmo bem, considera-se a de <b>maior grau</b>; havendo substituição ou agregação de garantia, revisa-se o enquadramento e recalcula-se na data do primeiro balanço ou balancete subsequente.</p>
    <h3>A provisão adicional</h3>
    <p>Exigida de quem adota a <b>metodologia simplificada</b>, complementarmente à perda incorrida. Resulta de três parcelas: percentuais do Anexo II sobre o valor contábil bruto das operações <b>não</b> problemáticas; percentuais fixos sobre as operações <b>problemáticas não inadimplidas</b>; e percentuais fixos sobre as <b>inadimplidas</b>.</p>
    <table class="tabela">
      <tr><th>Carteira</th><th>Problemático não inadimplido</th><th>Inadimplido</th></tr>
      <tr><td>C1</td><td>10,0%</td><td>4,5%</td></tr>
      <tr><td>C2</td><td>33,4%</td><td>3,4%</td></tr>
      <tr><td>C3</td><td>48,7%</td><td>3,7%</td></tr>
      <tr><td>C4</td><td>39,5%</td><td>4,5%</td></tr>
      <tr><td>C5</td><td>53,4%</td><td>3,4%</td></tr>
    </table>
    <div class="aviso"><b>Por que os percentuais do inadimplido são menores?</b> Porque sobre o ativo <b>inadimplido</b> já incide a provisão para <b>perda incorrida</b> do Anexo I, que é pesada — a adicional é apenas complemento. Sobre o problemático que ainda <b>não</b> está inadimplido não há perda incorrida a constituir, e por isso o percentual adicional precisa ser cheio.</div>
    <p>Duas regras específicas: o montante total da provisão para perdas esperadas corresponde, no <b>máximo, a 100%</b> do valor contábil bruto; e no <b>crédito pessoal com consignação</b> sem atraso ou com atraso de até <b>14 dias</b>, a provisão adicional é de <b>0,5%</b>, afastada a regra geral da primeira parcela.</p>
    <p>A adicional também é exigida de quem <b>não</b> adota a simplificada, quando os modelos, controles internos e gestão de riscos não forem compatíveis, ou quando a instituição não comprovar os requisitos da metodologia completa — e nesse caso a exigência <b>não dispensa</b> a aplicação da metodologia completa. Ficam <b>de fora</b> da adicional as operações de programas federais de enfrentamento de crises cujo risco seja assumido pela União.</p>
    <h3>Quem usa qual metodologia</h3>
    <table class="tabela">
      <tr><th>Segmento</th><th>Metodologia</th></tr>
      <tr><td><b>S1, S2 e S3</b></td><td><b>Completa</b></td></tr>
      <tr><td><b>S4 e S5</b> (e integrantes de conglomerado prudencial nesses segmentos)</td><td><b>Simplificada</b>, com a adicional do Anexo II</td></tr>
      <tr><td><b>S4</b> com prévia autorização do BCB</td><td>Pode usar a completa; o retorno à simplificada depende de aprovação do BCB</td></tr>
    </table>
    <h3>Avaliação coletiva</h3>
    <p>Pode ser feita por carteira, desde que os instrumentos atendam a <b>três condições cumulativas</b>: pertençam ao mesmo <b>grupo homogêneo de risco</b>; sejam definidos na política de crédito como <b>operações de varejo</b>; e tenham <b>gerenciamento massificado</b>. Duas regras deixam de se aplicar na avaliação coletiva: a exigência de consistência da probabilidade entre instrumentos da mesma contraparte e a regra de saída individual da condição de problemático.</p>
  `,

  nome: "Baixa, recuperação e cessão",
  tag: "Prejuízo, renegociação e transferência de ativos",
  colinha: `
    <h3>Quando se baixa</h3>
    <div class="aviso">O ativo financeiro deve ser baixado em virtude de perdas esperadas <b>caso não seja provável que a instituição recupere o seu valor</b>.</div>
    <p>Repare: a baixa <b>não tem gatilho temporal</b>. Não existe, no regime vigente, regra de baixa obrigatória após determinado número de dias. O critério é de <b>expectativa</b> — deixando de ser provável a recuperação, baixa-se. A instituição deve estabelecer critérios consistentes, verificáveis e documentados.</p>
    <p>A baixa é evento <b>contábil</b>, não jurídico: retira o ativo do balanço, mas <b>não extingue</b> a obrigação do devedor nem o direito de cobrar. Tanto é assim que a norma exige controles para identificação dos ativos baixados <b>enquanto não esgotados os procedimentos de cobrança</b>, observado prazo mínimo de <b>5 anos</b>.</p>
    <h3>A renegociação de crédito baixado</h3>
    <div class="aviso">Os instrumentos baixados que forem renegociados devem ser alocados, <b>na data da renegociação</b>, no <b>terceiro estágio</b>, com provisão para perdas esperadas igual a <b>100%</b> do valor do instrumento.</div>
    <p>A mesma regra se aplica aos instrumentos usados para <b>liquidação ou refinanciamento</b> de instrumentos baixados. Não adianta trocar o crédito baixado por um contrato novo: o novo nasce no terceiro estágio, integralmente provisionado. Válvula de escape: admite-se provisão inferior a 100% quando houver <b>amortização significativa</b> da operação, ou quando <b>fatos novos relevantes, devidamente comprovados</b>, indicarem melhora significativa na capacidade da contraparte.</p>
    <p>Resultado prático: o efeito no patrimônio líquido é <b>nulo</b> no momento da renegociação, porque o ativo reconhecido vem integralmente retificado. E há vedação expressa: instrumentos baixados a prejuízo na vigência da regulamentação anterior <b>não podem retornar ao ativo</b>, salvo a única exceção da renegociação.</p>
    <h3>A recuperação</h3>
    <table class="tabela">
      <tr><th>Código</th><th>Rubrica</th></tr>
      <tr><td class="cod">7.1.9.20</td><td>Recuperação de Ativos Financeiros Baixados como Prejuízo</td></tr>
      <tr><td class="cod">7.1.9.92</td><td>Reversão de Provisão para Risco de Crédito</td></tr>
      <tr><td class="cod">8.1.9.92</td><td>(–) Despesas de Provisão para Risco de Crédito</td></tr>
    </table>
    <h3>Venda ou transferência de ativos financeiros</h3>
    <p>A pergunta da norma não é "houve venda?", e sim <b>"quem ficou com o risco?"</b>. São quatro categorias:</p>
    <table class="tabela">
      <tr><th>Categoria</th><th>O que acontece no cedente</th></tr>
      <tr><td><b>Transferência substancial</b> dos riscos e benefícios</td><td>O ativo é <b>baixado</b> e o resultado da negociação vai ao resultado do período, de forma segregada</td></tr>
      <tr><td><b>Retenção substancial</b></td><td>O ativo <b>permanece integralmente</b>. Os valores recebidos entram no ativo em contrapartida a um <b>passivo</b> pela obrigação assumida</td></tr>
      <tr><td>Sem transferência nem retenção, <b>com transferência do controle</b></td><td>Mesmo tratamento da transferência substancial, reconhecendo-se separadamente novos direitos e obrigações</td></tr>
      <tr><td>Sem transferência nem retenção, <b>com retenção do controle</b></td><td>O ativo permanece na proporção do <b>envolvimento continuado</b>, com reconhecimento do passivo pela obrigação</td></tr>
    </table>
    <p>Na <b>retenção substancial</b> — a cessão com coobrigação típica — <b>não há resultado de cessão na data da operação</b>: não há baixa e não há lucro ou prejuízo apurado no ato. O que existe é uma <b>captação disfarçada de venda</b>, com receitas e despesas apropriadas pelo prazo remanescente, no mínimo mensalmente.</p>
    <p>No <b>envolvimento continuado</b>, o valor mantido no ativo é a medida da exposição remanescente às variações do ativo transferido. Quando o envolvimento assume a forma de <b>garantia</b>, o valor a manter é o <b>menor</b> entre o valor do ativo e o valor garantido.</p>
    <h3>Regras comuns a todas as categorias</h3>
    <ul>
      <li>Ativo vendido, passivo gerado, receitas e despesas registrados de forma <b>segregada</b>, <b>vedada a compensação</b>;</li>
      <li>Operação cuja cobrança permaneça sob responsabilidade do cedente é registrada como <b>cobrança simples por conta de terceiros</b>;</li>
      <li>Benefícios e obrigações do contrato de cobrança são registrados como ativos e passivos pelo <b>valor justo</b>;</li>
      <li>As regras alcançam a venda de <b>parcela</b> de ativo ou de grupo de ativos similares, mas só se aplicam à parcela quando o objeto for <b>parte especificamente identificada</b> do fluxo de caixa ou <b>proporção</b> do fluxo; nos demais casos, aplicam-se ao ativo na totalidade.</li>
    </ul>
    <p>O cessionário registra a operação adquirida <b>conforme a modalidade da operação original</b>: uma carteira de consignado comprada entra como consignado, não como "direitos adquiridos" genéricos. E, quando há retenção de risco em cessão de crédito com o ativo já baixado, o Cosif reserva conta de compensação própria: <b>3.0.1.85 / 9.0.1.85 — Retenção de Risco em Cessões de Crédito — Operação Baixada</b>.</p>

{
  nome: "O contrato de leasing",
  tag: "Partes, cláusulas obrigatórias, prazos e VRG",
  colinha: `
    <p><b>Arrendamento mercantil</b> (leasing) é o contrato pelo qual uma parte adquire um bem escolhido pela outra e lhe cede o uso por prazo determinado, mediante contraprestações. Na forma, é um <b>aluguel</b>; na essência econômica, um <b>financiamento</b>.</p>
    <p>A definição funcional que a norma vigente adotou: <b>arrendamento é um contrato, ou parte de um contrato, que transfere o direito de usar um ativo (ativo subjacente) por um período de tempo, em troca de contraprestação</b>. Três palavras com consequência: <b>contrato ou parte de contrato</b> (um contrato de serviços pode conter arrendamento embutido); <b>direito de usar</b>, não de propriedade; e <b>período de tempo</b>, o que exclui cessão perpétua.</p>
    <h3>As três figuras</h3>
    <table class="tabela">
      <tr><th>Figura</th><th>Papel</th></tr>
      <tr><td><b>Fornecedor</b></td><td>Vende o bem à arrendadora, segundo especificações da arrendatária. <b>Não é parte</b> do contrato de arrendamento</td></tr>
      <tr><td><b>Arrendadora</b></td><td>Capta recursos, adquire o bem e cede o uso. É a <b>proprietária</b> durante a vigência</td></tr>
      <tr><td><b>Arrendatária</b></td><td>Escolhe o bem, recebe posse e uso, paga as contraprestações e exerce a opção ao final</td></tr>
    </table>
    <p>Ao término, a arrendatária tem <b>três caminhos</b>: prorrogar o contrato, devolver o bem ou adquiri-lo pelo preço estabelecido.</p>
    <div class="aviso"><b>A assimetria que a banca inverte.</b> A <b>arrendadora é sempre pessoa jurídica</b>; a <b>arrendatária pode ser pessoa jurídica ou natural</b> — a Lei nº 6.099/1974 admitia originalmente só PJ, e a Lei nº 7.132/1983 passou a admitir também a pessoa física. E o bem tem de ser adquirido <b>segundo as especificações da arrendatária e para uso próprio dela</b>.</div>
    <p>Quem pode <b>operar</b>: as <b>sociedades de arrendamento mercantil</b> e os <b>bancos múltiplos com carteira de arrendamento mercantil</b>.</p>
    <h3>Cláusulas obrigatórias</h3>
    <p>Os contratos são formalizados por instrumento público ou particular e devem conter, no mínimo: descrição dos bens; prazo; valor das contraprestações ou fórmula de cálculo e critério de reajuste; <b>forma de pagamento por períodos não superiores a um semestre</b> (até <b>um ano</b> nas operações que beneficiem atividades rurais); condições para o exercício da opção de renovação, devolução ou aquisição; <b>concessão de opção de compra</b> com preço ou critério de fixação; a <b>taxa equivalente aos encargos financeiros</b>; despesas e encargos adicionais; condições de substituição dos bens; responsabilidades quanto a uso indevido, seguro, danos a terceiros e vícios; faculdade de <b>vistoria</b> pela arrendadora; obrigações em caso de inadimplemento e perecimento; e a faculdade de <b>transferir a terceiros no País</b>, com anuência expressa da arrendadora.</p>
    <h3>A taxa equivalente</h3>
    <p>É a que <b>equaliza o valor do bem arrendado, na data da contratação, ao valor presente de todos os recebimentos e pagamentos</b> previstos ao longo do contrato, incluindo, na ausência de valor residual garantido, o valor presente provável de realização do bem ao final, deduzidos os custos de venda. Na prática, é a mesma <b>taxa de juros implícita</b> de que trata o CPC 06 — regulação e contabilidade convergiram no mesmo conceito.</p>
    <h3>Prazos mínimos</h3>
    <table class="tabela">
      <tr><th>Modalidade</th><th>Vida útil do bem</th><th>Prazo mínimo</th></tr>
      <tr><td>Financeiro</td><td>Igual ou inferior a 5 anos</td><td><b>2 anos</b></td></tr>
      <tr><td>Financeiro</td><td>Superior a 5 anos</td><td><b>3 anos</b></td></tr>
      <tr><td>Operacional</td><td>Qualquer</td><td><b>90 dias</b></td></tr>
    </table>
    <p>Contam-se entre a <b>data de entrega</b> dos bens, comprovada por termo de aceitação e recebimento, e a data de vencimento da <b>última contraprestação</b>. Se a opção de compra for exercida <b>antes</b> do prazo mínimo, a operação passa a ser considerada de <b>compra e venda a prazo</b>, com todas as consequências da descaracterização. A quitação <b>depois</b> de vencido o prazo mínimo não descaracteriza nada.</p>
    <h3>Valor residual garantido</h3>
    <p><b>VRG</b> é o preço mínimo assegurado contratualmente para o exercício da opção de compra ao final. Na prática brasileira, é o traço que distingue as modalidades: no <b>financeiro há VRG</b>; no <b>operacional, não</b>.</p>
    <div class="aviso"><b>Antecipar o VRG não é exercer a opção de compra.</b> A norma admite expressamente que a arrendatária pague o VRG <b>em qualquer momento</b> durante a vigência, e esclarece que esse pagamento <b>não caracteriza</b> o exercício da opção. Admite também o reajuste do preço da opção e do próprio VRG.</div>
    <h3>Tributação</h3>
    <p>Incide <b>ISS</b>. <b>Não incide IOF</b>. E o motivo econômico de se usar leasing em vez de financiamento é o benefício de <b>depreciação acelerada</b>: admite-se redução de até <b>30%</b> no prazo de vida útil do bem para efeito da despesa dedutível. O benefício nasce no arrendador, proprietário formal, e costuma ser repassado à arrendatária no preço.</p>
    <p>Por fim: a apuração dos tributos federais continua sendo feita <b>exclusivamente pela legislação tributária</b>. Mudou a contabilidade; não mudou o imposto.</p>
  `,

    <h3>O critério</h3>
    <p>A classificação depende de <b>uma única pergunta</b>: os riscos e benefícios inerentes à propriedade do ativo foram <b>substancialmente transferidos</b> ao arrendatário?</p>
    <table class="tabela">
      <tr><th>Modalidade</th><th>Critério</th></tr>
      <tr><td><b>Financeiro</b></td><td>Transfere substancialmente <b>todos</b> os riscos e benefícios inerentes à propriedade</td></tr>
      <tr><td><b>Operacional</b></td><td><b>Não</b> transfere substancialmente</td></tr>
    </table>
    <p>Os <b>riscos</b> incluem perda por capacidade ociosa, obsolescência tecnológica e variação de retorno por alterações econômicas. Os <b>benefícios</b> são a expectativa de operação lucrativa ao longo da vida econômica e os ganhos de valorização ou realização do valor residual.</p>
    <h3>Os indicadores</h3>
    <p>A norma não tem teste numérico rígido. Lista situações que, isoladas ou em conjunto, <b>normalmente</b> levam à classificação como financeiro:</p>
    <ul>
      <li>O arrendamento <b>transfere a propriedade</b> ao final do prazo;</li>
      <li>Há opção de compra por preço <b>suficientemente inferior</b> ao valor justo esperado, de modo que seja razoavelmente certo que será exercida;</li>
      <li>O prazo cobre a <b>maior parte da vida econômica</b> do ativo, ainda que a propriedade não seja transferida;</li>
      <li>O valor presente dos pagamentos corresponde a <b>pelo menos substancialmente todo</b> o valor justo do ativo;</li>
      <li>O ativo é de <b>natureza especializada</b>, de modo que só o arrendatário pode usá-lo sem grandes modificações.</li>
    </ul>
    <p>Indicadores complementares: perdas do cancelamento antecipado por conta do arrendatário; ganhos e perdas do valor residual revertem para o arrendatário; e faculdade de continuar por período adicional com pagamento substancialmente inferior ao de mercado.</p>
    <div class="aviso">É lista de <b>indicadores</b>, não de requisitos cumulativos. A classificação depende da <b>essência</b> da operação, e é por isso que a norma exige julgamento e não fixa percentuais.</div>
    <h3>A prática brasileira</h3>
    <p>A esmagadora maioria dos contratos é <b>financeiro</b>, por três razões concorrentes: há transferência de riscos e benefícios; há <b>VRG</b>; e esse valor residual costuma ser <b>simbólico</b> diante do valor de mercado do bem, de modo que a aquisição nasce praticamente certa.</p>

    <h3>As sete regras de aplicação</h3>

/* ---- 4.3 */
{
  nome: "A contabilidade do arrendatário",
  tag: "Direito de uso, passivo e as duas dispensas",
  colinha: `
    <h3>Quando existe um arrendamento</h3>
    <p>Antes de contabilizar, é preciso saber se <b>há</b> arrendamento. O CPC 06 (R2) substituiu o critério formal por um teste de <b>duas partes</b>: um contrato é, ou contém, um arrendamento se transferir o <b>direito de controlar o uso de um ativo identificado</b> por um período de tempo, em troca de contraprestação.</p>
    <ul>
      <li><b>Ativo identificado</b> — especificado no contrato, explícita ou implicitamente. <b>Não há</b> ativo identificado quando o fornecedor tem <b>direito substantivo de substituição</b>, isto é, pode trocar o ativo por outro ao longo de todo o período e obtém benefício econômico com isso. Uma parcela <b>fisicamente distinta</b> de um ativo maior (um andar de um edifício) é ativo identificado; uma capacidade não distinta (fração indeterminada da capacidade de um duto) não é.</li>
      <li><b>Direito de controlar o uso</b> — deter, ao longo de todo o período, <b>dois direitos ao mesmo tempo</b>: o de obter substancialmente todos os benefícios econômicos do uso e o de <b>dirigir o uso</b>, decidindo como e para que fim o ativo é empregado.</li>
    </ul>
    <p>A consequência prática: a análise deixou de olhar para o <b>nome</b> do contrato. Um contrato de prestação de serviços, de transporte ou de hospedagem de dados pode conter arrendamento embutido; e um contrato chamado de arrendamento pode não conter arrendamento nenhum, se o fornecedor puder substituir livremente o ativo.</p>
    <h3>O prazo</h3>
    <p>É o período <b>não cancelável</b>, acrescido dos períodos cobertos por opção de <b>prorrogação</b> quando for razoavelmente certo que a arrendatária a exercerá, e dos períodos cobertos por opção de <b>rescisão</b> quando for razoavelmente certo que ela <b>não</b> a exercerá. É um dos pontos de maior julgamento e um dos que mais afetam o valor do passivo reconhecido.</p>
    <h3>As duas dispensas</h3>
    <table class="tabela">
      <tr><th>Dispensa</th><th>Alcance</th><th>Como se escolhe</th></tr>
      <tr><td><b>Curto prazo</b></td><td>Prazo <b>igual ou inferior a 12 meses</b>, desde que o contrato <b>não contenha opção de compra</b></td><td>Por <b>classe de ativo subjacente</b></td></tr>
      <tr><td><b>Ativo de baixo valor</b></td><td>Ativos de pequeno valor quando novos: computadores pessoais, telefones, mobiliário de escritório</td><td><b>Contrato a contrato</b></td></tr>
    </table>
    <p>Exercida a dispensa, a arrendatária reconhece os pagamentos como <b>despesa</b>, em base linear ou outra base sistemática que represente melhor o padrão de benefício.</p>
    <div class="aviso"><b>Aqui o Cosif tem palavra própria, e é ouro para a prova.</b> Para os contratos dispensados, o elenco criou o par <b>3.0.8.40 / 9.0.8.40 — Contratos de Arrendamento: Valores a Pagar</b>, que registram a <b>totalidade dos valores a pagar não descontados</b>. O que sai do balanço patrimonial <b>entra na compensação</b>: a obrigação não desaparece do sistema contábil, apenas muda de lugar. A despesa corre por 8.1.3.88 — Despesas de Arrendamento de Bens.</div>
    <h3>O reconhecimento inicial</h3>
    <table class="tabela">
      <tr><th>Elemento</th><th>Composição</th></tr>
      <tr><td><b>Passivo de arrendamento</b></td><td><b>Valor presente</b> dos pagamentos ainda não efetuados: parcelas fixas (deduzidos incentivos a receber); parcelas variáveis que dependam de índice ou taxa; valores que se espera pagar por garantia de valor residual; preço de exercício da opção de compra, quando razoavelmente certo; e multas por rescisão, quando o prazo refletir essa opção</td></tr>
      <tr><td><b>Ativo de direito de uso</b></td><td>O valor do <b>passivo</b>, acrescido dos <b>pagamentos feitos até a data de início</b>, dos <b>custos diretos iniciais</b> e da estimativa de custos de <b>desmontagem, remoção e restauração</b>, e deduzido dos incentivos recebidos</td></tr>
    </table>
    <p><b>Ativo e passivo não nascem iguais</b> — e é por isso que existem contas próprias para as antecipações (1.7.6.10) e para os custos diretos iniciais.</p>
    <h3>A taxa de desconto</h3>
    <p>A <b>taxa de juros implícita</b> no arrendamento, <b>se puder ser determinada com facilidade</b>. Não sendo possível, a <b>taxa incremental sobre empréstimo</b> da arrendatária — a que ela pagaria para tomar emprestado, por prazo e garantia semelhantes, os recursos necessários para obter ativo de valor semelhante. Na prática o arrendatário raramente conhece o valor residual não garantido e os custos diretos iniciais do arrendador, de modo que <b>prevalece a taxa incremental</b>.</p>
    <h3>Mensuração subsequente e o efeito de curva</h3>
    <table class="tabela">
      <tr><th>Elemento</th><th>Como evolui</th></tr>
      <tr><td>Ativo de direito de uso</td><td>Pelo <b>custo</b>, deduzido da depreciação acumulada e das perdas por redução ao valor recuperável, e ajustado por remensuração do passivo. Deprecia-se pelo <b>prazo do arrendamento</b>, ou pela <b>vida útil</b> quando houver transferência de propriedade ou exercício certo da opção de compra</td></tr>
      <tr><td>Passivo de arrendamento</td><td>Pelo <b>custo amortizado</b>: aumenta pelos juros à taxa de desconto e diminui pelos pagamentos</td></tr>
    </table>
    <div class="aviso"><b>O efeito de curva.</b> O ativo se deprecia de forma <b>linear</b>; o passivo gera juros <b>decrescentes</b>, porque o saldo devedor cai. A soma de depreciação e despesa financeira é, portanto, <b>maior no início e menor no fim</b> — ao contrário da despesa linear do antigo tratamento de aluguel.</div>
    <p><b>Remensuração</b>: o passivo é remensurado, com contrapartida no próprio ativo, quando houver alteração no prazo, na avaliação sobre a opção de compra, nos valores esperados por garantia de valor residual ou nos pagamentos que dependam de índice ou taxa. Se o ajuste reduzir o ativo a zero, o excedente vai ao <b>resultado</b>. Já a <b>modificação do contrato</b>: quando amplia o alcance com preço compatível, é contabilizada como <b>arrendamento separado</b>; nos demais casos, remensura-se o passivo e ajusta-se o ativo.</p>
    <h3>As contas</h3>
    <table class="tabela">
      <tr><th>Código</th><th>Rubrica</th></tr>

  nome: "A contabilidade do arrendador",
  tag: "Investimento líquido, bens arrendados e perdas esperadas",
  colinha: `
    <p>Do lado do arrendador <b>nada foi unificado</b>. É aqui que a prova do Banco Central costuma se concentrar, porque a instituição supervisionada é, em regra, a arrendadora.</p>
    <h3>Arrendamento financeiro</h3>
    <p>Havendo transferência substancial dos riscos e benefícios, o arrendador <b>baixa o ativo subjacente</b> e reconhece um <b>recebível</b>, medido pelo <b>investimento líquido no arrendamento</b>.</p>
    <table class="tabela">
      <tr><th>Conceito</th><th>Composição</th></tr>
      <tr><td><b>Investimento bruto</b></td><td>Pagamentos do arrendamento a receber + valor residual <b>não garantido</b>, <b>sem desconto</b></td></tr>
      <tr><td><b>Investimento líquido</b></td><td>O <b>valor presente</b> desses dois componentes, descontado pela <b>taxa de juros implícita</b></td></tr>
      <tr><td><b>Receita financeira não realizada</b></td><td>A <b>diferença</b> entre bruto e líquido, apropriada ao longo do prazo</td></tr>
    </table>
    <table class="tabela">
      <tr><th>Código</th><th>Rubrica</th></tr>
      <tr><td class="cod">1.7.4.10</td><td><b>Financeiro</b></td></tr>
      <tr><td class="cod">1.7.4.10.10</td><td>Arrendamento a Receber</td></tr>
      <tr><td class="cod">1.7.4.10.20</td><td>Valor Residual Não Garantido</td></tr>
      <tr><td class="cod">1.7.4.10.40</td><td>(–) Perda Incorrida Associada ao Risco de Crédito</td></tr>
      <tr><td class="cod">1.7.4.10.50</td><td>(–) Provisão Adicional</td></tr>
      <tr><td class="cod">1.7.4.10.60</td><td>(–) Perda Esperada Associada ao Risco de Crédito</td></tr>
      <tr><td class="cod">1.7.4.10.70</td><td>(+/–) Ajuste de Hedge de Valor Justo</td></tr>
      <tr><td class="cod">7.1.2.40.10</td><td>Rendas de Arrendamento: Arrendador — Financeiro</td></tr>
    </table>
    <p>A função da conta de valor residual não garantido é cobrável na literalidade: registra o <b>valor presente</b>, líquido de eventual redução ao valor recuperável, do valor residual não garantido incluído na mensuração do <b>investimento bruto</b>, descontado à <b>taxa de juros implícita</b>.</p>
    <div class="aviso"><b>Compare com o crédito.</b> A estrutura de 1.7.4.10 é a mesma das operações de crédito da Aula 03: saldo, retificadoras em .40, .50 e .60, ajuste de hedge em .70. Não é coincidência — o arrendamento financeiro é, para a norma, <b>operação com característica de concessão de crédito</b>, e entra no mesmo modelo de perdas esperadas.</div>
    <h3>Arrendamento operacional</h3>
    <p>Não havendo transferência substancial, o arrendador <b>mantém o ativo</b> no balanço, continua a <b>depreciá-lo</b> e reconhece a receita das contraprestações ao longo do prazo, em <b>base linear</b> ou outra base sistemática.</p>
    <table class="tabela">
      <tr><th>Código</th><th>Rubrica</th></tr>
      <tr><td class="cod">1.7.4.20</td><td><b>Operacional</b>, com Arrendamentos a Receber em .10</td></tr>
      <tr><td class="cod">1.7.4.20.40 / .60</td><td>(–) Perda Incorrida e (–) Perda Esperada</td></tr>
      <tr><td class="cod">2.3.2.10</td><td><b>Bens Arrendados</b>, no Ativo de Arrendamento (grupo 2.3)</td></tr>
      <tr><td class="cod">2.3.2.10.10 / .20 / .30 / .40</td><td>Valor Contábil do Bem; <b>Custos Diretos Iniciais</b>; (–) Depreciação acumulada; (–) Redução ao valor recuperável</td></tr>
      <tr><td class="cod">7.1.2.40.20</td><td>Rendas de Arrendamento: Arrendador — Operacional</td></tr>
      <tr><td class="cod">8.1.3.70</td><td>(–) Arrendador — Operacional (depreciação e amortização)</td></tr>
    </table>
    <p>Quando o ativo subjacente é <b>intangível</b>, o registro se dá em 2.3.5.10, com a mesma estrutura. E repare: no operacional, os <b>custos diretos iniciais</b> são adicionados ao valor contábil do bem e reconhecidos como despesa ao longo do prazo.</p>
    <h3>O quadro comparativo</h3>
    <table class="tabela">
      <tr><th>Aspecto</th><th>Financeiro</th><th>Operacional</th></tr>
      <tr><td>O bem permanece no ativo do arrendador?</td><td><b>Não</b>, é baixado</td><td><b>Sim</b>, no grupo 2.3</td></tr>
      <tr><td>O que se reconhece no ativo</td><td>Investimento líquido, em 1.7.4.10</td><td>Contraprestações a receber (1.7.4.20) <b>e</b> o próprio bem</td></tr>
      <tr><td>Depreciação pelo arrendador</td><td>Não há</td><td>Há, em 8.1.3.70</td></tr>
      <tr><td>Natureza da receita</td><td>Receita <b>financeira</b>, pela taxa implícita</td><td>Receita de arrendamento, em <b>base linear</b></td></tr>
      <tr><td>Valor residual não garantido</td><td>Compõe o investimento líquido, em conta própria</td><td>Não se aplica</td></tr>
      <tr><td>Retificadoras de perda</td><td>Incorrida, adicional e esperada</td><td>Incorrida e esperada</td></tr>
    </table>
    <h3>Perdas esperadas no arrendamento</h3>
    <p>O arrendamento <b>não ficou de fora</b> do modelo de perdas de crédito. A norma o inclui expressamente entre as operações com característica de concessão de crédito. Duas particularidades:</p>
    <ul>
      <li><b>A base de cálculo é diferente.</b> A provisão não incide sobre o valor contábil bruto, e sim sobre o <b>valor presente dos montantes totais a receber</b>, apurado pela <b>taxa equivalente aos encargos financeiros</b> previstos em contrato ou, na falta, pela taxa que equaliza o valor do bem ao valor presente dos fluxos, incluído o VRG ou, na ausência, o valor provável de realização do bem, deduzidos os custos de venda.</li>
      <li><b>Há provisão no passivo.</b> As <b>contraprestações vincendas</b> de arrendamento <b>operacional</b> geram provisão em <b>4.8.5.10</b>, no passivo, e não em conta retificadora do ativo.</li>
    </ul>
    <div class="aviso">A lógica é elegante: a provisão <b>retifica o ativo quando existe ativo a retificar</b>. Quando a exposição decorre de contraprestações que ainda nem foram reconhecidas no ativo, não há o que retificar — e a provisão vai para o passivo.</div>

/* ---------- persistência (silenciosa se o navegador bloquear) ---------- */
function carregar() {
  try {
    const bruto = localStorage.getItem(CHAVE);
    if (bruto) { salvo = Object.assign(salvo, JSON.parse(bruto)); return; }
    // migra o progresso da versão anterior, que só tinha a Aula 00
    const antigo = localStorage.getItem(CHAVE_V1);
    if (antigo) {
      const v1 = JSON.parse(antigo);
      salvo.xp = v1.xp || 0;
      salvo.som = v1.som !== false;
      Object.keys(v1.fases || {}).forEach(function (k) {
        salvo.fases["0:" + k] = v1.fases[k];
      });
      gravar();
    }
  } catch (e) { /* segue sem salvar */ }
}
function gravar() {
  try { localStorage.setItem(CHAVE, JSON.stringify(salvo)); } catch (e) {}
}
function reg(m, f) { return salvo.fases[m + ":" + f]; }

/* ---------- som ---------- */
let ctxAudio = null;
function bip(freq, dur, tipo) {
  if (!salvo.som) return;
  try {
    if (!ctxAudio) ctxAudio = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctxAudio.createOscillator();
    const g = ctxAudio.createGain();
    o.type = tipo || "triangle";
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, ctxAudio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.09, ctxAudio.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, ctxAudio.currentTime + dur);
    o.connect(g); g.connect(ctxAudio.destination);
    o.start(); o.stop(ctxAudio.currentTime + dur + 0.02);
  } catch (e) {}
}
const somCerto = () => { bip(660, 0.09); setTimeout(() => bip(990, 0.12), 90); };
const somErro  = () => bip(160, 0.22, "sawtooth");
const somFase  = () => { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => bip(f, 0.14), i * 110)); };

/* ---------- utilitários ---------- */
function embaralhar(a) {
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
function semTags(s) { return String(s).replace(/<[^>]+>/g, ""); }
function opcoesDe(mod, fase, q) {
  return q.t === "pool" ? (q.pool || fase.pool) : q.o;
}
function digitoControle(cod) {
  const d = String(cod).replace(/\D/g, "");
  if (d.length !== 9) return null;
  const pesos = [3, 7, 1, 3, 7, 1, 3, 7, 1];
  let soma = 0, detalhe = [];
  for (let i = 0; i < 9; i++) {
    const alg = Number(d[8 - i]);
    soma += alg * pesos[i];
    detalhe.push({ alg: alg, peso: pesos[i], prod: alg * pesos[i] });
  }
  const resto = soma % 10;
  return { soma: soma, resto: resto, dv: resto === 0 ? 0 : 10 - resto, detalhe: detalhe };
}

/* ---------- progresso ---------- */
function fasesFeitas(m) {
  let n = 0;
  MODULOS[m].fases.forEach(function (_, f) { if (reg(m, f)) n++; });
  return n;
}
function moduloCompleto(m) { return fasesFeitas(m) === MODULOS[m].fases.length; }
function totalFases() {
  return MODULOS.reduce(function (a, mo) { return a + mo.fases.length; }, 0);
}
function totalFeitas() {
  return MODULOS.reduce(function (a, _, m) { return a + fasesFeitas(m); }, 0);
}
function medalhaDe(pct) { return pct === 100 ? "🏅" : pct >= 80 ? "🥈" : "🥉"; }

/* ---------- barra de status ---------- */
function pintarPlacar() {
  if (!jogo) { placar.classList.add("oculto"); return; }

  let hp = "";
  for (let i = 0; i < 3; i++) hp += "<span class='" + (i < jogo.vidas ? "" : "gasta") + "'>◆</span>";
  elVidas.innerHTML = hp;
  elXp.textContent = salvo.xp + jogo.xpFase;
  elCombo.textContent = jogo.seq >= 3 ? "×" + multiplicador() : "";
}
function multiplicador() { return jogo.seq >= 6 ? 3 : (jogo.seq >= 3 ? 2 : 1); }

      (r.resto === 0 ? "0 (resto zero)" : "10 − " + r.resto + " = " + r.dv) + '</span>';
  }
  inp.addEventListener("input", calcular);
  calcular();
}

/* ============================================================
   PARTIDA
   ============================================================ */

function comecarFase(m, i) {
  const f = MODULOS[m].fases[i];
  jogo = {
    mod: m,
    fase: i,
    qs: embaralhar(f.qs),
    idx: 0,
    vidas: 3,
    acertos: 0,
    seq: 0,
    xpFase: 0,
    errados: [],
    travado: false
  };
  elMarca.textContent = "AULA " + m + " · " + f.nome.toUpperCase();
  desenharPergunta();
}

function desenharPergunta() {
  const f = MODULOS[jogo.mod].fases[jogo.fase];
  const q = jogo.qs[jogo.idx];
  jogo.travado = false;
  pintarPlacar();

  let html = '<div class="trilho"><i style="width:' + (jogo.idx / jogo.qs.length * 100) + '%"></i></div>';
  html += '<p class="contexto">PERGUNTA ' + (jogo.idx + 1) + " DE " + jogo.qs.length + " · " + f.nome.toUpperCase() + '</p>';
  html += '<p class="enunciado">' + q.p + '</p>';

  if (q.lanc) {
    html += '<div class="lancamento">';
    q.lanc.forEach(function (l) {
      html += '<div class="lin"><span class="dc ' + (l[0] === "D" ? "d" : "c") + '">' + l[0] + '</span>' +
              '<span>' + l[1] + '</span><span>R$ ' + l[2] + '</span></div>';
    });
    html += '</div>';
  }

  if (q.t === "num") {
    html += '<div class="campo-num"><input id="resp-num" inputmode="numeric" maxlength="3" autocomplete="off">' +
            '<button class="btn" id="conf-num">Conferir</button></div>';
  } else {
    const opcoes = opcoesDe(jogo.mod, f, q);
    const ordem = q.t === "pool" ? opcoes.map(function (_, k) { return k; }) : embaralhar(opcoes.map(function (_, k) { return k; }));
    const teclas = ["A", "B", "C", "D", "E", "F", "G", "H"];
    html += '<div class="opcoes' + (opcoes.length > 4 ? " grade" : "") + '" id="opcoes">';
    ordem.forEach(function (orig, pos) {
      html += '<button class="op" data-orig="' + orig + '">' +
              '<span class="tecla">' + teclas[pos] + '</span><span>' + opcoes[orig] + '</span></button>';
    });
    html += '</div>';
  }

  html += '<div id="area-resposta"></div>';
  tela.innerHTML = html;

  if (q.t === "num") {
    const inp = document.getElementById("resp-num");
    inp.focus();
    const enviarNum = function () {
      if (inp.value.trim() === "") { inp.focus(); return; }
      responder(Number(inp.value), q.r);
    };
    document.getElementById("conf-num").onclick = enviarNum;
    inp.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") { ev.preventDefault(); enviarNum(); }
    });
  } else {
    Array.prototype.forEach.call(tela.querySelectorAll(".op"), function (b) {
      b.onclick = function () { responder(Number(b.dataset.orig), q.r); };
    });
  }
  window.scrollTo(0, 0);
}

function responder(escolha, correta) {
  if (jogo.travado) return;
  jogo.travado = true;
  const q = jogo.qs[jogo.idx];
  const acertou = escolha === correta;

  if (q.t !== "num") {
    Array.prototype.forEach.call(tela.querySelectorAll(".op"), function (b) {
      const o = Number(b.dataset.orig);
      b.disabled = true;
      if (o === correta) b.classList.add("certa");
      else if (o === escolha) b.classList.add("errada");
      else b.classList.add("apagada");
    });
  } else {
    document.getElementById("resp-num").disabled = true;
    document.getElementById("conf-num").disabled = true;
  }

  if (acertou) {
    jogo.acertos++;
    jogo.seq++;
    jogo.xpFase += 10 * multiplicador();
    somCerto();
  } else {
    jogo.seq = 0;
    jogo.vidas--;
    jogo.errados.push(q);
    somErro();
  }
  pintarPlacar();

  const area = document.getElementById("area-resposta");
  area.innerHTML =
    '<div class="resposta" role="status">' +
      '<span class="carimbo ' + (acertou ? "ok" : "nao") + ' bate">' + (acertou ? "CONFERE" : "NÃO CONFERE") + '</span>' +
      '<p class="explica">' + q.e + '</p>' +
      '<div class="acoes"><button class="btn" id="seguir">' +
        (jogo.vidas === 0 ? "Ver o resultado" : (jogo.idx + 1 >= jogo.qs.length ? "Encerrar a fase" : "Próxima")) +
      '</button></div>' +
    '</div>';
  const b = document.getElementById("seguir");
  b.onclick = avancar;
  b.focus();
}

function avancar() {
  if (jogo.vidas === 0) return telaFimFase(false);
  jogo.idx++;
  if (jogo.idx >= jogo.qs.length) return telaFimFase(true);
  desenharPergunta();
}

function telaFimFase(concluiu) {
  const m = jogo.mod;
  const i = jogo.fase;
  const mo = MODULOS[m];
  const total = jogo.qs.length;
  const pct = Math.round(jogo.acertos / total * 100);
  const errados = jogo.errados.slice();
  const parciais = jogo.idx + 1;
  const acertos = jogo.acertos;
  const xpFase = jogo.xpFase;

  if (concluiu) {
    salvo.xp += xpFase;
    const r = reg(m, i);
    salvo.fases[m + ":" + i] = { melhor: r ? Math.max(r.melhor, pct) : pct };
    gravar();
    somFase();
  }

  let html = '<p class="contexto">' + mo.nome.toUpperCase() + " · FASE " + (i + 1) + " · " + mo.fases[i].nome.toUpperCase() + '</p>';

  if (concluiu) {
    html += '<div class="nota">' + pct + '%<small>' + acertos + " de " + total +
            " · " + xpFase + ' XP ganhos · ' + medalhaDe(pct) + '</small></div>';
  } else {
    html += '<h2>Acabaram as chances</h2><p class="sub">Você acertou ' + acertos + ' de ' + parciais +
            ' antes de perder as três. A fase reabre com as perguntas embaralhadas — e você já sabe onde tropeçou.</p>';
  }

  if (errados.length) {
    html += '<div class="revisar"><h3>Para revisar</h3><ul>';
    errados.forEach(function (q) {
      html += '<li><b>' + semTags(q.p) + '</b><br>' + q.e + '</li>';
    });
    html += '</ul></div>';
  } else if (concluiu) {
    html += '<p class="sub" style="margin-top:14px">Fase limpa, sem nenhum erro. Guarde essa sensação para a prova.</p>';
  }

  const proxima = i + 1 < mo.fases.length;
  html += '<div class="acoes">';
  if (concluiu && proxima) html += '<button class="btn selo" id="prox">Fase ' + (i + 2) + ': ' + mo.fases[i + 1].nome + '</button>';
  if (concluiu && !proxima) html += '<button class="btn selo" id="dipm">Diploma desta aula</button>';
  html += '<button class="btn fantasma" id="rep">Refazer a fase</button>';
  html += '<button class="btn fantasma" id="col">Reler a colinha</button>';
  html += '<button class="btn fantasma" id="mapa">Fases da aula</button></div>';

  jogo = null; pintarPlacar();
  tela.innerHTML = html;
  elMarca.textContent = mo.nome.toUpperCase() + " · XP " + salvo.xp;

  const p = document.getElementById("prox"); if (p) p.onclick = function () { telaColinha(m, i + 1); };
  const dm = document.getElementById("dipm"); if (dm) dm.onclick = function () { telaDiplomaModulo(m); };
  document.getElementById("rep").onclick = function () { comecarFase(m, i); };
  document.getElementById("col").onclick = function () { telaColinha(m, i); };
  document.getElementById("mapa").onclick = function () { telaMapa(m); };
  window.scrollTo(0, 0);
}

function telaDiplomaModulo(m) {
  jogo = null; pintarPlacar();
  const mo = MODULOS[m];
  const notas = mo.fases.map(function (_, i) { const r = reg(m, i); return r ? r.melhor : 0; });
  const media = Math.round(notas.reduce(function (a, b) { return a + b; }, 0) / notas.length);
  const fracas = mo.fases.filter(function (_, i) { return notas[i] < 80; });
  elMarca.textContent = "DIPLOMA · " + mo.nome.toUpperCase();

  let html =
    '<div class="diploma">' +
      '<p class="contexto" style="margin-bottom:16px">' + mo.subtitulo.toUpperCase() + '</p>' +
      '<h2>' + mo.nome + '</h2>' +
      '<div class="nota" style="margin:18px 0">' + media + '%<small>média das melhores notas nas ' + mo.fases.length + ' fases · ' + salvo.xp + ' XP acumulados</small></div>' +
      '<span class="selo-final">AULA CONCLUÍDA</span>' +
    '</div>';

  if (fracas.length) {
    html += '<div class="revisar"><h3>Onde ainda vale voltar</h3><ul>';
    fracas.forEach(function (f) { html += '<li><b>' + f.nome + '</b> — ' + f.tag + '</li>'; });
    html += '</ul></div>';
  }

  const proxMod = m + 1 < MODULOS.length;
  html += '<div class="acoes">';
  if (proxMod) html += '<button class="btn selo" id="prox">Aula ' + (m + 1) + ': ' + MODULOS[m + 1].nome + '</button>';
  html += '<button class="btn fantasma" id="mapa">Fases desta aula</button>';
  html += '<button class="btn fantasma" id="todas">Todas as aulas</button></div>';
  tela.innerHTML = html;
  const p = document.getElementById("prox"); if (p) p.onclick = function () { telaMapa(m + 1); };
  document.getElementById("mapa").onclick = function () { telaMapa(m); };
  document.getElementById("todas").onclick = telaModulos;
  window.scrollTo(0, 0);
}

function telaDiploma() {
  jogo = null; pintarPlacar();
  let soma = 0, n = 0;
  const fracas = [];
  MODULOS.forEach(function (mo, m) {
    mo.fases.forEach(function (f, i) {
      const r = reg(m, i);
      const nota = r ? r.melhor : 0;
      soma += nota; n++;
      if (nota < 80) fracas.push(mo.nome + " · " + f.nome);
    });
  });
  const media = Math.round(soma / n);
  elMarca.textContent = "DIPLOMA DO CURSO · XP " + salvo.xp;

  let html =
    '<div class="diploma">' +
      '<p class="contexto" style="margin-bottom:16px">PARTIDA DOBRADA · COSIF · AULAS 00 A 04</p>' +
      '<h2>O curso inteiro, fase por fase</h2>' +
      '<div class="nota" style="margin:18px 0">' + media + '%<small>média das melhores notas em ' + n + ' fases · ' + salvo.xp + ' XP acumulados</small></div>' +
      '<span class="selo-final">PRONTA PARA A PROVA</span>' +
    '</div>';

  if (fracas.length) {
    html += '<div class="revisar"><h3>Onde ainda vale voltar</h3><ul>';
    fracas.forEach(function (t) { html += '<li>' + t + '</li>'; });
    html += '</ul></div>';
  }

  html += '<p class="sub" style="margin-top:18px">Revisão espaçada funciona: refaça daqui a dois dias, e de novo em uma semana, as fases de elenco de contas, fatos contábeis, caça à desatualização, os dois testes e os três estágios. São as que mais rendem em prova.</p>';
  html += '<div class="acoes"><button class="btn fantasma" id="todas">Todas as aulas</button></div>';
  tela.innerHTML = html;
  document.getElementById("todas").onclick = telaModulos;
  window.scrollTo(0, 0);
}

/* ============================================================
   ATALHOS E RODAPÉ
   ============================================================ */

document.addEventListener("keydown", function (ev) {
  const seguir = document.getElementById("seguir");
  if (ev.key === "Enter" && seguir) { ev.preventDefault(); seguir.click(); return; }
  if (!jogo || jogo.travado) return;
  const teclas = { "1": 0, "2": 1, "3": 2, "4": 3, "5": 4, "6": 5, "7": 6, "8": 7,
                   "a": 0, "b": 1, "c": 2, "d": 3, "e": 4, "f": 5, "g": 6, "h": 7 };
  const pos = teclas[ev.key.toLowerCase()];
  if (pos === undefined) return;
  const botoes = tela.querySelectorAll(".op");
  if (botoes[pos]) { ev.preventDefault(); botoes[pos].click(); }
});

const btnSom = document.getElementById("btn-som");
btnSom.onclick = function () {
  salvo.som = !salvo.som;
  btnSom.textContent = "som: " + (salvo.som ? "ligado" : "desligado");
  gravar();
  if (salvo.som) bip(880, 0.08);
};

document.getElementById("btn-zerar").onclick = function () {
  if (!confirm("Apagar todo o progresso e recomeçar do zero?")) return;
  salvo = { xp: 0, fases: {}, som: salvo.som };
  gravar();
  telaCapa();
};

/* ---------- início ---------- */
carregar();
btnSom.textContent = "som: " + (salvo.som ? "ligado" : "desligado");
telaCapa();
</script>
