<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partida Dobrada — o jogo do Cosif</title>
<meta name="description" content="Jogo de estudo de Contabilidade de Instituições Financeiras — padrão Cosif — para o concurso do Banco Central do Brasil. Cinco aulas, 31 fases, 397 perguntas comentadas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --mesa:#223041;
  --mesa-2:#1a2634;
  --papel:#FCFBF7;
  --barra:#E7EFE4;
  --linha:#CBD6C8;
  --tinta:#16233A;
  --tinta-2:#53637B;
  --selo:#0E6E5C;
  --carimbo:#B3341F;
  --latao:#A8791A;
  --foco:#0E6E5C;
  --disp:"Fraunces","Georgia",serif;
  --ui:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--mesa);
  background-image:radial-gradient(ellipse at 50% -10%, #2c3d51 0%, var(--mesa) 55%, var(--mesa-2) 100%);
  background-attachment:fixed;
  font-family:var(--ui);
  color:var(--tinta);
  line-height:1.5;
  padding:22px 12px 60px;
  -webkit-text-size-adjust:100%;
}

/* ---------- a folha de formulário contínuo ---------- */
.folha{
  position:relative;
  max-width:800px;
  margin:0 auto;
  background:var(--papel);
  border-radius:2px;
  box-shadow:0 18px 40px rgba(0,0,0,.35), 0 2px 0 rgba(255,255,255,.06);
  padding:26px 24px 30px 24px;
}
.folha::before,.folha::after{
  content:"";position:absolute;top:0;bottom:0;width:20px;
  background-image:radial-gradient(circle at 10px 12px, var(--mesa) 3.4px, rgba(0,0,0,.06) 4.2px, transparent 4.8px);
  background-size:20px 24px;
  border-right:1px dashed var(--linha);
}
.folha::before{left:0}
.folha::after{right:0;border-right:0;border-left:1px dashed var(--linha)}
.folha > *{position:relative;z-index:1}
@media(min-width:640px){ .folha{padding:30px 44px 34px 44px} }
@media(max-width:520px){
  .folha::before,.folha::after{display:none}
  .folha{padding:20px 15px 24px}
}

/* ---------- cabeçalho ---------- */
.cabecalho{
  display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between;
  border-bottom:2px solid var(--tinta);padding-bottom:8px;margin-bottom:18px;
}
.marca{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--tinta-2)}
.placar{font-family:var(--mono);font-size:13px;display:flex;gap:14px;align-items:center}
.placar b{color:var(--latao);font-weight:600}
.vidas span{letter-spacing:2px}
.vidas .gasta{opacity:.22}

/* ---------- tipografia ---------- */
h1{font-family:var(--disp);font-weight:700;font-size:clamp(34px,8vw,60px);line-height:.95;margin:0 0 6px;letter-spacing:-.02em}
h2{font-family:var(--disp);font-weight:600;font-size:clamp(22px,4.6vw,31px);line-height:1.1;margin:0 0 8px;letter-spacing:-.01em}
h3{font-family:var(--ui);font-weight:600;font-size:15px;margin:20px 0 6px}
p{margin:0 0 12px;max-width:64ch}
.sub{color:var(--tinta-2);font-size:16px;max-width:52ch}
.mono{font-family:var(--mono)}
.oculto{display:none !important}

/* ---------- capa ---------- */
.capa-selo{
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--carimbo);
  border:1.5px solid var(--carimbo);border-radius:2px;display:inline-block;
  padding:4px 9px;transform:rotate(-1.6deg);margin-bottom:18px;
}
.capa h1{margin-top:4px}
.capa .lead{font-size:18px;max-width:46ch;margin-top:14px}
.regras{
  margin:22px 0 6px;border-top:1px solid var(--linha);border-bottom:1px solid var(--linha);
  padding:14px 0;display:grid;gap:10px;
}
@media(min-width:620px){.regras{grid-template-columns:1fr 1fr 1fr;gap:22px}}
.regra{font-size:14px;color:var(--tinta-2)}
.regra b{display:block;color:var(--tinta);font-size:14px;font-weight:600;margin-bottom:2px}

/* ---------- botões ---------- */
.btn{
  font-family:var(--ui);font-size:15px;font-weight:500;
  background:var(--tinta);color:var(--papel);border:1.5px solid var(--tinta);
  padding:11px 20px;border-radius:2px;cursor:pointer;
  transition:background .13s ease,color .13s ease;
}
.btn:hover{background:#28374f}
.btn.fantasma{background:transparent;color:var(--tinta)}
.btn.fantasma:hover{background:rgba(22,35,58,.07)}
.btn.selo{background:var(--selo);border-color:var(--selo)}
.btn.selo:hover{background:#0c5b4c}
.btn:disabled{opacity:.4;cursor:default}
.acoes{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
:focus-visible{outline:2.5px solid var(--foco);outline-offset:2px}

/* ---------- mapa de fases ---------- */
.mapa{margin-top:14px;border-top:1px solid var(--linha)}
.fase-linha{
  display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;
  width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--linha);
  padding:12px 8px;cursor:pointer;font-family:var(--ui);color:var(--tinta);
}
.fase-linha:nth-child(odd){background:var(--barra)}
.fase-linha:hover:not(:disabled){background:#dfeadb}
.fase-linha:disabled{cursor:default;color:#98a3b2}
.fase-num{font-family:var(--mono);font-size:17px;color:var(--tinta-2)}
.fase-nome{font-weight:600;font-size:15.5px;display:block}
.fase-tag{font-size:13px;color:var(--tinta-2);display:block}
.fase-linha:disabled .fase-tag{color:#a8b2be}
.fase-status{font-family:var(--mono);font-size:12px;white-space:nowrap}
.fase-status.ok{color:var(--selo)}
.medalha{font-size:15px}

/* ---------- colinha ---------- */
.colinha{font-size:15px}
.colinha p{margin-bottom:10px}
.colinha ul{margin:0 0 14px;padding-left:20px}
.colinha li{margin-bottom:6px;max-width:62ch}
.colinha code{font-family:var(--mono);font-size:.92em;background:var(--barra);padding:1px 5px;border-radius:2px}
.colinha .aviso{
  border-left:3px solid var(--carimbo);background:#fbf1ef;
  padding:10px 14px;margin:14px 0;font-size:14.5px;
}
.colinha .aviso b{color:var(--carimbo)}
.tabela{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 16px}
.tabela th{text-align:left;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--tinta-2);border-bottom:1.5px solid var(--tinta);padding:5px 8px 5px 0}
.tabela td{padding:5px 8px 5px 0;border-bottom:1px solid var(--linha)}
.tabela tr:nth-child(even) td{background:var(--barra)}
.tabela td.cod{font-family:var(--mono)}

/* oficina do dígito de controle */
.oficina{border:1px solid var(--linha);background:var(--barra);padding:14px;margin:6px 0 16px}
.oficina label{font-size:13px;display:block;margin-bottom:6px;color:var(--tinta-2)}
.oficina input{font-family:var(--mono);font-size:16px;padding:8px 10px;border:1.5px solid var(--tinta);background:var(--papel);width:190px;border-radius:2px}
.oficina .saida{font-family:var(--mono);font-size:13px;margin-top:10px;white-space:pre;overflow-x:auto}
.oficina .dv{font-size:17px;color:var(--selo);font-weight:600}

/* ---------- jogo ---------- */
.trilho{height:5px;background:var(--barra);margin:0 0 18px;position:relative;overflow:hidden}
.trilho i{position:absolute;left:0;top:0;bottom:0;background:var(--selo);width:0;transition:width .3s ease}
.enunciado{font-family:var(--disp);font-weight:600;font-size:clamp(19px,3.6vw,25px);line-height:1.25;margin:4px 0 4px;letter-spacing:-.01em}
.contexto{font-family:var(--mono);font-size:12px;letter-spacing:.09em;color:var(--tinta-2);margin-bottom:10px}
.lancamento{border:1px solid var(--linha);margin:14px 0 18px;font-family:var(--mono);font-size:13.5px}
.lancamento .lin{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:7px 12px;border-bottom:1px solid var(--linha)}
.lancamento .lin:last-child{border-bottom:0}
.lancamento .lin:nth-child(odd){background:var(--barra)}
@media(max-width:520px){
  .lancamento .lin{grid-template-columns:20px 1fr;row-gap:2px}
  .lancamento .lin span:last-child{grid-column:2;color:var(--tinta-2)}
}
.lancamento .dc{font-weight:600}
.lancamento .d{color:var(--tinta)}
.lancamento .c{color:var(--selo)}
.opcoes{display:grid;gap:8px;margin-top:6px}
.opcoes.grade{grid-template-columns:1fr}
@media(min-width:560px){.opcoes.grade{grid-template-columns:1fr 1fr}}
.op{
  display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
  background:var(--papel);border:1.5px solid var(--linha);border-radius:2px;
  padding:11px 14px;font-family:var(--ui);font-size:15px;color:var(--tinta);cursor:pointer;
  transition:border-color .12s ease,background .12s ease;
}
.op:hover:not(:disabled){border-color:var(--tinta);background:var(--barra)}
.op .tecla{font-family:var(--mono);font-size:12px;color:var(--tinta-2);border:1px solid var(--linha);border-radius:2px;padding:0 5px;line-height:19px;flex:0 0 auto;margin-top:1px}
.op:disabled{cursor:default}
.op.certa{border-color:var(--selo);background:#e9f3ef}
.op.certa .tecla{border-color:var(--selo);color:var(--selo)}
.op.errada{border-color:var(--carimbo);background:#fbf0ee}
.op.errada .tecla{border-color:var(--carimbo);color:var(--carimbo)}
.op.apagada{opacity:.45}
.campo-num{display:flex;gap:10px;align-items:center;margin-top:10px}
.campo-num input{font-family:var(--mono);font-size:22px;width:92px;text-align:center;padding:9px;border:1.5px solid var(--tinta);border-radius:2px;background:var(--papel)}

/* ---------- resposta ---------- */
.resposta{position:relative;margin-top:20px;border-top:2px solid var(--tinta);padding-top:16px}
.carimbo{
  position:absolute;right:12px;top:-16px;
  font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.12em;
  border:2.5px solid currentColor;border-radius:3px;padding:5px 10px;
  transform:rotate(-8deg);opacity:0;background:var(--papel);
}
.carimbo.ok{color:var(--selo)}
.carimbo.nao{color:var(--carimbo)}
.carimbo.bate{animation:bate .42s cubic-bezier(.2,.85,.3,1) forwards}
@keyframes bate{
  0%{transform:rotate(-19deg) scale(2.5);opacity:0}
  55%{transform:rotate(-7deg) scale(.94);opacity:1}
  100%{transform:rotate(-8deg) scale(1);opacity:1}
}
.explica{font-size:15px;max-width:62ch;padding-right:96px}
.explica b{color:var(--tinta)}
@media(max-width:520px){
  .explica{padding-right:0;margin-top:26px}
  .carimbo{top:-14px;right:6px;font-size:12px}
}

/* ---------- fim de fase / diploma ---------- */
.nota{font-family:var(--disp);font-size:clamp(48px,13vw,86px);line-height:.9;font-weight:700;letter-spacing:-.03em}
.nota small{font-family:var(--ui);font-size:15px;font-weight:400;letter-spacing:0;color:var(--tinta-2);display:block;margin-top:4px}
.revisar{border-top:1px solid var(--linha);margin-top:18px;padding-top:12px}
.revisar li{font-size:14px;margin-bottom:8px;max-width:62ch}
.diploma{border:3px double var(--tinta);padding:26px 22px;text-align:center;margin:10px 0}
.diploma .selo-final{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--carimbo);border:1.5px solid var(--carimbo);display:inline-block;padding:5px 10px;transform:rotate(-2deg);margin-top:14px}

.rodape{max-width:800px;margin:16px auto 0;font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.42);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:0 6px}
.rodape button{background:none;border:0;color:inherit;font:inherit;cursor:pointer;text-decoration:underline;padding:0}
.rodape button:hover{color:rgba(255,255,255,.75)}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
  .carimbo.bate{opacity:1}
}
</style>
</head>
<body>

<main class="folha" id="folha">
  <div class="cabecalho">
    <span class="marca" id="marca">PARTIDA DOBRADA · COSIF · AULA 00</span>
    <span class="placar oculto" id="placar">
      <span class="vidas" id="vidas"></span>
      <span>XP <b id="xp">0</b></span>
      <span id="combo"></span>
    </span>
  </div>
  <div id="tela"></div>
</main>

<div class="rodape">
  <span>Cosif — aulas 00 a 04 · 31 fases · 397 perguntas comentadas</span>
  <span><button id="btn-som" type="button">som: ligado</button> · <button id="btn-zerar" type="button">apagar progresso</button></span>
</div>

<script>
/* ============================================================
   PARTIDA DOBRADA — o jogo do Cosif
   Conteúdo: Aulas 00 a 04 do curso de Contabilidade de
   Instituições Financeiras — Padrão Cosif (BACEN)
   ============================================================ */

const MODULOS = [

/* ============================================================ MÓDULO 0 */
{
nome: "Princípios gerais do Cosif",
subtitulo: "Aula 00 — Plano Contábil das Instituições do SFN",
fases: [


/* ---------------------------------------------------------- FASE 1 */
{
  nome: "Quem manda no Cosif",
  tag: "Base legal, objetivo e os quatro capítulos",
  colinha: `
    <p>O Cosif não nasce do nada: ele é filho de uma lei e de uma delegação de competência. Guarde a cadeia inteira, porque a banca gosta de trocar os nomes de lugar.</p>
    <h3>A cadeia normativa</h3>
    <ul>
      <li><b>Lei 4.595/1964, art. 4º, XII</b> — compete ao <b>CMN</b> expedir normas gerais de contabilidade e estatística a serem observadas pelas instituições financeiras.</li>
      <li>Essa competência foi <b>delegada ao BCB</b> em reunião do CMN de <b>19.7.1978</b>.</li>
      <li><b>Art. 9º</b> — compete ao BCB cumprir e fazer cumprir as normas expedidas pelo CMN.</li>
      <li>Desde <b>julho de 2020</b>: o CMN edita <b>Resolução CMN</b>; o BCB edita <b>Resolução BCB</b> e <b>Instrução Normativa BCB</b>. Antes disso eram Circular e Carta Circular.</li>
    </ul>
    <div class="aviso"><b>Marco de 2025.</b> O Cosif foi criado pela Circular nº 1.273/1987. Essa circular foi <b>revogada em 1º/1/2025</b> pela entrada em vigor da <b>Resolução CMN nº 4.966/2021</b> (art. 80, XII). A norma matriz hoje é a Res. CMN 4.966/2021, somada às Resoluções BCB nºs 352/2023 e 390/2024.</div>
    <h3>Objetivo (Resolução CMN nº 4.858/2020) — mnemônico PERU</h3>
    <ul>
      <li><b>P</b>rover informações para a supervisão das instituições reguladas;</li>
      <li><b>E</b>stabelecer regras e procedimentos para obter e divulgar informações contábeis e financeiras;</li>
      <li><b>R</b>acionalizar a utilização de contas;</li>
      <li><b>U</b>niformizar os registros contábeis de eventos, transações e atos e fatos administrativos.</li>
    </ul>
    <p>Tudo isso para que as demonstrações expressem, <b>com fidedignidade e clareza</b>, a situação econômico-financeira da instituição e dos conglomerados de que faz parte. Repare no que <b>não</b> está aí: fiscalização pela Receita Federal.</p>
    <h3>Os quatro capítulos</h3>
    <table class="tabela">
      <tr><th>Capítulo</th><th>Função</th></tr>
      <tr><td class="cod">1 — Normas Básicas</td><td>Consolida princípios, critérios e procedimentos contábeis do CMN/BCB</td></tr>
      <tr><td class="cod">2 — Elenco de Contas</td><td>Consolida as rubricas contábeis e suas funções</td></tr>
      <tr><td class="cod">3 — Modelos</td><td>Modelos de documentos a elaborar pelas instituições autorizadas</td></tr>
      <tr><td class="cod">4 — Documentos Complementares</td><td>Pronunciamentos do CPC e de outras entidades recepcionados pelo CMN/BCB</td></tr>
    </table>
    <div class="aviso"><b>Pegadinha clássica.</b> Material antigo diz que os capítulos são hierarquizados e que, em caso de dúvida, as Normas Básicas prevalecem sobre o Elenco de Contas. Essa regra era o item 1.1.1.4 da Circular 1.273/1987 e <b>não tem correspondente no Cosif vigente</b>.</div>
    <p>Por fim: a existência de um título contábil no Cosif <b>não</b> autoriza a instituição a praticar a operação. Se a operação é vedada por lei ou depende de autorização do BCB, ter conta no plano não muda nada.</p>
  `,
  qs: [
    {t:"mc", p:"A quem a lei atribuiu, originariamente, a competência para expedir normas gerais de contabilidade das instituições financeiras?",
     o:["Ao Conselho Monetário Nacional","Ao Banco Central do Brasil","À Comissão de Valores Mobiliários","Ao Conselho Federal de Contabilidade"], r:0,
     e:"Lei 4.595/1964, art. 4º, XII: a competência é do <b>CMN</b>. O BCB só a exerce porque o próprio CMN lhe delegou a tarefa em reunião de 19.7.1978. Cuidado com a inversão: a banca adora dizer que a competência é originária do BCB."},
    {t:"mc", p:"Em que ano o CMN delegou ao Banco Central a competência para expedir essas normas?",
     o:["1964","1978","1987","2020"], r:1,
     e:"A delegação ocorreu em reunião do CMN de <b>19.7.1978</b>. Não confunda com 1964 (a lei), 1987 (a Circular 1.273, que criou o Cosif) nem 2020 (a mudança de nomenclatura dos atos normativos)."},
    {t:"mc", p:"(ESAF/BACEN) Segundo o Cosif, é objetivo das normas nele consubstanciadas, EXCETO:",
     o:["Uniformizar os registros contábeis dos atos e fatos administrativos","Racionalizar a utilização de contas","Possibilitar a fiscalização por parte da Secretaria da Receita Federal","Estabelecer regras e procedimentos para obtenção e divulgação de dados"], r:2,
     e:"Gabarito clássico: <b>Receita Federal não entra</b>. O Cosif prove informações para a <b>supervisão</b> das instituições reguladas — leia-se BCB —, não para a fiscalização tributária. Aliás, a classificação contábil de receitas, despesas, ativos e passivos não altera suas características para efeitos fiscais, que se regem por regulamentação própria."},
    {t:"mc", p:"Qual norma é hoje a matriz do Cosif?",
     o:["Circular BCB nº 1.273/1987","Resolução CMN nº 4.966/2021","Resolução CMN nº 4.858/2020","Lei nº 6.404/1976"], r:1,
     e:"A Circular 1.273/1987 criou o Cosif, mas foi <b>revogada em 1º/1/2025</b> pelo art. 80, XII, da <b>Resolução CMN nº 4.966/2021</b>. A Res. 4.858/2020 continua importante (é dela o objetivo e a divisão em capítulos), mas a norma matriz hoje é a 4.966, acompanhada das Resoluções BCB 352/2023 e 390/2024."},
    {t:"mc", p:"Desde julho de 2020, como se chamam os atos normativos editados pelo próprio Banco Central?",
     o:["Circular e Carta Circular","Resolução BCB e Instrução Normativa BCB","Resolução CMN e Portaria","Comunicado e Ofício Circular"], r:1,
     e:"Depois da revisão de 2020: o CMN edita <b>Resolução CMN</b>; o BCB edita <b>Resolução BCB</b> e <b>Instrução Normativa BCB</b>. Circular e Carta Circular são a nomenclatura antiga — se aparecer numa alternativa como norma atual, desconfie."},
    {t:"mc", p:"Qual capítulo do Cosif consolida as rubricas contábeis e suas respectivas funções?",
     o:["Capítulo 1 — Normas Básicas","Capítulo 2 — Elenco de Contas","Capítulo 3 — Modelos","Capítulo 4 — Documentos Complementares"], r:1,
     e:"<b>Capítulo 2 — Elenco de Contas.</b> O Capítulo 1 traz princípios, critérios e procedimentos; o 3, modelos de documentos; o 4, pronunciamentos recepcionados (CPC e outras entidades)."},
    {t:"mc", p:"Onde ficam os pronunciamentos do Comitê de Pronunciamentos Contábeis (CPC) recepcionados pela regulamentação do CMN/BCB?",
     o:["Capítulo 1 — Normas Básicas","Capítulo 2 — Elenco de Contas","Capítulo 3 — Modelos","Capítulo 4 — Documentos Complementares"], r:3,
     e:"<b>Capítulo 4 — Documentos Complementares.</b> É lá que mora, por exemplo, o CPC 05 (R1), sobre partes relacionadas. Vale registrar: o conteúdo do Cosif não substitui a regulamentação vigente do CMN ou do BCB."},
    {t:"mc", p:"Havendo dúvida entre o que dizem as Normas Básicas e o que diz o Elenco de Contas, o Cosif vigente manda:",
     o:["Prevalecer as Normas Básicas, por serem hierarquicamente superiores","Prevalecer o Elenco de Contas, por ser mais específico","Nada — não existe regra de hierarquia entre capítulos no Cosif vigente","Consultar o Conselho Federal de Contabilidade"], r:2,
     e:"Essa regra de hierarquia existia no item 1.1.1.4 das Normas Básicas anexas à Circular 1.273/1987 e <b>não foi reproduzida</b> no Cosif atual. É exatamente o tipo de item que sobrevive em apostila velha e derruba candidato."},

  nome: "Anatomia da rubrica",
  tag: "Níveis do código e dígito de controle",
  colinha: `
    <p>Toda rubrica contábil do Cosif tem três componentes: <b>código</b>, <b>nomenclatura</b> e <b>função</b>. Só isso. O antigo quarto componente — o <b>atributo</b>, aquelas letras B, U, R que diziam quais instituições podiam usar a conta — <b>deixou de existir</b> em 1º/1/2025, quando a Resolução BCB nº 390/2024 revogou o art. 5º e o Anexo I da Resolução BCB nº 92/2021.</p>
    <h3>Os níveis do código</h3>
    <table class="tabela">
      <tr><th>Posição</th><th>Nível</th></tr>
      <tr><td class="cod">1º dígito</td><td>Grupo contábil</td></tr>
      <tr><td class="cod">2º dígito</td><td>Subgrupo contábil</td></tr>
      <tr><td class="cod">3º dígito</td><td>Desdobramento de subgrupo contábil</td></tr>
      <tr><td class="cod">4º e 5º dígitos</td><td>Título contábil</td></tr>
      <tr><td class="cod">6º e 7º dígitos</td><td>Subtítulo contábil de primeiro grau</td></tr>
      <tr><td class="cod">8º e 9º dígitos</td><td>Subtítulo contábil de segundo grau</td></tr>
      <tr><td class="cod">10ª posição</td><td>Dígito de controle</td></tr>
    </table>
    <p>A norma exige <b>no mínimo cinco níveis</b> (até o subtítulo de primeiro grau) mais o dígito de controle. O "no mínimo" não é força de expressão: o <b>Denor — Departamento de Regulação do Sistema Financeiro</b> pode criar novos níveis de dois dígitos, e já criou. Por isso o elenco em vigor trabalha com <b>nove dígitos</b>, e não sete.</p>
    <div class="aviso"><b>Publicada, mas ainda não vale.</b> A Resolução BCB nº 390/2024 fará o 2º e o 3º níveis passarem a ter dois dígitos cada — só que a partir de <b>1º/1/2030</b>. Até lá, um dígito cada. A mesma resolução limitou em <b>dez</b> o número máximo de níveis e determinou que novos níveis só vigorem a partir do exercício seguinte, respeitado o prazo mínimo de seis meses da publicação.</div>
    <h3>Como se calcula o dígito de controle</h3>
    <p>Multiplique cada algarismo do código, <b>da direita para a esquerda</b>, pelos pesos <code>3, 7, 1, 3, 7, 1, 3, 7, 1</code>. Some as nove parcelas. Divida por dez. O dígito de controle é a diferença entre <b>dez e o resto</b> da divisão. Se o resto for zero, o dígito também é zero.</p>
    <div class="oficina" id="oficina-dv"></div>
    <p>Um aviso para não enxergar contradição: o Caixa aparece como <code>1.1.1.00.00.00-9</code> nos lançamentos e como <code>1.1.1.10.00.00-8</code> no exemplo do dígito. Os dois existem e os dois estão certos — são níveis diferentes do mesmo ramo. O primeiro é o desdobramento de subgrupo; o segundo, o título nele contido. Em prova trabalha-se no nível de desdobramento de subgrupo.</p>
    <p>Por fim: é <b>vedado</b> à instituição modificar a estrutura das rubricas ou alterar seus elementos caracterizadores. Ela pode adotar desdobramentos de uso interno para controle gerencial, desde que sejam <b>conversíveis</b> ao nível mais analítico do elenco.</p>
  `,
  qs: [
    {t:"num", p:"Calcule o dígito de controle do código 4.1.1.00.00.00 (Depósitos à Vista).",
     r:6, e:"Da direita para a esquerda, só três algarismos não são zero: 1 × 3 = 3, 1 × 7 = 7 e 4 × 1 = 4. Soma <b>14</b>; resto da divisão por 10 é <b>4</b>; dígito = 10 − 4 = <b>6</b>. Código completo: 4.1.1.00.00.00-6."},
    {t:"num", p:"Calcule o dígito de controle do código 1.1.1.10.00.00 (título Caixa).",

    {t:"num", p:"Calcule o dígito de controle do código 6.1.1.00.00.00 (Capital Social).",

    {t:"num", p:"Calcule o dígito de controle do código 4.1.2.00.00.00 (Depósitos de Poupança).",

    {t:"mc", p:"No código 1.6.1.20.01.10-4, o que representa o par de dígitos <span class='mono'>20</span>?",

    {t:"mc", p:"Quantos níveis de agregação, no mínimo, forma o código das rubricas do Cosif?",

    {t:"mc", p:"A partir de quando o subgrupo e o desdobramento de subgrupo passam a ter dois dígitos cada?",

    {t:"mc", p:"Sobre os atributos das instituições (as letras B, U, R que apareciam ao lado de cada rubrica):",

    {t:"mc", p:"A estrutura das rubricas contábeis do elenco do Cosif é formada por:",

    {t:"mc", p:"A instituição pode criar desdobramentos de contas para uso interno?",

     e:"É vedado <b>modificar a estrutura</b> das rubricas ou alterar seus elementos caracterizadores. Mas desdobramentos internos são permitidos, com uma condição: têm de ser <b>passíveis de conversão</b> ao nível mais analítico aplicável do elenco de contas."},
    {t:"mc", p:"Quem pode definir novos níveis de agregação quando os existentes não bastam para os controles contábeis?",

  nome: "Moeda estrangeira e mensuração",
  tag: "Conversão cambial e o novo regime da Resolução 4.966",
  colinha: `
    <h3>Transações em moeda estrangeira</h3>
    <p>É toda transação denominada ou que exija liquidação em moeda diferente da nacional. A conversão é feita <b>individualmente</b>, transação por transação:</p>
    <ul>
      <li>no <b>reconhecimento inicial</b>, pela taxa de câmbio <b>à vista da data da transação</b>;</li>
      <li>na <b>data-base</b> de cada balancete ou balanço, pela taxa <b>daquela data-base</b>, para itens monetários e itens não monetários mensurados pelo valor justo.</li>
    </ul>
    <p><b>Itens monetários</b> são as unidades de moeda mantidas em caixa e os ativos e passivos a receber ou pagar em número fixo ou determinado de unidades de moeda.</p>
    <p>Os ajustes da conversão na data-base vão para <b>conta destacada do PL</b>, pelo valor líquido dos efeitos tributários, quando se tratar de item não monetário cujos ganhos e perdas sejam reconhecidos no PL; e <b>em contrapartida ao resultado</b> nos demais casos.</p>
    <p>A taxa a usar é a <b>informada pelo BCB</b>. É facultada taxa diferente, desde que a finalidade seja eliminar ou reduzir inconsistência de mensuração ou oferecer informação mais confiável e relevante. Essa taxa deve ser de <b>acesso público</b> (inclusive o histórico), ter <b>metodologia pública, robusta e consistente</b> e ser apurada por <b>entidade independente</b> reconhecida no mercado.</p>
    <div class="aviso"><b>Recorte fino.</b> Para as instituições alcançadas pela subseção 1.3 (Resolução BCB nº 120/2021), a taxa alternativa deve ainda: ter histórico mínimo de <b>cinco anos</b>; ser de acesso público <b>e gratuito</b>; ser divulgada por entidade de bolsa ou de registro e liquidação autorizada pelo BCB ou pela CVM; e ser definida <b>até o primeiro dia útil do exercício social</b>. Definida a taxa, é <b>vedado alterá-la no curso do exercício</b>.</div>
    <h3>Partes relacionadas</h3>
    <p>O Cosif não define mais o termo nem tem seção sobre sociedades ligadas: a matéria migrou para o <b>CPC 05 (R1)</b>, recepcionado no Capítulo 4. Cuidado para não confundir conceito com nome de conta — "sociedades ligadas" continua vivo no Elenco (1.8.8.85, 4.9.9.85, 4.5.1.50). E "conglomerado financeiro" e "conglomerado econômico-financeiro" não existem mais: a figura vigente é o <b>conglomerado prudencial</b>.</p>
    <h3>O novo regime de mensuração (Resolução CMN nº 4.966/2021)</h3>
    <p>O critério <b>deixou de depender do tipo de taxa</b> (pré, pós ou flutuante) e passou a depender da <b>categoria de classificação</b> do instrumento financeiro. A classificação sai de <b>dois testes cumulativos</b>: o modelo de negócios e as características contratuais dos fluxos de caixa.</p>
    <table class="tabela">
      <tr><th>Categoria</th><th>Quando</th></tr>
      <tr><td><b>Custo amortizado</b></td><td>Modelo de negócios visa receber os fluxos contratuais <b>e</b> os fluxos são somente pagamentos de principal e juros</td></tr>
      <tr><td><b>Valor justo em outros resultados abrangentes</b></td><td>Modelo busca retorno pelos fluxos <b>e</b> pela venda, com transferência substancial de riscos e benefícios, e os fluxos são somente principal e juros</td></tr>
      <tr><td><b>Valor justo no resultado</b></td><td>Os demais ativos financeiros</td></tr>
    </table>
    <p>Regra prática que cai: <b>operações de crédito vão, em regra, para o custo amortizado</b>. Só migram para valor justo no resultado em três hipóteses — modelo de negócios que visa a retorno somente pela venda; fluxos que não se resumem a principal e juros; e exercício da opção prevista no próprio Cosif.</p>
    <ul>
      <li><b>Reconhecimento inicial</b>: pelo <b>valor justo</b>, na data de aquisição, originação ou emissão. Exceção única: recebíveis de contratos com clientes sem componente de financiamento significativo, pelo preço de transação.</li>
      <li><b>Custos de transação</b> atribuíveis individualmente ajustam o valor inicial nos instrumentos em custo amortizado ou VJORA: nos ativos são acrescidos e valores recebidos são deduzidos; nos passivos, o contrário. Gastos que não possam ser apurados individualmente viram despesa do período.</li>
      <li><b>Apropriação</b>: receitas e encargos vão ao resultado, no mínimo por ocasião dos balancetes e balanços, <b>pro rata temporis</b>, pelo <b>método de juros efetivos</b> — pré ou pós-fixada, tanto faz. Exceção: nos instrumentos em valor justo no resultado, conforme as taxas e formas de remuneração do contrato.</li>
      <li><b>Dividendos</b> e remunerações similares de instrumentos patrimoniais: reconhecidos quando a investidora <b>obtém o direito de recebê-los</b>, pelo valor declarado pela investida.</li>
    </ul>
    <h3>O exemplo que resume tudo</h3>
    <p>Empréstimo de R$ 1.000, dois meses, 3% ao mês, com R$ 10 de comissão paga a correspondente. O ativo nasce por <b>R$ 1.010</b> (valor justo + custo de transação). Como o valor a receber no vencimento continua sendo R$ 1.060,90, a taxa efetiva cai de 3% para <b>2,4888% a.m.</b> No primeiro mês, os juros contratuais são R$ 30,00, mas a receita reconhecida é R$ 25,14 — a diferença de R$ 4,86 amortiza o custo de transação. Mensagem central: <b>o custo de transação não vira despesa no ato</b>; entra no valor do ativo e é diluído ao longo do prazo.</p>
    <h3>Quando não há regulamentação específica</h3>
    <p>Ativos: pelo <b>menor valor entre custo e valor justo</b> na data-base. Passivos: pelo valor contratualmente previsto para a liquidação ou, se o contrato for omisso ou inexistente, pelo <b>valor estimado</b>. Receitas e despesas: pro rata temporis, por <b>dias corridos</b>, <b>incluindo o dia do vencimento e excluindo o dia da operação</b>, computadas até o último dia do mês ou semestre civil, seja ele útil ou não.</p>
  `,

{
  nome: "O vocabulário da 4.966",
  tag: "Definições que a banca cobra na literalidade",
  colinha: `
    <p>A Resolução CMN nº 4.966/2021 é densa em definições, e é delas que saem as questões. Comece pelo conceito central, que é <b>relacional</b>:</p>
    <div class="aviso"><b>Instrumento financeiro</b> é o título ou contrato que dá origem a um <b>ativo financeiro</b> para uma das partes e a um <b>passivo financeiro</b> ou <b>instrumento patrimonial</b> para a outra. O mesmo contrato é ativo de um lado e passivo do outro.</div>
    <ul>
      <li><b>Ativo financeiro</b> — dinheiro; instrumento patrimonial de outra entidade; direito contratual de receber dinheiro ou outro ativo financeiro, ou de trocar ativos ou passivos financeiros em condições <b>potencialmente favoráveis</b>.</li>
      <li><b>Passivo financeiro</b> — obrigação de entregar dinheiro ou outro ativo financeiro, ou de trocar em condições <b>potencialmente desfavoráveis</b>.</li>
      <li><b>Instrumento patrimonial</b> — título ou contrato que evidencia <b>interesse residual</b> nos ativos de uma entidade após deduzidos todos os passivos. Em português de concurseiro: ação ou cota.</li>
    </ul>
    <p>Guarde o trio: ativo é <b>direito de receber</b>, passivo é <b>obrigação de entregar</b>, patrimonial é o <b>resíduo</b>. E repare no par favorável/desfavorável — é a porta de entrada dos derivativos.</p>
    <h3>Títulos e valores mobiliários</h3>
    <p><b>Títulos</b> são papéis emitidos por governos e empresas para captar recursos. <b>Valores mobiliários</b> são títulos ou contratos lançados ao público que geram direito de participação, parceria ou remuneração, sujeitos à disciplina e à fiscalização da <b>CVM</b>. Ações, debêntures e bônus de subscrição são valores mobiliários; CDB e DI são títulos privados.</p>
    <div class="aviso"><b>Pegadinha de balanço.</b> "Títulos e valores mobiliários" é o subgrupo <b>1.3</b>, no ativo. Se o banco <b>emite</b> um CDB, ele está captando: o CDB vai para o <b>passivo</b>, em Depósitos a Prazo (4.1.5.00.00.00-4). O mesmo papel é TVM para quem compra e obrigação para quem emite.</div>
    <h3>Os três conceitos que sustentam o regime</h3>
    <table class="tabela">
      <tr><th>Termo</th><th>Definição</th></tr>
      <tr><td><b>Valor justo</b></td><td>Preço que seria recebido pela venda de um ativo, ou pago pela transferência de um passivo, em transação ordenada entre participantes do mercado na data de mensuração (CPC 46). Substituiu a expressão "valor de mercado".</td></tr>
      <tr><td><b>Custo amortizado</b></td><td>Valor do reconhecimento inicial, acrescido das receitas geradas, deduzido das despesas incorridas, das parcelas recebidas e do saldo da provisão para perdas esperadas.</td></tr>
      <tr><td><b>Valor contábil bruto</b></td><td>O custo amortizado <b>antes</b> do ajuste da provisão para perdas esperadas.</td></tr>
      <tr><td><b>Taxa de juros efetiva</b></td><td>A taxa que equaliza o valor presente de todos os recebimentos e pagamentos do prazo contratual ao <b>valor contábil bruto</b> do instrumento.</td></tr>
    </table>
    <p>E a definição de <b>juros</b>, que surpreende: contraprestação pelo <b>valor do dinheiro no tempo</b>, pelo <b>risco de crédito</b> associado ao principal em aberto, por <b>outros riscos e custos básicos</b> do instrumento e pela <b>margem de lucro</b>. Esses elementos reaparecem no teste dos fluxos de caixa.</p>
  `,

    <p>Os títulos públicos federais são emitidos pela <b>Secretaria do Tesouro Nacional</b>. O Banco Central está <b>proibido de emitir</b> títulos da dívida pública desde 2002, por força do art. 34 da Lei Complementar nº 101/2000 (Lei de Responsabilidade Fiscal).</p>
    <p>Eles financiam o déficit federal, rolam a dívida vincenda e servem de instrumento de política monetária. São colocados no <b>mercado primário</b> por ofertas públicas na modalidade de <b>leilões</b> — aí há emissão nova e o governo recebe dinheiro. Depois circulam no <b>mercado secundário</b>, onde há apenas troca de mãos entre investidores.</p>
    <h3>As duas colunas de nomes</h3>
    <table class="tabela">

      <tr><td class="cod">NTN-F</td><td>Tesouro Prefixado com Juros Semestrais</td><td>Prefixada, <b>com</b> cupom</td></tr>
      <tr><td class="cod">LFT</td><td>Tesouro Selic</td><td>Pós-fixada (Selic), sem cupom</td></tr>
      <tr><td class="cod">NTN-B Principal</td><td>Tesouro IPCA+</td><td>Pós-fixada (IPCA), sem cupom</td></tr>
      <tr><td class="cod">NTN-B</td><td>Tesouro IPCA+ com Juros Semestrais</td><td>Pós-fixada (IPCA), com cupom</td></tr>
      <tr><td class="cod">NTN-C</td><td>Tesouro IGPM+ com Juros Semestrais</td><td>Pós-fixada (IGP-M), com cupom</td></tr>

    <div class="aviso"><b>O cupom é a chave.</b> O que separa LTN de NTN-F é o cupom. O que separa NTN-B de NTN-B Principal também é o cupom — "Principal" quer dizer <b>fluxo único no vencimento</b>. E a <b>LFT</b> é o único título com baixa volatilidade de preço, porque o indexador dela é a própria taxa que serve de base para precificar os demais.</div>
    <h3>Duas convenções</h3>

      <li><b>Prefixados</b>: valor nominal de resgate fixado em <b>R$ 1.000,00</b>; o investidor compra com <b>deságio</b> e sabe desde o início quanto receberá.</li>
      <li><b>Pós-fixados</b>: valor nominal inicial de R$ 1.000,00, atualizado pelo indexador — daí a figura do <b>Valor Nominal Atualizado (VNA)</b>.</li>
    </ul>
    <p>A NTN-C merece nota: o Tesouro não a emite desde <b>2006</b> e hoje só atua na recompra. O estoque remanescente está concentrado em fundos de pensão, com liquidez secundária muito baixa.</p>
    <h3>Como se contabiliza um pós-fixado</h3>
    <p>A mecânica não muda; muda a forma de determinar a taxa. Diz a Res. BCB nº 352/2023: quando a taxa não for prefixada, a taxa efetiva deve ser definida considerando, <b>no mínimo por ocasião dos balancetes e balanços</b>, o valor vigente do <b>componente variável</b> da taxa contratual na data-base. Na LFT, considera-se a Selic vigente; na NTN-B, a variação do IPCA acumulada.</p>
    <p>Nos títulos <b>com cupom</b>, o recebimento periódico dos juros <b>reduz o saldo do ativo</b> — ele não é receita nova, porque a receita já foi reconhecida pro rata temporis. O cupom apenas converte parte do ativo em dinheiro.</p>

/* ---- 1.3 */
{
  nome: "Os dois testes",
  tag: "Modelo de negócios, fluxos de caixa e as três categorias",
  colinha: `
    <p>No regime antigo a classificação dependia da <b>intenção</b> da instituição. Hoje a intenção isolada não basta: classificam-se os ativos financeiros a partir de <b>dois testes cumulativos</b>.</p>
    <h3>Teste 1 — o modelo de negócios</h3>
    <p>Não olha para o papel isolado, e sim para o grupo de ativos em que ele está inserido. O modelo deve:</p>
    <ul>
      <li>ser <b>aprovado pelo conselho de administração</b> ou, na sua inexistência, pela diretoria;</li>
      <li>estabelecer como <b>grupos</b> de ativos são geridos em conjunto para atingir um objetivo específico;</li>
      <li>ser definido considerando a administração dos grupos para <b>geração de fluxos de caixa</b>;</li>
      <li>refletir as atividades <b>planejadas e efetivamente praticadas</b>.</li>
    </ul>
    <p>Na definição, consideram-se todas as informações relevantes: como os resultados são avaliados e apresentados à diretoria e ao conselho, os riscos que afetam o desempenho e como são administrados, e a <b>base de remuneração dos gestores</b> do negócio.</p>
    <div class="aviso"><b>O item que quase ninguém lembra.</b> A base de remuneração dos gestores está na norma e a Cebraspe adora esse tipo de detalhe. Como o gestor é remunerado diz muito sobre o objetivo real: se ele ganha por resultado de venda, o modelo dificilmente é o de manter o ativo para receber os fluxos contratuais.</div>
    <h3>Teste 2 — somente principal e juros (SPPJ)</h3>
    <p>Pergunta se os fluxos contratuais são <b>somente pagamentos de principal e juros sobre o valor do principal, em datas especificadas</b>. Os fluxos são consistentes com um <b>acordo de empréstimo básico</b> quando seus elementos mais significativos forem o valor do dinheiro no tempo, o risco de crédito, os custos da operação, a margem de lucro e outros riscos relacionados ao empréstimo — <b>independentemente da denominação ou da forma jurídica</b> do contrato.</p>
    <ul>
      <li>Não se consideram características com efeito <b>nulo ou pouco significativo</b>, nem as que só afetam os fluxos em evento <b>muito raro, anormal e improvável</b>.</li>
      <li>Ativos <b>sem incidência de juros</b> são consistentes com o acordo básico, desde que não haja componente que gere volatilidade incompatível.</li>
      <li>Taxas <b>abaixo das de mercado</b> podem ser estimativa adequada do valor do dinheiro no tempo, se a contraprestação for amplamente consistente com a passagem do tempo.</li>
      <li>Taxas <b>alavancadas</b> — que aumentem substancialmente a oscilação dos fluxos — <b>não</b> são consistentes.</li>
      <li>Na <b>liquidação antecipada</b> prevista em contrato, os fluxos continuam SPPJ se o pagamento representar o valor nominal contratual mais juros acumulados e eventual contraprestação adicional razoável pela rescisão.</li>
    </ul>
    <h3>As três categorias</h3>
    <table class="tabela">
      <tr><th>Categoria</th><th>Modelo de negócios</th><th>Fluxos</th></tr>
      <tr><td><b>Custo amortizado</b></td><td>Manter para receber os fluxos contratuais</td><td>Somente principal e juros</td></tr>
      <tr><td><b>VJORA</b></td><td>Retorno pelos fluxos <b>e</b> pela venda, com transferência substancial de riscos e benefícios</td><td>Somente principal e juros</td></tr>
      <tr><td><b>VJR</b></td><td colspan="2">Categoria <b>residual</b>: tudo o que não couber nas duas anteriores</td></tr>
    </table>
    <h3>Duas válvulas de escape, ambas irrevogáveis</h3>
    <ul>
      <li><b>Designação de instrumentos patrimoniais para VJORA</b> — tira a ação do VJR e manda o ajuste ao PL. Exige política e estratégia documentadas. É <b>vedada</b> a designação de ativo cujo objetivo principal seja gerar retorno pela venda.</li>
      <li><b>Opção de valor justo</b> — classificar em VJR ativos que iriam para outras categorias, desde que para <b>eliminar ou reduzir significativamente inconsistência</b> de mensuração ou de reconhecimento contábil.</li>
    </ul>
    <h3>Passivos financeiros e reclassificação</h3>
    <p>Os passivos vão para <b>custo amortizado</b>, salvo: derivativos que sejam passivos (VJR); passivos gerados em empréstimo ou aluguel de ativos financeiros (VJR); passivos gerados por transferência de ativo (regras próprias); compromissos de crédito e créditos a liberar (capítulo da provisão); e garantias financeiras prestadas (mensuradas pelo <b>maior valor</b> entre a provisão para perdas esperadas e o valor justo inicial menos a receita já reconhecida).</p>
    <div class="aviso">Duas frases para levar decoradas: é <b>vedada a reclassificação de passivos financeiros</b>; e é <b>vedado o reconhecimento de ativo e passivo com base em valor líquido</b>, inclusive quando geridos em conjunto.</div>
    <p>Os <b>ativos</b>, ao contrário, são reclassificados — mas o gatilho é a <b>alteração do modelo de negócios</b>, e não a mudança de intenção sobre um papel. A reclassificação é obrigatória, <b>prospectiva</b>, no <b>primeiro dia do período subsequente</b> de apuração de resultado.</p>
    <table class="tabela">
      <tr><th>Sai de</th><th>Vai para</th><th>Ajuste</th></tr>
      <tr><td>Custo amortizado</td><td>VJR</td><td>Diferença entre custo amortizado e valor justo vai ao <b>resultado</b></td></tr>
      <tr><td>Custo amortizado</td><td>VJORA</td><td>Diferença vai ao <b>PL</b>, líquida dos efeitos tributários</td></tr>
      <tr><td>VJORA</td><td>VJR</td><td>Ganhos e perdas não realizados do PL vão ao <b>resultado</b></td></tr>
      <tr><td>VJORA</td><td>Custo amortizado</td><td>Ganhos e perdas do PL são <b>eliminados</b> contra o ativo, como se ele sempre tivesse estado nessa categoria</td></tr>
      <tr><td>VJR</td><td>Demais</td><td>O valor justo na data vira o novo valor contábil bruto; <b>não se admite estorno</b> do já computado no resultado</td></tr>
    </table>
    <p>A classificação ainda é espelhada em <b>compensação</b>, no desdobramento 3.2.1 (Instrumentos Financeiros — Classificação por Categorias), com contrapartida em 9.2.1: 3.2.1.10 custo amortizado, 3.2.1.20 VJORA, 3.2.1.30 VJR.</p>
  `,

  colinha: `
    <h3>Reconhecimento inicial</h3>
    <p>Na data de aquisição, originação ou emissão, o instrumento é reconhecido:</p>
    <ul>
      <li>pelo <b>preço de transação</b>, nos recebíveis de contratos com clientes <b>sem componente de financiamento significativo</b>; ou</li>
      <li>pelo <b>valor justo</b>, nos demais casos.</li>
    </ul>
    <p>Guarde nessa ordem, porque as bancas invertem: a <b>regra geral é valor justo</b>; o preço de transação é exceção estreita. Se o valor justo diferir do valor efetivamente pago ou recebido, a diferença vai ao resultado quando o instrumento estiver no <b>nível 1 ou 2</b> da hierarquia de valor justo, ou é diferida conforme a realização nos demais casos. Instrumentos em custo amortizado mensurados no <b>nível 3</b> são reconhecidos pelo valor da contraprestação efetivamente paga ou recebida.</p>
    <h3>Custos de transação</h3>
    <p>São os custos que, <b>cumulativamente</b>, sejam atribuíveis diretamente à aquisição, originação ou emissão do instrumento específico <b>e</b> incrementais — aqueles em que a instituição não incorreria se não tivesse feito a operação.</p>
    <table class="tabela">
      <tr><th>Instrumento</th><th>Custos de transação</th><th>Valores recebidos</th></tr>
      <tr><td>Ativo financeiro</td><td>Acrescidos</td><td>Deduzidos</td></tr>
      <tr><td>Passivo financeiro</td><td>Deduzidos</td><td>Acrescidos</td></tr>
    </table>
    <p>Esse ajuste só ocorre nos instrumentos em <b>custo amortizado ou VJORA</b>. Nos de <b>VJR não se capitaliza</b> nada — o instrumento será marcado a valor justo de qualquer forma. Gastos que não possam ser apurados e controlados individualmente, sem rateio, viram <b>despesa do período</b>.</p>
    <div class="aviso"><b>Decore o número.</b> Há faculdade de materialidade, desde que a instituição defina em política contábil critérios relativos e absolutos, consistentes e verificáveis. E presume-se <b>material</b> o custo ou a receita que represente mais de <b>1%</b> da receita total que a instituição obterá com o ativo, ou dos encargos totais do passivo.</div>
    <h3>Apropriação de receitas e encargos</h3>
    <p>Reconhecidas no resultado, <b>no mínimo por ocasião dos balancetes e balanços</b>, <b>pro rata temporis</b>, pelo <b>método de juros efetivos</b>. Não existe mais método exponencial nem linear, e não importa se a operação é pré ou pós-fixada. Exceção: nos instrumentos em <b>VJR</b>, as receitas e encargos seguem as taxas e demais formas de remuneração <b>definidas em contrato</b>.</p>
    <p><b>Dividendos</b> e remunerações similares de instrumentos patrimoniais: reconhecidos quando a investidora <b>obtiver o direito de recebê-los</b>, pelo valor declarado pela investida. Nos patrimoniais designados para VJORA, esses valores são <b>deduzidos do valor contábil</b> se se referirem ao ano de aquisição e representarem recuperação do investimento inicial; nos demais casos, vão ao resultado.</p>
    <div class="aviso"><b>Regra dura.</b> É vedado reconhecer no resultado receita ainda não recebida de <b>ativo com problema de recuperação de crédito</b>. Essas receitas só entram quando efetivamente recebidas, e o reconhecimento normal só é retomado, <b>prospectivamente</b>, a partir do período em que o instrumento deixar de ser problemático.</div>
    <h3>Mensuração subsequente</h3>
    <table class="tabela">
      <tr><th>Categoria</th><th>Mensuração</th><th>Onde vai o ajuste</th></tr>
      <tr><td>Custo amortizado</td><td>Custo amortizado, por juros efetivos</td><td>Não há ajuste a valor justo</td></tr>
      <tr><td>VJORA</td><td>Valor justo, no mínimo nos balancetes e balanços</td><td>Outros resultados abrangentes, no PL, líquido dos efeitos tributários</td></tr>
      <tr><td>VJR</td><td>Valor justo, no mínimo nos balancetes e balanços</td><td>Receita ou despesa, no resultado do período</td></tr>
    </table>
    <p>Duas regras acessórias: os ganhos e perdas de valorização são reconhecidos de forma <b>segregada</b> da despesa de provisão para perdas; e a <b>variação cambial</b> dos instrumentos financeiros vai ao resultado, salvo nos patrimoniais designados para VJORA, em que vai a outros resultados abrangentes.</p>
    <h3>A baixa de um ativo em VJORA</h3>
    <table class="tabela">
      <tr><th>Situação</th><th>Destino dos ganhos e perdas não realizados</th></tr>
      <tr><td>Instrumento patrimonial <b>designado</b> para VJORA</td><td>Lucros ou prejuízos acumulados, <b>sem</b> efeito no resultado do período</td></tr>
      <tr><td>Demais casos (título de renda fixa em VJORA)</td><td>Resultado do período</td></tr>
    </table>
    <p>Essa é uma das distinções mais elegantes do novo regime: a ação designada para VJORA <b>nunca</b> passa pelo resultado, nem na valorização nem na venda. O título de renda fixa em VJORA acumula no PL e transita pelo resultado na baixa.</p>
    <h3>O mapa de contas</h3>
    <p>Cada título se desdobra em <b>Saldo Contábil Bruto</b> (1.3.1.10.01.10-6), <b>(–) Perda Incorrida</b> (.40), <b>(–) Perda Esperada</b> (.60, ausente nos títulos públicos federais — não se provisiona contra o risco do próprio Tesouro), <b>(+/–) Ajuste de Hedge</b> (.70) e <b>(+/–) Ajuste a Valor Justo</b> (.80). No resultado: 7.1.5.10 Rendas de Títulos de Renda Fixa, 7.1.5.75 Lucros com Títulos de Renda Fixa, 7.1.9.93 e 8.1.9.93 Receitas e Despesas de Ajuste a Valor Justo. No PL: 6.1.6.15 (+/–) Instrumentos Financeiros Classificados como VJORA.</p>
  `,

/* ---- 1.5 */
{
  nome: "Interfinanceiras e compromissadas",
  tag: "Depósitos interfinanceiros, compromissadas e ativos mantidos para venda",
  colinha: `
    <p>Muda o subgrupo, não muda a lógica. Tudo o que vimos sobre classificação, reconhecimento e mensuração vale igualmente aqui, porque as operações interfinanceiras de liquidez também são instrumentos financeiros.</p>
    <h3>O que são</h3>
    <p>São <b>empréstimos entre instituições financeiras</b>, feitos para administrar desequilíbrios pontuais de caixa. Ficam no subgrupo <b>1.2 — Aplicações Interfinanceiras de Liquidez</b>, do lado de quem aplica. Há duas espécies, e a diferença é a <b>garantia</b>:</p>
    <ul>
      <li><b>Depósitos interfinanceiros (DI)</b> — <b>sem</b> exigência de garantia. Registrados em 1.2.2.10, com receita em 7.1.4.20 (Rendas de Aplicações em Depósitos Interfinanceiros).</li>
      <li><b>Operações compromissadas</b> — <b>com</b> garantia, representada por títulos dados em lastro.</li>
    </ul>
    <p>Sobre os DI, o Cosif exige controles analíticos que identifiquem os depositários e as características dos depósitos (valor, taxa, prazo, vencimento) e os rendimentos apropriados e a apropriar, além de <b>conciliações periódicas</b>, por ocasião dos balancetes, com os extratos da entidade registradora, que devem ser <b>autenticados e arquivados</b>.</p>
    <div class="aviso"><b>Atualização.</b> O texto do Cosif e as questões antigas mencionam a <b>CETIP</b> como entidade registradora. A CETIP foi incorporada pela <b>B3</b> em 2017. Se a banca reproduzir a literalidade antiga, o gabarito segue a literalidade — mas saiba que a entidade mudou de nome.</div>
    <h3>A operação compromissada</h3>
    <p>É um empréstimo com garantia em título. O Banco Gama precisa de caixa e tem um título que não quer vender: vende-o com <b>compromisso de recompra</b>. O Banco Ômega compra com <b>compromisso de revenda</b>. Gama obteve liquidez sem perder o papel; Ômega aplicou com garantia.</p>
    <table class="tabela">
      <tr><th></th><th>Vendedor</th><th>Comprador</th></tr>
      <tr><td>Posição</td><td>Captação → <b>passivo</b></td><td>Aplicação → <b>ativo</b></td></tr>
      <tr><td>Rubrica</td><td class="cod">4.2.1.10 Recompras a Liquidar — Carteira Própria</td><td class="cod">1.2.1.10 Revendas a Liquidar — Posição Bancada</td></tr>
      <tr><td>Resultado</td><td class="cod">8.1.1.50 (–) Despesas de Operações Compromissadas</td><td class="cod">7.1.4.10 Rendas de Aplicações em Operações Compromissadas</td></tr>
    </table>
    <p>O título dado em lastro <b>não muda de dono</b> na contabilidade do vendedor: é apenas destacado no ativo, transferido para <b>1.3.2.10 — Títulos de Renda Fixa Vinculados a Recompras</b>, pelo valor médio contábil atualizado. A diferença entre o valor de recompra e o de venda é despesa para o vendedor e renda para o comprador, apropriada por competência, <b>pro rata dias</b>.</p>
    <h3>Por que o título fica no ativo do vendedor</h3>
    <p>A Res. 4.966 deu base normativa expressa a isso. Toda transferência de ativos financeiros se classifica em três categorias: <b>com transferência substancial</b> dos riscos e benefícios; <b>com retenção substancial</b>; e <b>sem transferência nem retenção substancial</b>. A norma enquadra expressamente na <b>retenção substancial</b> a venda de ativo financeiro em conjunto com compromisso de recompra a preço fixo — ou seja, a compromissada — e também os contratos de empréstimo de TVM.</p>
    <p>Nessa categoria: o ativo <b>permanece integralmente</b> no ativo do vendedor; os valores recebidos entram no ativo com contrapartida em <b>passivo</b> pela obrigação assumida; e as receitas e despesas são apropriadas de forma segregada pelo prazo remanescente, no mínimo mensalmente.</p>
    <div class="aviso"><b>O critério que decide.</b> O que define se o ativo sai do balanço <b>não é a forma jurídica</b> da operação, e sim <b>quem ficou com os riscos e os benefícios</b>. Na venda incondicional há transferência substancial: aí o ativo é baixado e o resultado da negociação é apropriado ao período de forma segregada.</div>
    <h3>As quatro carteiras</h3>
    <table class="tabela">
      <tr><th>Carteira</th><th>Título</th><th>Recursos</th></tr>
      <tr><td>Própria bancada</td><td>Próprio</td><td>Próprios</td></tr>
      <tr><td>Própria financiada</td><td>Próprio</td><td>De terceiros</td></tr>
      <tr><td>De terceiros bancada</td><td>De terceiros</td><td>Próprios</td></tr>
      <tr><td>De terceiros financiada</td><td>De terceiros</td><td>De terceiros</td></tr>
    </table>
    <p>Existe ainda a <b>Posição Vendida</b> (1.2.1.30), usada quando o título recebido em lastro é definitivamente vendido nas operações com livre movimentação. Atenção à base normativa: as definições das quatro carteiras eram texto expresso do antigo item 1.4.3.1 do Cosif, que <b>não existe mais</b> — as expressões sobrevivem apenas como nomenclatura de rubricas do elenco.</p>
    <h3>Ativos não financeiros mantidos para venda</h3>
    <p>Seção 4 do Cosif, subseção 4.1 (Resolução CMN nº 4.747/2019). É o ativo não financeiro, ou grupo de alienação, que atenda a uma de duas condições:</p>
    <ul>
      <li><b>Alínea "a"</b> — seja realizado pela venda, esteja disponível para venda imediata em suas condições atuais e a alienação seja <b>altamente provável no período máximo de um ano</b>; ou</li>
      <li><b>Alínea "b"</b> — tenha sido <b>recebido em liquidação</b> de instrumentos financeiros de difícil ou duvidosa solução, não destinados ao próprio uso. É o imóvel recebido em dação, o bem retomado.</li>
    </ul>
    <table class="tabela">
      <tr><th>Origem</th><th>Mensuração: menor valor entre</th></tr>
      <tr><td>Alínea "a"</td><td>O valor contábil líquido (deduzidas provisões e depreciação acumulada) <b>e</b> o valor justo líquido de despesas de venda</td></tr>
      <tr><td>Alínea "b"</td><td>O <b>valor contábil bruto do instrumento financeiro</b> <b>e</b> o valor justo do bem, líquido de despesas de venda</td></tr>
    </table>
    <ul>
      <li>Os da alínea "a" são reclassificados para o <b>circulante</b> na data em que a instituição decidir vendê-los; os da alínea "b" são reconhecidos na <b>data do recebimento</b>, quando a instituição obteve posse, domínio e controle.</li>
      <li>Não vendidos em <b>um ano</b> da reclassificação ou do reconhecimento inicial, vão para o <b>realizável a longo prazo</b>.</li>
      <li>Ganho por aumento posterior do valor justo pode ser reconhecido, mas <b>limitado à perda acumulada</b> reconhecida em períodos anteriores.</li>
      <li><b>É vedado reconhecer depreciação ou amortização</b> desses ativos.</li>
    </ul>
  `,

{
  nome: "O que é um derivativo",
  tag: "Definição, nocional, bolsa e balcão, agentes",
  colinha: `
    <div class="aviso"><b>Antes de tudo, o regime de transição.</b> Os derivativos vivem sob duas camadas. A <b>Circular BCB nº 3.082/2002</b> continua no Cosif, na subseção 2.4 — diferentemente da Circular 3.068/2001, que foi integralmente revogada. E a <b>Res. CMN nº 4.966/2021</b> já vale desde 1º/1/2025 para classificação e mensuração, mas a <b>contabilidade de hedge</b> dela só produz efeitos em <b>1º/1/2027</b>.</div>
    <table class="tabela">
      <tr><th>Quando</th><th>O que vale</th></tr>
      <tr><td>Até 31/12/2024</td><td>Circular 3.082/2002 integral, com derivativos a valor de mercado</td></tr>
      <tr><td>1º/1/2025 a 31/12/2026</td><td><b>Regime híbrido</b>: classificação e mensuração pela 4.966 (valor justo no resultado); hedge ainda pela Circular 3.082</td></tr>
      <tr><td>A partir de 1º/1/2027</td><td>Hedge pela 4.966 e pela Res. BCB 352/2023, com reclassificação obrigatória das operações existentes</td></tr>
    </table>
    <h3>A definição</h3>
    <p>Aparece duas vezes no Cosif, com redações quase idênticas. Os <b>três elementos</b> são o que você usa para reconhecer um derivativo em qualquer enunciado:</p>
    <table class="tabela">
      <tr><th>Elemento</th><th>O que significa</th></tr>
      <tr><td><b>Valor derivado</b></td><td>O valor varia em função de uma variável de referência: taxa de juros, preço de título ou mercadoria, taxa de câmbio, índice de bolsa, índice de preço, índice ou classificação de crédito</td></tr>
      <tr><td><b>Investimento inicial nulo ou pequeno</b></td><td>Não se paga o valor do ativo-objeto para entrar na operação</td></tr>
      <tr><td><b>Liquidação futura</b></td><td>O contrato se resolve em data futura, não no ato</td></tr>
    </table>
    <p>A Res. 4.966 acrescentou uma condição que a Circular 3.082 não tinha e que já apareceu em prova: no caso de <b>variável não financeira</b>, ela <b>não pode ser específica de uma das partes</b> do contrato. Um contrato cujo pagamento dependa do faturamento da própria contraparte não é derivativo.</p>
    <p>A variável de referência chama-se <b>ativo subjacente</b> (ou ativo-objeto, ativo de referência). O tamanho da posição chama-se <b>valor nocional</b>.</p>
    <h3>Nocional × patrimonial</h3>
    <ul>
      <li><b>Valor nocional</b> — o tamanho do contrato: quantidade do ativo subjacente × preço de referência. Mede a exposição, mas <b>não transita pelo balanço</b>: fica em contas de compensação. Por isso se diz que é <i>off balance</i>.</li>
      <li><b>Valor patrimonial</b> — o que efetivamente afeta o patrimônio: prêmio pago ou recebido, ajuste diário, diferencial de swap, ajuste a valor justo.</li>
    </ul>
    <p>Se o banco compra 100 contratos futuros de dólar, de US$ 50.000 cada, a R$ 3,30, o nocional é R$ 16.500.000,00 — mas ele não desembolsou isso. Desembolsou a margem de garantia, e depois vai pagando ou recebendo ajustes diários.</p>
    <div class="aviso"><b>Mudou de endereço.</b> No regime antigo o nocional (então chamado <b>valor de referência</b>) ia para 3.0.6.10 e 9.0.6.10, sem segregação. Hoje vai para o desdobramento próprio <b>3.2.8 / 9.2.8 — Contratos Derivativos: Valor Nocional</b>, segregado por posição comprada e vendida, por modalidade e por fator de risco. E cuidado: a conta 3.0.6.10 ainda existe, mas hoje serve para operações realizadas <b>por conta de terceiros</b>.</div>
    <h3>Bolsa e balcão</h3>
    <table class="tabela">
      <tr><th></th><th>Bolsa</th><th>Balcão</th></tr>
      <tr><td>Padronização</td><td>Contratos padronizados pela bolsa</td><td>Todos os elementos são negociáveis</td></tr>
      <tr><td>Liquidez</td><td>Alta</td><td>Baixa</td></tr>
      <tr><td>Encerramento antecipado</td><td>Basta reverter a posição</td><td>Em regra mantém-se até o termo</td></tr>
      <tr><td>Garantia</td><td>Contraparte central, com margem de garantia</td><td>Risco de crédito integral da contraparte</td></tr>
      <tr><td>Custo</td><td>Maior</td><td>Menor, com mais flexibilidade</td></tr>
    </table>
    <p>No Brasil, a <b>B3</b> — resultado da combinação, em 2017, entre BM&FBovespa e Cetip — concentra a negociação e o registro, operando tanto bolsa quanto balcão. A característica do mercado brasileiro é a preferência por contratos padronizados liquidados por contraparte central.</p>
    <h3>Quem participa</h3>
    <table class="tabela">
      <tr><th>Agente</th><th>O que faz</th><th>O que traz ao mercado</th></tr>
      <tr><td><b>Hedger</b></td><td>Protege-se de oscilações adversas que afetem a sua atividade</td><td>Foi para ele que o mercado nasceu</td></tr>
      <tr><td><b>Especulador</b></td><td>Assume deliberadamente o risco, apostando na direção do mercado</td><td>Liquidez</td></tr>
      <tr><td><b>Arbitrador</b></td><td>Aproveita distorções de preço entre mercados, com lucro sem risco</td><td>Uniformidade de preços</td></tr>
      <tr><td><b>Market maker</b></td><td>Compromete-se a ofertar preços de compra e venda e a carregar posição própria</td><td>Liquidez contínua e formação de preços</td></tr>
    </table>
    <p>Duas armadilhas: o <b>hedger não é necessariamente pessoa física</b> — pode ser produtor, empresa ou instituição financeira; e quem aproveita distorção momentânea entre dois mercados é o <b>arbitrador</b>, não o especulador. E a distinção conceitual mais importante: o que separa <b>hedge</b> de <b>trade</b> não é a operação em si, mas a <b>intenção</b> e a existência de uma exposição a proteger.</p>
  `,

  colinha: `
    <p>São quatro os mercados que compõem o mercado de derivativos. Existem ainda combinações — swap a termo, opção sobre swap, opção sobre futuro — conhecidas como derivativos de derivativos.</p>
    <h3>Contrato a termo</h3>
    <p>Uma parte se compromete a comprar e a outra a vender determinado ativo subjacente, em data futura, por preço previamente fixado. É uma <b>promessa de compra e venda</b>: especificam-se bem, volume, preço e data de entrega, que coincide com a do pagamento.</p>
    <p>Não é padronizado e, por isso, tem <b>baixa liquidez</b>: quem entra tende a carregar até o vencimento. Pode ser feito em bolsa ou balcão. Em <b>bolsa</b>, o registro é obrigatório e o depósito de margem é <b>facultativo</b>. Em <b>balcão</b>, o registro é facultativo, tornando-se obrigatório se alguma instituição financeira participar assumindo posição de risco.</p>
    <h3>Contrato futuro</h3>
    <p>É a versão <b>padronizada</b> do termo, negociada em mercado organizado com garantia de contraparte central. A diferença decisiva, e a mais cobrada, é o <b>ajuste diário</b>: a posição é marcada e liquidada financeiramente todos os dias — quem perdeu paga, quem ganhou recebe, em dinheiro, no dia seguinte. No termo não há ajuste diário; o acerto se dá no vencimento.</p>
    <h3>Contrato de opções</h3>
    <p>É o único derivativo <b>assimétrico</b>. O <b>titular</b> (comprador) adquire o <b>direito</b> de comprar (<i>call</i>) ou de vender (<i>put</i>) o ativo subjacente pelo <b>preço de exercício</b> (strike). O <b>lançador</b> (vendedor) assume a <b>obrigação</b> correspondente, caso o titular exerça. Por essa assimetria, o titular paga ao lançador o <b>prêmio</b> — o único desembolso certo da operação.</p>
    <table class="tabela">
      <tr><th></th><th>Titular</th><th>Lançador</th></tr>
      <tr><td>Posição</td><td>Direito de exercer</td><td>Obrigação de atender, se exercido</td></tr>
      <tr><td>Prêmio</td><td>Paga e registra no <b>ativo</b></td><td>Recebe e registra no <b>passivo</b></td></tr>
      <tr><td>Perda máxima</td><td>O prêmio pago</td><td>Ilimitada, na opção de compra a descoberto</td></tr>
      <tr><td>Ganho máximo</td><td>Ilimitado, na opção de compra</td><td>O prêmio recebido</td></tr>
    </table>
    <h3>Swap</h3>
    <p>Contrato pelo qual duas partes <b>trocam fluxos de caixa futuros</b>. Cada uma fica ativa em uma variável e passiva em outra; compara-se a evolução das duas sobre uma base de cálculo e apura-se a diferença. A função econômica típica é <b>trocar indexador</b>: um banco com passivo em dólar e receita em reais troca a ponta dólar por CDI, eliminando o descasamento.</p>
    <p>Daí nascem os dois conceitos que a contabilidade usa: <b>diferencial a receber</b>, no ativo (1.3.3.15), e <b>diferencial a pagar</b>, no passivo (4.7.1.10). A banca inverte os dois com frequência. Como os swaps são de balcão e feitos sob medida, quase nunca têm preço observável: a mensuração se dá por modelo de precificação.</p>
    <h3>Quadro-resumo</h3>
    <table class="tabela">
      <tr><th></th><th>Termo</th><th>Futuro</th><th>Opções</th><th>Swap</th></tr>

    </table>

{
  nome: "Classificação e registro",

  colinha: `
    <h3>O raciocínio em duas linhas</h3>
    <p>Um derivativo <b>nunca passa no teste dos fluxos de caixa</b>. Os fluxos de um futuro de dólar, de uma opção ou de um swap não são pagamentos de principal e juros sobre o valor do principal — não há principal emprestado, e o que se paga não é contraprestação pelo valor do dinheiro no tempo. Falhando o segundo teste, o ativo cai na categoria residual: <b>valor justo no resultado</b>.</p>
    <p>Do lado do passivo a norma nem precisa de raciocínio: ela é <b>expressa</b> ao excepcionar da regra do custo amortizado os derivativos que sejam passivos, mandando-os para VJR.</p>
    <div class="aviso"><b>Conclusão prática.</b> Todo instrumento financeiro derivativo é mensurado pelo <b>valor justo</b>, com a valorização ou desvalorização em contrapartida ao <b>resultado do período</b>, no mínimo por ocasião dos balancetes e balanços. A única situação em que a variação escapa do resultado é o <b>hedge de fluxo de caixa</b> — e mesmo assim apenas quanto à <b>parcela efetiva</b>.</div>
    <table class="tabela">
      <tr><th></th><th>Até 31/12/2024</th><th>Vigente</th></tr>
      <tr><td>Base normativa</td><td>Circular BCB 3.082/2002</td><td>Res. CMN 4.966/2021 e Res. BCB 352/2023</td></tr>
      <tr><td>Nome</td><td>Avaliação pelo valor de mercado</td><td>Mensuração pelo valor justo</td></tr>
      <tr><td>Fundamento</td><td>Regra específica para derivativos</td><td>Consequência da classificação em VJR</td></tr>
      <tr><td>Metodologia</td><td>Quatro parâmetros previstos na norma</td><td>Hierarquia de valor justo em três níveis (CPC 46)</td></tr>
      <tr><td>Exceções</td><td>Duas</td><td><b>Nenhuma</b></td></tr>
    </table>
    <p>As duas exceções antigas sumiram: o derivativo contratado em <b>negociação associada</b> a captação ou aplicação — expressão que não tem mais nenhuma ocorrência no Cosif — e o derivativo que protegia título classificado como <b>mantido até o vencimento</b>, categoria extinta em 1º/1/2025.</p>
    <p>Permanece, porém, a regra de bom senso: a <b>responsabilidade pela metodologia</b> de mensuração é da <b>instituição</b>, não do Banco Central. O BCB verifica nas inspeções e pode determinar a reclassificação dos instrumentos, com reconhecimento dos efeitos nas demonstrações.</p>
    <h3>Derivativos embutidos e contratos híbridos</h3>
    <p><b>Contrato híbrido</b> é o que tem um componente principal não derivativo e pelo menos um derivativo embutido — pense numa debênture cuja remuneração inclua parcela atrelada ao preço de uma commodity.</p>
    <table class="tabela">
      <tr><th>Componente principal</th><th>Até 31/12/2024</th><th>Vigente</th></tr>
      <tr><td>Ativo financeiro</td><td>Segregava</td><td><b>Classificação conjunta</b>: o híbrido é classificado como um só instrumento</td></tr>
      <tr><td>Passivo financeiro ou item não financeiro</td><td>Segregava</td><td><b>Classificação segregada</b>: o não financeiro segue regulamentação própria; o passivo e o embutido seguem a Seção 2</td></tr>
    </table>
    <p>A lógica nova é a do IFRS 9: quando o principal é <b>ativo financeiro</b>, não se separa nada — e, como o embutido faz os fluxos deixarem de ser somente principal e juros, o híbrido inteiro tende a cair em <b>VJR</b>. A separação sobrevive apenas quando o principal é passivo financeiro ou item não financeiro.</p>
    <h3>A vedação de compensar</h3>
    <p>A Circular 3.082 mandava registrar individualmente o resultado de cada operação, vedando compensar receitas com despesas de contratos distintos, mesmo da mesma modalidade — mas <b>admitia</b> compensar receitas e despesas dentro do próprio semestre relativas a <b>um mesmo contrato</b>.</p>
    <p>Hoje isso foi absorvido pela vedação geral da 4.966: é vedado o reconhecimento de ativo e passivo financeiros, ou grupo deles, <b>com base em valor líquido</b>, inclusive quando geridos em conjunto. A mensagem é a mesma — não se compensa —, mas a <b>permissão de compensação semestral por contrato não tem correspondente</b> na norma nova.</p>
    <h3>As regras de registro que sobreviveram no Cosif</h3>
    <table class="tabela">
      <tr><th>Modalidade</th><th>Procedimento</th><th>Ainda no Cosif?</th></tr>
      <tr><td><b>A termo</b></td><td>Registrar, na data da operação, o valor final contratado <b>deduzido</b> da diferença entre esse valor e o preço à vista, em <b>subtítulo retificador de uso interno</b>, reconhecendo receitas e despesas em razão do prazo de fluência</td><td><b>Sim</b></td></tr>
      <tr><td><b>Futuro</b></td><td>Registrar o valor dos <b>ajustes diários</b> em conta de ativo ou passivo, apropriando-os como receita ou despesa</td><td><b>Sim</b></td></tr>
      <tr><td>Opções</td><td>Registrar o prêmio em ativo ou passivo, nele permanecendo <b>até o efetivo exercício</b></td><td>Não — regra geral da 4.966</td></tr>
      <tr><td>Swap</td><td>Registrar o diferencial a receber ou a pagar em ativo ou passivo</td><td>Não — regra geral da 4.966</td></tr>
    </table>
    <p>Na prática os procedimentos de opções e swap continuam sendo aplicados assim; o que mudou foi a base normativa e o vocabulário, de "valor de mercado" para "valor justo".</p>
  `,

  nome: "Contabilidade de hedge",
  tag: "As duas categorias vigentes e as condições de efetividade",
  colinha: `
    <p><b>Hedge</b>, em inglês, é cerca viva — proteção. A definição que você leva decorada:</p>
    <div class="aviso">Hedge é a <b>designação</b> de um ou mais instrumentos financeiros derivativos com o objetivo de compensar, <b>no todo ou em parte</b>, os riscos decorrentes da exposição às variações no valor de mercado ou no fluxo de caixa de qualquer ativo, passivo, compromisso ou transação futura prevista, <b>registrado contabilmente ou não</b>, ou ainda grupos ou partes desses itens com características similares e cuja resposta ao risco ocorra de modo semelhante.</div>
    <p>Três detalhes que a banca explora: o objeto pode estar <b>registrado contabilmente ou não</b> (pode ser transação futura); pode ser <b>grupo ou parte</b> de itens; e a compensação pode ser <b>no todo ou em parte</b> — o hedge não precisa ser perfeito.</p>
    <h3>Por que existe um regime especial</h3>
    <p>Para corrigir <b>descompassos</b>. Em um caso, o item protegido não é ajustado a valor justo, mas o derivativo é: o resultado oscila sem contrapeso — economicamente protegida, contabilmente exposta. É o <b>descompasso de critério de mensuração</b>, e a resposta é o hedge de <b>risco de mercado</b>. No outro, o item protegido ainda não existe (a safra que será vendida em 120 dias): é o <b>descompasso de momento de reconhecimento</b>, e a resposta é o hedge de <b>fluxo de caixa</b>.</p>
    <h3>As duas categorias (até 31/12/2026)</h3>
    <table class="tabela">
      <tr><th>Categoria</th><th>Quando se aplica</th><th>Onde vai o ajuste do instrumento</th></tr>
      <tr><td><b>Hedge de risco de mercado</b></td><td>Compensar riscos da exposição à variação no valor de mercado do item objeto</td><td>Conta de receita ou despesa, no <b>resultado</b></td></tr>
      <tr><td><b>Hedge de fluxo de caixa</b></td><td>Compensar variação no fluxo de caixa futuro estimado</td><td><b>Parcela efetiva</b> em conta destacada do PL, deduzida dos efeitos tributários; qualquer outra variação, no resultado</td></tr>
    </table>
    <p>Nos <b>dois</b> casos, tanto o <b>instrumento</b> de hedge quanto o <b>item objeto</b> devem ser ajustados ao valor de mercado, no mínimo por ocasião dos balancetes mensais e balanços. Essa simetria é o coração do mecanismo.</p>
    <p><b>Parcela efetiva</b> é aquela em que a variação do item objeto, diretamente relacionada ao risco correspondente, é compensada pela variação do instrumento, considerando o <b>efeito acumulado</b>. O que exceder é a <b>inefetividade</b>, e vai direto ao resultado.</p>
    <h3>As quatro condições cumulativas</h3>
    <ul>
      <li><b>Identificação documental</b> do risco objeto de hedge, com informação detalhada, destacados o processo de gerenciamento de risco e a metodologia de avaliação da efetividade, <b>desde a concepção</b>;</li>
      <li><b>Comprovação da efetividade</b> desde a concepção e no decorrer da operação, com indicação de que as variações se compensam no intervalo entre <b>80% e 125%</b>;</li>
      <li>Previsão de <b>renovação ou nova contratação</b> quando o derivativo vencer antes do item objeto;</li>
      <li>Demonstração, nos compromissos ou transações futuras em hedge de fluxo de caixa, de <b>elevada probabilidade de ocorrência</b> e comprovação de que a exposição pode afetar o resultado.</li>
    </ul>
    <p>A sanção: o não atendimento, a qualquer tempo, implica a <b>imediata transferência ao resultado</b>, no hedge de fluxo de caixa, dos valores registrados no PL.</p>
    <div class="aviso"><b>Duas armadilhas.</b> Primeira: são <b>duas</b> categorias, não três — não existe "hedge de risco cambial" como categoria autônoma na Circular 3.082. Segunda: a redação anterior trazia uma <b>quinta condição</b> cumulativa, a de não ter como contraparte empresa do consolidado econômico-financeiro, apoiada na Resolução 2.723/2000. Essa alínea <b>não consta mais</b> do texto reproduzido no Cosif.</div>
    <h3>Hedge de variação cambial de investimentos no exterior</h3>
    <p>Regime específico da Resolução CMN nº 4.524/2016, na subseção 2.4. Alcança os derivativos contratados para compensar riscos da exposição à variação cambial de investimentos em dependências e em participações societárias em coligadas ou controladas no exterior. O eixo é a <b>moeda funcional</b>: a moeda do ambiente econômico principal em que a entidade opera.</p>
    <p>A designação considera cumulativamente cinco fatores: o ambiente em que a entidade gera e despende caixa; a moeda que mais influencia preços de venda e custos; a moeda do país cujos aspectos competitivos e regulatórios mais influenciam os preços; a moeda das atividades de financiamento; e a moeda em que os recursos operacionais são acumulados.</p>
    <ul>
      <li>A moeda funcional das instituições que atuam <b>no País</b> é obrigatoriamente a <b>moeda nacional</b>.</li>
      <li>A alteração da moeda funcional da investida só é permitida com <b>mudança significativa no ambiente econômico principal</b>, e a conversão se aplica <b>prospectivamente</b>. O BCB pode determinar a alteração se a definição for inadequada.</li>
      <li>Os derivativos seguem os procedimentos do <b>hedge de fluxo de caixa</b>.</li>
      <li><b>Ativos e passivos financeiros não derivativos</b> podem ser usados como instrumento de hedge nessa modalidade, desde que previamente designados.</li>
      <li>A parcela efetiva no PL é transferida ao resultado <b>simultaneamente à baixa</b>, total ou parcial, do investimento no exterior.</li>
    </ul>
  `,

/* ---- 2.5 */
{
  nome: "2027 e derivativos de crédito",
  tag: "O novo regime de hedge e a negociação do risco",
  colinha: `
    <h3>O que muda em 1º de janeiro de 2027</h3>
    <table class="tabela">
      <tr><th>Tema</th><th>Até 31/12/2026 (Circular 3.082)</th><th>A partir de 1º/1/2027 (4.966 e 352)</th></tr>
      <tr><td>Categorias</td><td><b>Duas</b>: risco de mercado e fluxo de caixa</td><td><b>Três</b>: valor justo, fluxo de caixa e investimento no exterior</td></tr>
      <tr><td>Nome da operação</td><td>Operação de hedge</td><td><b>Relação de proteção</b></td></tr>
      <tr><td>Teste de efetividade</td><td>Quantitativo, faixa fixa de <b>80% a 125%</b></td><td>Relação econômica entre item e instrumento, efeito do risco de crédito e <b>índice de hedge</b>; <b>sem</b> faixa fixa</td></tr>
      <tr><td>Ajuste de parâmetros</td><td>Não previsto</td><td><b>Rebalanceamento</b> do índice de hedge, sem descontinuar a relação</td></tr>
      <tr><td>Encerramento</td><td>Descumprimento → transferência imediata ao resultado</td><td><b>Descontinuidade</b> da relação, admitida também a <b>revogação voluntária</b> em hipóteses específicas</td></tr>
      <tr><td>Item objeto</td><td>A valor de mercado</td><td>A valor justo, com registro do <b>ajuste acumulado</b> sobre o item, inclusive o remanescente em caso de descontinuidade</td></tr>
    </table>
    <p>Três regras de transição já escritas e prontas para virar questão: as operações de hedge reconhecidas contabilmente devem ser <b>reclassificadas</b> em 1º/1/2027 para as novas categorias; fica <b>facultada a redefinição</b> das operações naquela data; e a instituição deve <b>descontinuar</b> o reconhecimento contábil das operações que não atenderem aos novos critérios.</p>
    <div class="aviso"><b>O elenco chegou antes da norma.</b> O desdobramento <b>3.2.9 — Contabilidade de Hedge</b> já traz as três categorias do regime de 2027: hedge de valor justo, hedge de fluxo de caixa e hedge de investimento no exterior. A norma vigente até 2026 fala em "hedge de risco de mercado"; o plano de contas já fala em "hedge de valor justo". Essa dissonância é candidata natural a questão.</div>
    <p>O vocabulário do novo modelo aparece também nos requisitos de evidenciação da subseção 2.3: relação de proteção, relação econômica, índice de hedge, inefetividade reconhecida no resultado, descontinuidade, revogação voluntária e o <b>macro hedge</b> — hedge de valor justo de exposição à taxa de juros de carteiras de ativos ou passivos financeiros.</p>
    <h3>Derivativos de crédito</h3>
    <p>São contratos que permitem <b>negociar o risco de crédito separadamente</b> do instrumento que o originou. O banco quer manter o ativo em carteira — por relacionamento, rentabilidade ou estratégia — mas não quer carregar todo o risco de inadimplência. O ativo continua no balanço; o risco é transferido.</p>
    <table class="tabela">
      <tr><th>Modalidade</th><th>Como funciona</th></tr>
      <tr><td><b>Swap de crédito</b></td><td>O comprador de proteção paga taxa periódica ao vendedor, em troca de pagamento condicionado à ocorrência de <b>evento de crédito</b></td></tr>
      <tr><td><b>Swap de taxa de retorno total</b></td><td>O retorno total de um ativo, durante o período de posse, é trocado por outro fluxo. <b>Não é específico</b> quanto a eventos de crédito: remove integralmente o risco econômico do ativo, sem vendê-lo</td></tr>
      <tr><td><b>Nota ligada ao crédito</b> (credit linked note)</td><td>Título comum combinado com derivativo de crédito: paga cupons e principal, mas o emissor pode <b>reduzir o principal</b> a devolver se ocorrer evento de crédito</td></tr>
    </table>
    <p>Característica importante: derivativos de crédito <b>não são negociados em bolsa</b>, e sim contratados em <b>balcão</b>.</p>
    <p>O Cosif traz hoje, na subseção 2.4, apenas dois comandos, ambos cobráveis na literalidade: ocorrendo evento de crédito que implique <b>transferência do ativo subjacente</b>, procede-se à <b>baixa</b> pela instituição detentora, com registro, pela contraparte, do ativo devidamente ajustado pela adequada provisão; e aplicam-se aos derivativos de crédito os critérios de registro e avaliação da <b>Circular 3.082/2002</b>.</p>
    <ul>
      <li>Na contraparte <b>transferidora do risco</b> (compra proteção): registra-se no <b>ativo</b> o valor pago ou a pagar da taxa de proteção, apropriado como <b>despesa</b> pela fluência do prazo, ou integralmente quando ocorrer o evento de crédito.</li>
      <li>Na contraparte <b>receptora do risco</b> (vende proteção): registra-se no <b>passivo</b> o valor recebido ou a receber, apropriado como <b>receita</b> pelo mesmo critério.</li>
    </ul>
