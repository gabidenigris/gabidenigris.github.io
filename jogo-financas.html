<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fronteira Eficiente: o jogo de Finanças</title>
<meta name="description" content="Jogo de estudo de Finanças para o concurso do Banco Central do Brasil: valuation, curva de juros, teoria de carteiras, duration, VaR, derivativos, instrumentos do mercado e ESG.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --mesa:#223041;
  --mesa-2:#1a2634;
  --papel:#FCFBF7;
  --barra:#E4EAF3;
  --linha:#C6D1E0;
  --tinta:#16233A;
  --tinta-2:#53637B;
  --selo:#1B5E8C;
  --carimbo:#B3341F;
  --latao:#A8791A;
  --foco:#0E6E5C;
  --disp:"Fraunces","Georgia",serif;
  --ui:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--mesa);
  background-image:radial-gradient(ellipse at 50% -10%, #2c3d51 0%, var(--mesa) 55%, var(--mesa-2) 100%);
  background-attachment:fixed;
  font-family:var(--ui);
  color:var(--tinta);
  line-height:1.5;
  padding:22px 12px 60px;
  -webkit-text-size-adjust:100%;
}

/* ---------- a folha de formulário contínuo ---------- */
.folha{
  position:relative;
  max-width:800px;
  margin:0 auto;
  background:var(--papel);
  border-radius:2px;
  box-shadow:0 18px 40px rgba(0,0,0,.35), 0 2px 0 rgba(255,255,255,.06);
  padding:26px 24px 30px 24px;
}
.folha::before,.folha::after{
  content:"";position:absolute;top:0;bottom:0;width:20px;
  background-image:radial-gradient(circle at 10px 12px, var(--mesa) 3.4px, rgba(0,0,0,.06) 4.2px, transparent 4.8px);
  background-size:20px 24px;
  border-right:1px dashed var(--linha);
}
.folha::before{left:0}
.folha::after{right:0;border-right:0;border-left:1px dashed var(--linha)}
.folha > *{position:relative;z-index:1}
@media(min-width:640px){ .folha{padding:30px 44px 34px 44px} }
@media(max-width:520px){
  .folha::before,.folha::after{display:none}
  .folha{padding:20px 15px 24px}
}

/* ---------- cabeçalho ---------- */
.cabecalho{
  display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between;
  border-bottom:2px solid var(--tinta);padding-bottom:8px;margin-bottom:18px;
}
.marca{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--tinta-2)}
.placar{font-family:var(--mono);font-size:13px;display:flex;gap:14px;align-items:center}
.placar b{color:var(--latao);font-weight:600}
.vidas span{letter-spacing:2px}
.vidas .gasta{opacity:.22}

/* ---------- tipografia ---------- */
h1{font-family:var(--disp);font-weight:700;font-size:clamp(34px,8vw,60px);line-height:.95;margin:0 0 6px;letter-spacing:-.02em}
h2{font-family:var(--disp);font-weight:600;font-size:clamp(22px,4.6vw,31px);line-height:1.1;margin:0 0 8px;letter-spacing:-.01em}
h3{font-family:var(--ui);font-weight:600;font-size:15px;margin:20px 0 6px}
p{margin:0 0 12px;max-width:64ch}
.sub{color:var(--tinta-2);font-size:16px;max-width:52ch}
.mono{font-family:var(--mono)}
.oculto{display:none !important}

/* ---------- capa ---------- */
.capa-selo{
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--carimbo);
  border:1.5px solid var(--carimbo);border-radius:2px;display:inline-block;
  padding:4px 9px;transform:rotate(-1.6deg);margin-bottom:18px;
}
.capa h1{margin-top:4px}
.capa .lead{font-size:18px;max-width:46ch;margin-top:14px}
.regras{
  margin:22px 0 6px;border-top:1px solid var(--linha);border-bottom:1px solid var(--linha);
  padding:14px 0;display:grid;gap:10px;
}
@media(min-width:620px){.regras{grid-template-columns:1fr 1fr 1fr;gap:22px}}
.regra{font-size:14px;color:var(--tinta-2)}
.regra b{display:block;color:var(--tinta);font-size:14px;font-weight:600;margin-bottom:2px}

/* ---------- botões ---------- */
.btn{
  font-family:var(--ui);font-size:15px;font-weight:500;
  background:var(--tinta);color:var(--papel);border:1.5px solid var(--tinta);
  padding:11px 20px;border-radius:2px;cursor:pointer;
  transition:background .13s ease,color .13s ease;
}
.btn:hover{background:#28374f}
.btn.fantasma{background:transparent;color:var(--tinta)}
.btn.fantasma:hover{background:rgba(22,35,58,.07)}
.btn.selo{background:var(--selo);border-color:var(--selo)}
.btn.selo:hover{background:#164e75}
.btn:disabled{opacity:.4;cursor:default}
.acoes{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
:focus-visible{outline:2.5px solid var(--foco);outline-offset:2px}

/* ---------- mapa de fases ---------- */
.mapa{margin-top:14px;border-top:1px solid var(--linha)}
.fase-linha{
  display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;
  width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--linha);
  padding:12px 8px;cursor:pointer;font-family:var(--ui);color:var(--tinta);
}
.fase-linha:nth-child(odd){background:var(--barra)}
.fase-linha:hover:not(:disabled){background:#dbe3ef}
.fase-linha:disabled{cursor:default;color:#98a3b2}
.fase-num{font-family:var(--mono);font-size:17px;color:var(--tinta-2)}
.fase-nome{font-weight:600;font-size:15.5px;display:block}
.fase-tag{font-size:13px;color:var(--tinta-2);display:block}
.fase-linha:disabled .fase-tag{color:#a8b2be}
.fase-status{font-family:var(--mono);font-size:12px;white-space:nowrap}
.fase-status.ok{color:var(--selo)}
.medalha{font-size:15px}

/* ---------- colinha ---------- */
.colinha{font-size:15px}
.colinha p{margin-bottom:10px}
.colinha ul{margin:0 0 14px;padding-left:20px}
.colinha li{margin-bottom:6px;max-width:62ch}
.colinha code{font-family:var(--mono);font-size:.92em;background:var(--barra);padding:1px 5px;border-radius:2px}
.colinha .aviso{
  border-left:3px solid var(--carimbo);background:#fbf1ef;
  padding:10px 14px;margin:14px 0;font-size:14.5px;
}
.colinha .aviso b{color:var(--carimbo)}
.tabela{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 16px}
.tabela th{text-align:left;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--tinta-2);border-bottom:1.5px solid var(--tinta);padding:5px 8px 5px 0}
.tabela td{padding:5px 8px 5px 0;border-bottom:1px solid var(--linha)}
.tabela tr:nth-child(even) td{background:var(--barra)}
.tabela td.cod{font-family:var(--mono)}

/* oficina do dígito de controle */
.oficina{border:1px solid var(--linha);background:var(--barra);padding:14px;margin:6px 0 16px}
.oficina label{font-size:13px;display:block;margin-bottom:6px;color:var(--tinta-2)}
.oficina input{font-family:var(--mono);font-size:16px;padding:8px 10px;border:1.5px solid var(--tinta);background:var(--papel);width:190px;border-radius:2px}
.oficina .saida{font-family:var(--mono);font-size:13px;margin-top:10px;white-space:pre;overflow-x:auto}
.oficina .dv{font-size:17px;color:var(--selo);font-weight:600}

/* ---------- jogo ---------- */
.trilho{height:5px;background:var(--barra);margin:0 0 18px;position:relative;overflow:hidden}
.trilho i{position:absolute;left:0;top:0;bottom:0;background:var(--selo);width:0;transition:width .3s ease}
.enunciado{font-family:var(--disp);font-weight:600;font-size:clamp(19px,3.6vw,25px);line-height:1.25;margin:4px 0 4px;letter-spacing:-.01em}
.contexto{font-family:var(--mono);font-size:12px;letter-spacing:.09em;color:var(--tinta-2);margin-bottom:10px}
.lancamento{border:1px solid var(--linha);margin:14px 0 18px;font-family:var(--mono);font-size:13.5px}
.lancamento .lin{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:7px 12px;border-bottom:1px solid var(--linha)}
.lancamento .lin:last-child{border-bottom:0}
.lancamento .lin:nth-child(odd){background:var(--barra)}
@media(max-width:520px){
  .lancamento .lin{grid-template-columns:20px 1fr;row-gap:2px}
  .lancamento .lin span:last-child{grid-column:2;color:var(--tinta-2)}
}
.lancamento .dc{font-weight:600}
.lancamento .d{color:var(--tinta)}
.lancamento .c{color:var(--selo)}
.opcoes{display:grid;gap:8px;margin-top:6px}
.opcoes.grade{grid-template-columns:1fr}
@media(min-width:560px){.opcoes.grade{grid-template-columns:1fr 1fr}}
.op{
  display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
  background:var(--papel);border:1.5px solid var(--linha);border-radius:2px;
  padding:11px 14px;font-family:var(--ui);font-size:15px;color:var(--tinta);cursor:pointer;
  transition:border-color .12s ease,background .12s ease;
}
.op:hover:not(:disabled){border-color:var(--tinta);background:var(--barra)}
.op .tecla{font-family:var(--mono);font-size:12px;color:var(--tinta-2);border:1px solid var(--linha);border-radius:2px;padding:0 5px;line-height:19px;flex:0 0 auto;margin-top:1px}
.op:disabled{cursor:default}
.op.certa{border-color:var(--selo);background:#e8eff7}
.op.certa .tecla{border-color:var(--selo);color:var(--selo)}
.op.errada{border-color:var(--carimbo);background:#fbf0ee}
.op.errada .tecla{border-color:var(--carimbo);color:var(--carimbo)}
.op.apagada{opacity:.45}
.campo-num{display:flex;gap:10px;align-items:center;margin-top:10px}
.campo-num input{font-family:var(--mono);font-size:22px;width:92px;text-align:center;padding:9px;border:1.5px solid var(--tinta);border-radius:2px;background:var(--papel)}

/* ---------- resposta ---------- */
.resposta{position:relative;margin-top:20px;border-top:2px solid var(--tinta);padding-top:16px}
.carimbo{
  position:absolute;right:12px;top:-16px;
  font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.12em;
  border:2.5px solid currentColor;border-radius:3px;padding:5px 10px;
  transform:rotate(-8deg);opacity:0;background:var(--papel);
}
.carimbo.ok{color:var(--selo)}
.carimbo.nao{color:var(--carimbo)}
.carimbo.bate{animation:bate .42s cubic-bezier(.2,.85,.3,1) forwards}
@keyframes bate{
  0%{transform:rotate(-19deg) scale(2.5);opacity:0}
  55%{transform:rotate(-7deg) scale(.94);opacity:1}
  100%{transform:rotate(-8deg) scale(1);opacity:1}
}
.explica{font-size:15px;max-width:62ch;padding-right:96px}
.explica b{color:var(--tinta)}
@media(max-width:520px){
  .explica{padding-right:0;margin-top:26px}
  .carimbo{top:-14px;right:6px;font-size:12px}
}

/* ---------- fim de fase / diploma ---------- */
.nota{font-family:var(--disp);font-size:clamp(48px,13vw,86px);line-height:.9;font-weight:700;letter-spacing:-.03em}
.nota small{font-family:var(--ui);font-size:15px;font-weight:400;letter-spacing:0;color:var(--tinta-2);display:block;margin-top:4px}
.revisar{border-top:1px solid var(--linha);margin-top:18px;padding-top:12px}
.revisar li{font-size:14px;margin-bottom:8px;max-width:62ch}
.diploma{border:3px double var(--tinta);padding:26px 22px;text-align:center;margin:10px 0}
.diploma .selo-final{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--carimbo);border:1.5px solid var(--carimbo);display:inline-block;padding:5px 10px;transform:rotate(-2deg);margin-top:14px}

.rodape{max-width:800px;margin:16px auto 0;font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.42);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:0 6px}
.rodape button{background:none;border:0;color:inherit;font:inherit;cursor:pointer;text-decoration:underline;padding:0}
.rodape button:hover{color:rgba(255,255,255,.75)}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
  .carimbo.bate{opacity:1}
}
</style>
</head>
<body>

<main class="folha" id="folha">
  <div class="cabecalho">
    <span class="marca" id="marca">FRONTEIRA EFICIENTE · FINANÇAS</span>
    <span class="placar oculto" id="placar">
      <span class="vidas" id="vidas"></span>
      <span>XP <b id="xp">0</b></span>
      <span id="combo"></span>
    </span>
  </div>
  <div id="tela"></div>
</main>

<div class="rodape">
  <span>Finanças · aulas 01 a 08 · 32 fases · 353 perguntas comentadas</span>
  <span><button id="btn-som" type="button">som: ligado</button> · <button id="btn-zerar" type="button">apagar progresso</button></span>
</div>

<script>
/* ============================================================
   FRONTEIRA EFICIENTE: o jogo de Finanças
   Conteúdo: Aulas 01 a 08 de Finanças (BACEN, Analista Área 2)
   ============================================================ */

const MODULOS = [



/* ============================================================ MÓDULO 1 */
{
nome: "Valuation: CAPM e WACC",
subtitulo: "Aula 01 · Risco, retorno, custo de capital e avaliação de ativos",
fases: [

/* ---- 1.1 */
{
  nome: "Projetos e tipos de retorno",
  tag: "Investimentos empresariais, retorno absoluto, percentual e histórico",
  colinha: `
    <p>A aula começa por investimentos <b>empresariais</b>: decisões racionais tomadas pelas firmas para maximizar o valor do acionista. Em regra ligam-se ao ativo imobilizado ou intangível. Investimentos de curto prazo vão para o circulante e têm outro tratamento no valuation.</p>
    <h3>Recorrente, estratégico e "por solicitação"</h3>
    <ul>
      <li><b>Recorrente</b>: substituir, modernizar ou expandir os ativos usados na produção atual. Costuma nascer de exigências ambientais, trabalhistas ou do regulador.</li>
      <li><b>Estratégico</b>: quebra de paradigma, mudança de rumo ou de empreendimento. Caríssimo e de prazo muito longo (10, 20, 30 anos).</li>
      <li><b>Por solicitação</b>: pequenos desembolsos de capital (software simples, mobiliário) que não exigem cálculo de VPL ou TIR. O nome não é técnico consolidado, mas aparece em prova.</li>
    </ul>
    <p>Nem todo desembolso é ativável: <b>pesquisa não é ativável</b>. Só a partir da declaração de viabilidade econômica começa o <b>desenvolvimento</b>, esse sim ativável.</p>
    <h3>Relações entre projetos</h3>
    <table class="tabela">
      <tr><th>Tipo</th><th>Significado</th></tr>
      <tr><td><b>Independentes</b></td><td>A rentabilidade de um não é impactada de forma relevante pela execução do outro. Havendo recursos e viabilidade, podem ser executados simultaneamente.</td></tr>
      <tr><td><b>Mutuamente excludentes</b></td><td>Não podem ser implementados ao mesmo tempo, ainda que haja recursos e viabilidade. Comprar ou alugar navios; comprar ou desenvolver o software de gestão.</td></tr>
      <tr><td><b>Contingentes (dependentes)</b></td><td>Por força da execução de um projeto, o outro também terá de ser executado. Exemplo: projeto de mineração e o projeto ambiental exigido por lei.</td></tr>
    </table>
    <h3>Retorno absoluto e percentual</h3>
    <p>Cota de FII comprada por R$ 1.500, com R$ 16,50 de aluguel recebido e venda a R$ 1.573,50:</p>
    <ul>
      <li><b>Retorno absoluto</b>: 16,50 + 1.573,50 − 1.500 = <b>R$ 90,00</b></li>
      <li><b>Retorno percentual</b>: 90 ÷ 1.500 = <b>6%</b> no mês</li>
      <li><b>Retorno com aluguéis/dividendos</b>: 16,50 ÷ 1.500 = <b>1,1%</b> (se fossem dividendos, seria o <b>dividend yield</b>)</li>
      <li><b>Ganho de capital</b>: 73,50 ÷ 1.500 = <b>4,9%</b></li>
    </ul>
    <p>O retorno existe mesmo sem a venda, porque a cota <b>poderia</b> ser vendida. Vale a distinção tributária (janeiro/2024): rendimentos de FII e dividendos de ações não eram tributados para PF; <b>JSCP</b> sofre 15%; ganho de capital costuma ser <b>20%</b> em FII e <b>15%</b> em ações.</p>
    <h3>Retornos históricos e prêmio de risco</h3>
    <p>O Ibovespa é um <b>índice de retorno total</b>: pressupõe que os dividendos recebidos são reinvestidos nas mesmas ações. A teoria usa dados dos EUA porque o histórico brasileiro é distorcido por hiperinflação, juros altíssimos e mudanças de moeda.</p>
    <table class="tabela">
      <tr><th>Investimento</th><th>Retorno médio</th><th>Prêmio de risco</th></tr>
      <tr><td>Ações de pequenas empresas</td><td>17,10%</td><td>13,30%</td></tr>
      <tr><td>Ações de grandes empresas</td><td>12,30%</td><td>8,50%</td></tr>
      <tr><td>Títulos privados de LP</td><td>6,20%</td><td>2,40%</td></tr>
      <tr><td>Títulos públicos de LP</td><td>5,80%</td><td>2,00%</td></tr>
      <tr><td>Títulos de curto prazo (risk free)</td><td>3,80%</td><td>0,00%</td></tr>
    </table>
    <div class="aviso"><b>Risco não é "perder dinheiro".</b> Risco é a chance de <b>fugir da média</b>, ou seja, volatilidade. O cálculo do risco é o cálculo dos <b>desvios-padrão</b> das observações de retorno. O ativo livre de risco de referência é o <b>T-Bill</b> norte-americano.</div>
  `,
  qs: [
    {t:"pool", pool:["Independentes","Mutuamente excludentes","Contingentes"], p:"A empresa decide entre comprar ou alugar sua frota de navios.", r:1,
     e:"<b>Mutuamente excludentes.</b> Ainda que haja recursos e viabilidade, não se faz as duas coisas. É o tipo mais comum em projetos de longo prazo."},
    {t:"pool", pool:["Independentes","Mutuamente excludentes","Contingentes"], p:"Projeto de exploração mineral e o projeto de proteção ambiental exigido pela legislação para viabilizá-lo.", r:2,
     e:"<b>Contingentes (dependentes).</b> Por força da execução do primeiro, o segundo também terá de ser executado. Na prática, quando se projeta o fluxo de caixa, todas as obrigações acessórias são projetadas junto, justamente para não aprovar um projeto que só é lucrativo se você ignorar a obrigação que ele carrega."},
    {t:"pool", pool:["Independentes","Mutuamente excludentes","Contingentes"], p:"A rentabilidade de um projeto não é afetada de forma relevante pela execução do outro.", r:0,
     e:"<b>Independentes.</b> Havendo recursos e sendo viáveis técnica e economicamente, podem ser executados simultaneamente."},
    {t:"mc", p:"Investimentos em pesquisa, do ponto de vista contábil e financeiro:",
     o:["São sempre ativáveis","Não são ativáveis; só a partir da declaração de viabilidade econômica inicia-se o desenvolvimento, que é ativável","São ativáveis apenas se o projeto tiver mais de cinco anos","São ativáveis se aprovados em orçamento de capital"], r:1,
     e:"A condição básica para ser <b>ativo</b> é haver evidência de benefícios futuros. Em pesquisa essa evidência ainda não existe. A virada é a <b>declaração de viabilidade econômica</b> do produto, que inaugura a fase de desenvolvimento."},
    {t:"mc", p:"Cota de FII comprada por R$ 1.500, com R$ 16,50 de aluguel e venda por R$ 1.573,50. O retorno percentual total é:",
     o:["1,1%","4,9%","6,0%","7,3%"], r:2,
     e:"Retorno absoluto = 16,50 + 1.573,50 − 1.500 = <b>R$ 90,00</b>; percentual = 90 ÷ 1.500 = <b>6%</b>. Dentro dele, 1,1% vieram dos aluguéis e 4,9% do ganho de capital."},
    {t:"mc", p:"Dividend yield significa:",
     o:["O retorno total do investimento","O retorno obtido com dividendos, em relação ao valor investido","O ganho de capital líquido de imposto","O índice de payout da companhia"], r:1,
     e:"É o <b>retorno com dividendos</b>. No exemplo da cota, R$ 16,50 sobre R$ 1.500 dão 1,1%. Guarde a separação: o retorno total de uma ação se decompõe em <b>dividend yield</b> e <b>ganho de capital</b>."},
    {t:"mc", p:"O Ibovespa é classificado como índice de retorno total porque:",
     o:["Inclui ações de todas as empresas listadas","Pressupõe que os dividendos recebidos são reinvestidos nas mesmas ações","É calculado em dólar","Desconta a inflação do período"], r:1,

    {t:"mc", p:"Por que a teoria de finanças usa dados históricos do mercado norte-americano mesmo para avaliar empresas brasileiras?",

  tag: "Retorno esperado, risco do portfólio e risco sistemático",
  colinha: `
    <h3>Retorno esperado por cenários</h3>
    <p>É a <b>média ponderada pelas probabilidades</b>. Com renda fixa rendendo −4%, 6% e 18% e ações 31%, 12% e −25%, para cenários de 25%, 50% e 25%:</p>
    <ul>
      <li>Renda fixa: 25% × (−4%) + 50% × 6% + 25% × 18% = <b>6,50%</b>, com desvio-padrão de <b>7,79%</b></li>
      <li>Ações: 25% × 31% + 50% × 12% + 25% × (−25%) = <b>7,50%</b>, com desvio-padrão de <b>20,30%</b></li>
    </ul>
    <p>A variância aqui é <code>Σ w(Ri − R̄)²</code>, sem o ajuste de n − 1, porque os pesos representam o universo de possibilidades.</p>
    <h3>O efeito da diversificação</h3>
    <p>Meio a meio, o portfólio rende 7,00% com desvio de <b>6,33%</b>. Repare: risco <b>menor que o de qualquer um dos ativos isolados</b> e retorno maior que o da renda fixa. Não seria racional ficar 100% em renda fixa (6,50% de retorno e 7,79% de risco).</p>
    <div class="aviso">Por métodos numéricos, a carteira de <b>menor risco</b> tem <b>72,5% em renda fixa e 27,5% em renda variável</b>: retorno esperado de <b>6,77%</b> e desvio de cerca de <b>1%</b>. Adicionar renda variável até esse ponto <b>aumenta o retorno e reduz o risco</b>, porque a correlação entre os dois ativos é fortemente negativa.</div>
    <p>A adição de novos ativos sempre reduz o risco do portfólio, mas com retorno decrescente: a partir de cerca de <b>20 ativos</b> a redução adicional deixa de ser relevante. Existe um piso, e esse piso é o <b>risco sistemático</b>.</p>
    <h3>Sistemático e não sistemático</h3>
    <table class="tabela">
      <tr><th>Risco</th><th>Alcance</th><th>Exemplos</th></tr>
      <tr><td><b>Sistemático</b> (de mercado)</td><td>Atinge muitos ativos, ainda que de formas diferentes</td><td>Inflação, crescimento do PIB, ações governamentais, mudanças na tributação</td></tr>
      <tr><td><b>Não sistemático</b> (específico, idiossincrático)</td><td>Atinge um ativo ou um grupo pequeno</td><td>Vazamento de óleo da BP no golfo do México; mudança regulatória em telecomunicações</td></tr>
    </table>
    <p>Modelagem: <code>R = E(R) + m + ε</code>, onde <b>m</b> é o risco sistemático e <b>ε</b> o não sistemático. Como o não sistemático <b>pode ser eliminado sem custo pela diversificação</b>, ele <b>não deve ser recompensado</b>. Daí o <b>princípio do risco sistemático</b>: o retorno esperado de um ativo depende apenas do seu risco sistemático.</p>
    <h3>O beta</h3>
    <p>Mede quanto de risco sistemático um ativo carrega em relação ao mercado. Parecido com a correlação, mas <b>não limitado ao intervalo de −1 a 1</b>.</p>
    <table class="tabela">
      <tr><th>Beta</th><th>Leitura</th></tr>
      <tr><td>= 1</td><td>Move-se com o mercado; risco sistemático equivalente ao do mercado</td></tr>
      <tr><td>entre 0 e 1</td><td>Carrega <b>menos</b> risco sistemático que o mercado</td></tr>
      <tr><td>&gt; 1</td><td>Carrega <b>mais</b> risco sistemático; exigirá prêmio maior</td></tr>
      <tr><td>= −1</td><td>Move-se em direção contrária ao índice, em montante equivalente (raro)</td></tr>
    </table>
    <p>Fórmulas: <code>β = Cov(ativo; carteira) ÷ Var(carteira)</code> ou <code>β = (σ_ativo ÷ σ_carteira) × Corr(ativo; carteira)</code>. O beta de uma carteira é a <b>média ponderada</b> dos betas pelos pesos.</p>
    <div class="aviso"><b>Insights de Damodaran.</b> Betas maiores em: firmas mais <b>alavancadas financeiramente</b>; firmas com <b>custos fixos mais representativos</b> (alavancagem operacional); produtos mais específicos (luxo, alto preço); e empresas com grande perspectiva de crescimento.</div>
  `,

  nome: "CAPM e APT",

  colinha: `
    <div class="aviso">A fórmula que responde por quase tudo o que as bancas cobram:<br>
    <b>E(R<sub>i</sub>) = R<sub>f</sub> + [E(R<sub>M</sub>) − R<sub>f</sub>] × β<sub>i</sub></b><br>
    Retorno esperado do ativo = retorno do ativo sem risco, mais o prêmio de risco do mercado multiplicado pelo beta.</div>
    <p>O retorno de um ativo de capital depende de <b>três coisas</b>: a taxa livre de risco (remuneração por esperar seu dinheiro voltar sem correr risco); o <b>prêmio de risco</b> do mercado; e a <b>quantidade de risco sistemático</b> assumida, indicada pelo beta.</p>
    <h3>Exemplo típico de prova</h3>
    <p>β<sub>A</sub> = 1,4 e β<sub>B</sub> = 0,8; retorno do mercado 10%; taxa livre de risco 5%. Carteira com 75% de A e 25% de B:</p>
    <ul>
      <li>E(R<sub>A</sub>) = 5% + (10% − 5%) × 1,4 = <b>12%</b></li>
      <li>E(R<sub>B</sub>) = 5% + (10% − 5%) × 0,8 = <b>9%</b></li>
      <li>E(R<sub>carteira</sub>) = 12% × 75% + 9% × 25% = <b>11,25%</b></li>
    </ul>
    <h3>As premissas do CAPM</h3>
    <ul>
      <li>Investidores <b>racionais</b>, maximizadores de utilidade, preocupados apenas com retorno esperado e risco;</li>
      <li>Investidores em <b>grande número</b> e competitivos: nenhum deles sozinho provoca variação de preços;</li>
      <li>Investidores <b>avessos ao risco</b>, com o <b>mesmo horizonte de tempo</b>;</li>
      <li>Mesmo nível de <b>acesso à informação</b> sobre todos os ativos;</li>
      <li><b>Não existem custos de transação</b>;</li>
      <li><b>Expectativas homogêneas</b> sobre as oportunidades de investimento;</li>
      <li>Podem <b>emprestar e tomar emprestado montantes ilimitados</b> à taxa livre de risco;</li>
      <li>Podem <b>vender a descoberto</b> qualquer ativo e reter qualquer fração de uma ação.</li>
    </ul>
    <h3>Custo de oportunidade e taxa livre de risco</h3>
    <p>Custo de oportunidade não é qualquer coisa que se deixa de ganhar: é o <b>máximo</b> que se deixaria de ganhar no ativo alternativo <b>da mesma categoria de risco</b>. Quem aplica a 13% ao ano tem como custo de oportunidade o fundo de mesma classe de risco que daria 12,80%, não a poupança.</p>
    <p>No Brasil, a taxa livre de risco seria a paga por títulos públicos <b>pós-fixados</b>, porque têm cálculo diário e não oscilam significativamente. Prefixados de longo prazo oscilam muito com as mudanças de juros, e mais oscilação significa mais risco. A referência da economia é a <b>Selic</b> (ou o DI).</p>
    <h3>APT: Arbitrage Pricing Theory</h3>
    <p>Modelo de Stephen Ross (1976). Parte de <code>R = R̄ + U</code>: retorno médio esperado mais um componente de <b>surpresa</b>. Como <code>Notícia = parte esperada + surpresa</code>, e a parte esperada já está precificada, só a surpresa muda o preço justo. O inesperado se divide em <code>R = R̄ + m + ε</code>.</p>
    <p>Fórmula geral: <b>E(R<sub>i</sub>) = A<sub>i</sub> + β<sub>i1</sub>F<sub>1</sub> + β<sub>i2</sub>F<sub>2</sub> + β<sub>i3</sub>F<sub>3</sub> + … + ε<sub>i</sub></b>, com A<sub>i</sub> constante do ativo, F fatores sistemáticos, β a sensibilidade a cada fator e ε o choque idiossincrático de média zero.</p>
    <table class="tabela">
      <tr><th>Aspecto</th><th>CAPM</th><th>APT</th></tr>
      <tr><td>Objetivo</td><td colspan="2">Determinar o retorno esperado de um ativo (igual nos dois)</td></tr>
      <tr><td>Estrutura</td><td>Função linear apenas do prêmio de risco de mercado</td><td>Função linear de <b>vários fatores</b></td></tr>
      <tr><td>Betas</td><td><b>Um</b> beta</td><td>Um beta <b>por fator</b></td></tr>
      <tr><td>Risco idiossincrático</td><td>Não aparece na fórmula</td><td>Aparece como termo de erro; supõe ativos suficientes para diversificá-lo</td></tr>
      <tr><td>Equilíbrio</td><td colspan="2">Sem arbitragem, sem custos de transação, empréstimo ilimitado à taxa livre de risco (igual nos dois)</td></tr>
    </table>
    <p>Como os riscos específicos de empresas diferentes não guardam relação entre si, <code>corr(ε<sub>A</sub>, ε<sub>B</sub>) = 0</code>. É por isso que eles tendem a desaparecer numa carteira. Questões de APT costumam ser <b>teóricas</b>.</p>
  `,

  nome: "WACC e métodos de valuation",
  tag: "Custo do capital próprio, custo da dívida, benefício fiscal, FCFF e FCFE",
  colinha: `
    <p>O CAPM dá o custo do <b>capital próprio</b>. O WACC dá o custo de capital da <b>firma como um todo</b>, somando próprio e de terceiros. O objetivo final é achar uma <b>taxa de desconto</b> que represente o nível de risco daquele fluxo de caixa, de modo que descontá-lo por ela produza o <b>valor justo</b> do ativo.</p>
    <div class="aviso"><b>Tudo a valor de mercado.</b> Os pesos do capital próprio e da dívida devem ser calculados por <b>valores de mercado</b>, não pelo balanço. A lógica do WACC é buscar <b>novos financiamentos</b>: não adianta o patrimônio líquido contábil dizer R$ 15 por ação se o mercado paga R$ 10, nem a dívida estar registrada a 10% se o mercado secundário precifica 20%. Por isso se usa <b>Equity</b> (valor de mercado do capital próprio) e não "patrimônio líquido".</div>
    <h3>Custo do capital próprio</h3>
    <p>O método consagrado é o <b>CAPM</b>. Existe também o <b>DDM</b> (Discounted Dividend Model), útil na teoria:</p>
    <ul>
      <li>Sem crescimento: <code>VP = Div₁ ÷ Re</code>. Ação a R$ 30 pagando R$ 3 perpétuos implica <b>Re = 10%</b>.</li>
      <li>Com crescimento g (fórmula de Gordon): <code>VP = Div₀(1 + g) ÷ (Re − g)</code>. Ação a R$ 30, dividendo recém-pago de R$ 3 e g = 2%: Re = 3,06 ÷ 30 + 2% = <b>12,20%</b>.</li>
    </ul>
    <p>Na fórmula de Gordon o numerador é <b>sempre o dividendo do ano 1</b>.</p>
    <h3>Custo da dívida</h3>
    <p>Refere-se a <b>novas emissões</b>. Três caminhos, nesta ordem de preferência:</p>
    <ol>
      <li>A <b>YTM</b> (yield to maturity) dos papéis no mercado secundário: o retorno que um comprador ao preço atual obteria se a empresa pagasse integralmente nos prazos.</li>
      <li>O <b>rating</b>: taxa livre de risco mais o prêmio típico daquela classificação. Risk free a 4% e prêmio de 1,5% para AA resultam em 5,5%.</li>
      <li>Só se não houver nada disso, os custos históricos registrados no balanço, o que é bastante incomum na prática de mercado.</li>
    </ol>
    <h3>Benefício fiscal da dívida</h3>
    <p>Com LAJIR de R$ 1.000.000 e IR de 34%: sem dívida, lucro líquido de R$ 660.000; com R$ 200.000 de juros, lucro líquido de R$ 528.000. Pagaram-se R$ 200.000 de juros, mas o lucro caiu só R$ 132.000, porque se deixou de pagar <b>R$ 68.000</b> de imposto. Sobre uma dívida de R$ 2 milhões a 10%, o impacto real é de 6,6%:</p>
    <p><code>Impacto da dívida = (1 − IR) × Rd = (1 − 0,34) × 10% = 6,6%</code></p>
    <div class="aviso"><b>WACC = [E ÷ (D + E)] × Re + [D ÷ (D + E)] × Rd × (1 − IR)</b><br>
    Percentual de capital próprio a preços de mercado vezes seu custo, mais o percentual da dívida vezes o custo da dívida vezes (1 menos a alíquota do IR).</div>
    <h3>FCFF e FCFE</h3>
    <table class="tabela">
      <tr><th>Método</th><th>Fluxo</th><th>Taxa de desconto</th><th>Resultado</th></tr>
      <tr><td><b>FCFF</b> (free cash flow to the firm)</td><td>Fluxo <b>sem</b> descontar a dívida</td><td><b>WACC</b></td><td>Valor da firma</td></tr>
      <tr><td><b>FCFE</b> (free cash flow to equity)</td><td>Fluxo já líquido do serviço da dívida</td><td>Custo do capital próprio (R alavancado)</td><td>Valor do equity</td></tr>
    </table>
    <p>A lógica do FCFF: o fluxo livre gerado pela firma serve para remunerar <b>acionista e credor</b>, e o WACC incorpora os riscos das duas fontes, ponderados pela participação no capital.</p>
    <h3>Ajustes do fluxo de caixa incremental</h3>
    <ul>
      <li><b>Devolve-se</b> a depreciação, porque não é desembolso de caixa;</li>
      <li><b>Retira-se</b> o custo de oportunidade (ativos que já geravam renda) e a <b>canibalização</b> (perda que o novo produto causa no restante da linha);</li>
      <li><b>Retira-se</b> a variação de <b>capital de giro</b> operacional e o <b>CAPEX</b>, que não estão livres para distribuição;</li>
      <li><b>Soma-se</b>, no último ano, o <b>valor residual</b> do projeto.</li>
    </ul>
  `,

    <h3>Obrigação descontada pura (zero coupon bond)</h3>
    <p>Promete pagar o valor de face <b>apenas no vencimento</b>. A LTN funciona assim: paga-se hoje um valor menor que os R$ 1.000 e recebe-se o valor de face no vencimento.</p>
    <p><code>VP = Valor de Face ÷ (1 + i)ᵗ</code> &nbsp;&nbsp; e &nbsp;&nbsp; <code>i = (Valor de Face ÷ VP)^(1/t) − 1</code></p>
    <p>Exemplo real: Tesouro Prefixado 2019, em 22.03.2016, a R$ 706,42 (venda) e R$ 707,45 (compra), com 695 dias úteis e base 252. As taxas dão <b>13,37%</b> na compra e <b>13,43%</b> na venda. Esse pequeno <b>spread</b> é o ganho imediato de quem opera nas duas pontas.</p>
    <h3>Obrigação com cupons uniformes</h3>
    <p><code>VP = C/(1+i)¹ + C/(1+i)² + … + C/(1+i)ᵗ + VF/(1+i)ᵗ</code></p>
    <p>Não há fórmula analítica para extrair a <b>taxa</b> desse fluxo, só métodos numéricos. Mas há fórmula analítica para o <b>valor presente</b>:</p>
    <p><code>VP = C × [1/i − 1/(i × (1 + i)ᵗ)] + VF ÷ (1 + i)ᵗ</code></p>
    <p>Título de face 1.000, cupom de 6% ao ano por 12 anos, taxa de mercado de 12%: <b>VP = R$ 628,34</b>. Repare na lógica: cupom abaixo da taxa exigida faz o título valer <b>menos</b> que o par.</p>
    <div class="aviso">No Brasil, os títulos que pagam cupons costumam ser <b>indexados</b> (CDI ou inflação), de modo que o cupom varia e a fórmula acima não se aplica diretamente.</div>
    <h3>Perpetuidades</h3>
    <ul>
      <li>Fluxo perpétuo uniforme: <code>VP = Cupom (ou Dividendo do ano 1) ÷ i</code></li>
      <li>Fluxo perpétuo com crescimento g: <code>VP = Cupom (ou Dividendo do ano 1) ÷ (i − g)</code></li>

    <p>Companhia elétrica que distribui 100% do lucro, dividendo esperado de R$ 20 por ano e taxa de desconto de 20%: preço = 20 ÷ 0,2 = <b>R$ 100</b>. Com crescimento de 5% ao ano: 20 ÷ (0,20 − 0,05) = <b>R$ 133,33</b>.</p>
    <p>Existem <i>bonds</i> perpétuos de verdade. A Petrobras já lançou um <i>century bond</i>, com vencimento em 100 anos: não é perpétuo, mas o valor presente do principal pago ao final é praticamente irrisório.</p>
    <h3>A lógica da não arbitragem</h3>
    <p>Um título de 2 períodos com cupom pode ser <b>sintetizado</b> por uma carteira de dois zero-coupon. Com spot de 10% (1 ano) e 12% (2 anos), um título que paga cupom de R$ 100 e face de R$ 1.000 equivale a um papel de face R$ 100 em 1 ano (VP = R$ 90,91) mais outro de face R$ 1.100 em 2 anos (VP = R$ 876,91), totalizando <b>R$ 967,82</b>.</p>

  tag: "As três taxas e como se relacionam",
  colinha: `
    <table class="tabela">
      <tr><th>Taxa</th><th>Definição</th></tr>
      <tr><td><b>Spot (à vista)</b></td><td>Praticada no momento presente, para liquidação de um contrato financeiro. É a taxa de um zero-coupon para cada maturidade.</td></tr>
      <tr><td><b>YTM</b> (yield to maturity)</td><td>Taxa interna de retorno do título: o retorno obtido se ele for mantido até o vencimento. É a taxa que <b>aparece nos mercados</b> secundários de títulos privados, porque dimensiona tanto o risco de mercado quanto o do emissor.</td></tr>
      <tr><td><b>Forward (a termo)</b></td><td>Taxa implícita entre duas maturidades, calculada hoje a partir das spots.</td></tr>
    </table>
    <h3>A taxa forward</h3>
    <p>Quem investe R$ 1,00 por 1 ano a 10% tem R$ 1,10. Quem investe por 2 anos a 12% tem R$ 1,2544. Para que o primeiro alcance o segundo, precisa reinvestir a:</p>
    <p><code>1,2544 = 1,10 × (1 + f) → f = 14,036%</code></p>
    <p>Fórmulas gerais:</p>
    <p><code>f₂ = (1 + i₂)² ÷ (1 + i₁) − 1</code> &nbsp;&nbsp;e, em geral,&nbsp;&nbsp; <code>fₙ = (1 + iₙ)ⁿ ÷ (1 + iₙ₋₁)ⁿ⁻¹ − 1</code></p>
    <div class="aviso"><b>A forward não é a spot futura.</b> A taxa forward é calculada hoje, no ano zero, a partir das spots conhecidas. A taxa spot que efetivamente vigorará do ano 1 para o ano 2 depende de expectativas macroeconômicas, inflação, política monetária e risco país: pode ser 10% ou 16%. Não há garantia alguma de que coincidam.</div>
    <h3>Por que isso importa</h3>
    <p>Dois títulos com o mesmo valor presente de R$ 1.000: A vence em 1 ano a 10% (VF = R$ 1.100) e B vence em 2 anos a 12% (VF = R$ 1.254,40). Ao fim do ano 1, quem tem A recebe R$ 1.100 com certeza. Quanto vale B nesse momento? Depende da taxa de mercado para 1 período:</p>
    <ul>
      <li>Se a taxa for <b>10%</b>: B vale 1.254,40 ÷ 1,10 = <b>R$ 1.140,36</b>. Quem escolheu A precisaria desembolsar 1.140,36 para chegar ao mesmo lugar, ou seja, <b>perdeu</b>.</li>

  colinha: `
    <p>A <b>ETTJ</b> (estrutura temporal das taxas de juros), também chamada <b>yield curve</b> ou curva de empréstimo, é a curva que plota <b>rendimentos no eixo Y</b> e <b>tempo no eixo X</b>. Mostra a relação entre a taxa de juros e o tempo de maturação do título.</p>
    <div class="aviso">Só é possível construir a ETTJ <b>para determinado momento no tempo</b> e para títulos da <b>mesma classe de risco</b>. Misturar emissores de riscos distintos invalida a curva.</div>
    <h3>Para que serve</h3>
    <ul>
      <li>Calcular o valor de mercado de carteiras de títulos de <b>baixa liquidez</b> (nos de alta liquidez, o próprio mercado dá o preço);</li>
      <li>Investigar o retorno de carteiras de renda fixa;</li>
      <li><b>Apreçar</b> opções, swaps e contratos futuros;</li>
      <li>Verificar espaços de <b>arbitragem</b> entre instrumentos de renda fixa;</li>
      <li>Calcular <b>medidas de risco</b> associadas aos títulos e ao mercado de renda fixa.</li>
    </ul>
    <p>Em política monetária, a ETTJ carrega a expectativa dos agentes sobre os juros futuros do país. Ela fornece as taxas prefixadas de referência e impacta todos os demais mercados que trabalham com taxa pré, porque qualquer taxa de empréstimo deveria ser a taxa livre de risco mais um spread por risco de crédito.</p>
    <h3>Os perfis</h3>
    <p>A curva "padrão" traz a menor taxa no curtíssimo prazo e sobe <b>mais fortemente no início</b>, reduzindo a alta nas maturidades longas. Exemplo de prêmios: 1,344% do primeiro para o segundo ano, 0,805% do segundo para o terceiro, 0,507%, 0,336% e assim por diante.</p>
    <p>A explicação é intuitiva: o risco adicional de comprar um título de 3 anos em vez de um de 2 é <b>maior</b> que o risco adicional de comprar um de 10 anos em vez de um de 9. Por isso os prêmios diminuem.</p>
    <div class="aviso"><b>O que a inclinação revela.</b> Curva <b>positivamente inclinada</b> diz pouco sobre a expectativa de juros, porque o prêmio pela espera já é positivo por si só e bastaria para inclinar a curva, mesmo com leve perspectiva de queda. Já uma curva <b>descendente</b> é informativa: como os prêmios pela espera seriam negativos, pode-se afirmar que há <b>expectativa de queda de juros</b>.</div>
    <p>O Brasil viveu isso em março de 2016: a taxa de curtíssimo prazo estava entre 14,13% e 14,25%, o DI para 2017 em 13,74% e a LTN de 2019 pagando 13,36%. Juros curtos maiores que os longos.</p>
    <h3>Os quatro movimentos</h3>
    <table class="tabela">
      <tr><th>Movimento</th><th>O que acontece</th></tr>
      <tr><td><b>Bull flattening</b></td><td>Juros <b>caindo</b>; as taxas curtas caem <b>menos</b> que as longas. A curva fica mais <b>plana</b>.</td></tr>
      <tr><td><b>Bear flattening</b></td><td>Juros <b>subindo</b>; as taxas curtas sobem <b>mais</b> que as longas. A curva fica mais <b>plana</b>.</td></tr>
      <tr><td><b>Bull steepening</b></td><td>Juros <b>caindo</b>; as taxas curtas caem <b>mais</b> que as longas. A curva fica mais <b>íngreme</b>.</td></tr>
      <tr><td><b>Bear steepening</b></td><td>Juros <b>subindo</b>; as taxas curtas sobem <b>menos</b> que as longas. A curva fica mais <b>íngreme</b>.</td></tr>
    </table>
    <p>Decodificando os nomes: <b>bull</b> é queda de juros (bom para o mercado) e <b>bear</b> é alta de juros (ruim). <b>Flattening</b> é achatamento, <b>steepening</b> é aumento da inclinação. Sabendo isso, o resto se deduz.</p>
  `,

    {t:"mc", p:"Numa curva bem comportada e positivamente inclinada, as taxas forward, em relação às spots, serão:",

  colinha: `
    <h3>1. Hipótese das expectativas</h3>
    <p>Também chamada de expectativas <b>puras</b> ou <b>sem viés</b> (unbiased expectations). Afirma que:</p>
    <p><code>f₂ = taxa spot esperada para o ano 2</code></p>
    <p>Os investidores fixam a taxa forward com base nas suas crenças sobre a taxa à vista futura, de modo que a forward é <b>previsão não viesada</b> da spot futura.</p>
    <ul>
      <li><b>Consequência:</b> o retorno em determinada maturidade <b>independe do título comprado</b>. Tanto faz comprar um título de 3 anos e levar ao vencimento ou comprar um de 5 anos e vender aos 3. Atenção: isso é <b>expectativa</b>, não garantia de resultado.</li>
      <li><b>Premissa forte:</b> os investidores são <b>indiferentes ao risco</b>.</li>
      <li><b>Críticas:</b> a curva é, na maioria das vezes, positivamente inclinada, e essa hipótese aceitaria uma curva completamente <b>flat</b>; e existe <b>reversão à média</b> das taxas de juros, ao passo que a hipótese implicaria juros subindo em média.</li>
    </ul>
    <h3>2. Hipótese da preferência por liquidez</h3>
    <p>Corrige a premissa irrealista de indiferença ao risco. Para um investidor com horizonte de 1 ano, comprar um papel de 1 ano é menos arriscado que comprar um de 10 anos e vender no ano 1, porque qualquer mudança nas expectativas pode derrubar ou disparar o preço do papel longo.</p>
    <p>Para convencê-lo a alongar, é preciso oferecer taxa <b>maior</b> que a esperada:</p>
    <p><code>f₂ &gt; taxa spot esperada para o ano 2</code></p>
    <p>Mas atenção à simetria: para um investidor com horizonte de <b>2 anos</b>, o risco está em ficar curto e ter de reinvestir a taxas incertas. Num mercado dominado por investidores de <b>longo prazo</b>, seria preciso pagar mais no curto, e a relação se inverteria (<code>f₂ &lt; spot esperada</code>). Como a evidência empírica mostra que os investidores de <b>curto prazo são mais numerosos</b>, prevalece <code>f₂ &gt; spot esperada</code>.</p>
    <ul>
      <li>Existem <b>prêmios por liquidez</b> para compensar o risco de emprestar por mais tempo, e eles <b>aumentam com a maturidade</b>;</li>
      <li>A forward é estimativa da spot esperada, mas com <b>viés de alta</b> no montante do prêmio de liquidez;</li>
      <li>A hipótese pressupõe curva <b>positivamente inclinada</b>;</li>
      <li>"Liquidez" aqui não é vontade de converter em dinheiro rapidamente, e sim a capacidade de ter o retorno nas condições acertadas, no prazo desejado.</li>
    </ul>
    <h3>3. Teoria da segmentação</h3>
    <p>O mercado é segmentado por <b>maturidades</b>, cada uma negociada livremente. O descasamento entre taxas curtas e longas vem da <b>demanda maior pelos títulos de maturidade curta</b>: mais demanda, preço sobe, taxa cai.</p>
    <div class="aviso">Nesta teoria <b>não há prêmio</b> capaz de fazer um participante migrar de um mercado para outro: o prêmio de risco seria <b>infinito</b>. O mercado da maturidade 1 <b>não conversa</b> com o da maturidade 2; cada um forma seu preço isoladamente, como se fossem mercados apartados.</div>
    <h3>4. Teoria do habitat preferido</h3>
    <p>Os agentes têm <b>preferências temporais</b> diferentes, conforme a estrutura dos seus ativos e passivos. Quem tem desembolsos de longo prazo monta ativos de longo prazo. O descasamento tem custo e risco, então o agente só sai do seu <b>habitat natural</b> se houver um <b>prêmio</b> por esse descasamento.</p>
    <p>Na prática, essa teoria <b>relaxa</b> a condição de prêmio infinito da segmentação. Se o mercado da maturidade 2 passar a precificar 15% enquanto o da maturidade 1 precifica 12%, os agentes <b>migram</b>. A segmentação não aceita essa migração; o habitat preferido aceita.</p>
  `,

    <h3>Covariância</h3>
    <p>Mede o <b>grau de inter-relação entre duas variáveis</b>. Se forem completamente aleatórias, sem relação entre si, a covariância deveria ser zero ou muito próxima disso.</p>
    <p>Fórmula geral, com probabilidades: <code>cov(x,y) = Σ (xᵢ − x̄)(yᵢ − ȳ) p(x,y)</code></p>
    <p>Quando não há probabilidades distintas: <code>cov(x,y) = (1/n)[Σ xᵢyᵢ] − (1/n)[Σ xᵢ][Σ yᵢ]</code>. Notação comum: <b>σ<sub>xy</sub></b>.</p>
    <p>No exemplo da carteira renda fixa e ações, a covariância dá <b>−0,015625</b>. O sinal negativo significa que, quando uma observação está acima da sua média, a outra tende a estar abaixo da dela.</p>
    <h3>Correlação</h3>
    <p><code>corr(x,y) = ρ<sub>xy</sub> = cov(x,y) ÷ (σ<sub>x</sub> σ<sub>y</sub>)</code></p>
    <p>No mesmo exemplo: −0,015625 ÷ (7,79% × 20,3%) = <b>−0,987</b>.</p>
    <table class="tabela">
      <tr><th>Correlação</th><th>Leitura</th></tr>
      <tr><td><b>1</b></td><td>As variáveis se movem praticamente juntas, em magnitudes proporcionais</td></tr>
      <tr><td><b>−1</b></td><td>Movem-se sempre em sentido contrário</td></tr>
      <tr><td><b>0</b></td><td>Não há evidência de relação (aleatórias)</td></tr>
      <tr><td>acima de 0,7 ou abaixo de −0,7</td><td>Consideradas <b>fortes</b></td></tr>
    </table>
    <p>O intervalo vai <b>sempre</b> de −1 a 1, ao contrário do beta.</p>
    <h3>Desvio-padrão do portfólio</h3>
    <p><code>Var(portfólio) = w<sub>x</sub>²σ<sub>x</sub>² + w<sub>y</sub>²σ<sub>y</sub>² + 2w<sub>x</sub>w<sub>y</sub>σ<sub>xy</sub></code></p>
    <p>Ou, usando correlação em vez de covariância:</p>
    <p><code>Var(portfólio) = w<sub>x</sub>²σ<sub>x</sub>² + w<sub>y</sub>²σ<sub>y</sub>² + 2w<sub>x</sub>w<sub>y</sub> ρ<sub>xy</sub> σ<sub>x</sub>σ<sub>y</sub></code></p>

    <h3>O conjunto de portfólios possíveis</h3>
    <p>Combinando dois ativos em várias proporções, obtém-se um conjunto de pares risco e retorno. Num mundo só com esses dois ativos, <b>não é possível encontrar portfólios fora da curva</b>: não existiria combinação que desse 7,5% de retorno com 4% de risco, nem portfólio terrível com 5% de retorno e 20% de risco.</p>
    <p>Mas há trechos da curva onde <b>nenhum investidor racional ficaria</b>. Para um mesmo risco de 4%, existem duas combinações: uma rendendo cerca de 6,65% e outra rendendo quase 7%. Ninguém escolheria a de retorno menor para o mesmo risco. Isso deriva da <b>hipótese dos mercados eficientes</b>.</p>
    <div class="aviso">A <b>fronteira eficiente</b> vai do ponto de <b>mínima variância (MV)</b> até o ativo puro de maior risco e maior retorno possível. Tudo abaixo dela é dominado.</div>
    <h3>Com vários ativos</h3>
    <p>Com muitos ativos, as combinações preenchem uma <b>área fechada</b>. Não é possível montar carteiras fora dessa área: um portfólio "bom demais" (mais retorno e menos risco que a fronteira) e um "ruim demais" simplesmente não existem. Apenas o interior e a borda são construíveis, e só a borda superior é eficiente.</p>
    <h3>Introduzindo o ativo livre de risco</h3>
    <p>Traça-se uma reta do ponto R<sub>f</sub> (desvio zero) tangenciando a fronteira eficiente. O ponto de tangência é a <b>carteira eficiente</b> ou <b>optimal portfolio</b> (carteira A).</p>
    <ul>
      <li>Quem quer <b>menos risco</b> combina a carteira A com o ativo livre de risco (por exemplo, 50% e 50%);</li>
      <li>Quem quer <b>mais risco</b> opera alavancado: −50% no ativo livre de risco e 150% na carteira A;</li>
      <li>Ninguém escolheria um ponto abaixo dessa reta, porque teria quase o mesmo risco com retorno muito menor.</li>
    </ul>
    <h3>O princípio da separação</h3>
    <p>A decisão do investidor se dá em <b>dois passos independentes</b>:</p>
    <ol>
      <li>Estimar retornos, variâncias e covariâncias, calcular a fronteira eficiente e determinar a <b>carteira A</b> tomando por base o retorno do ativo sem risco. Nesse passo, a aversão ou apetite ao risco do investidor <b>é irrelevante</b>.</li>
      <li>Só então definir a <b>combinação</b> entre a carteira eficiente e o ativo sem risco, conforme a tolerância ao risco.</li>
    </ol>
    <h3>Expectativas homogêneas e portfólio de mercado</h3>
    <p>É razoável assumir que os investidores têm as <b>mesmas crenças</b> sobre retornos, variâncias e covariâncias, ainda que <b>não</b> tenham a mesma tolerância ao risco. Essa é a <b>hipótese das expectativas homogêneas</b>.</p>
    <p>Consequência: todos identificarão a <b>mesma carteira A</b> como o melhor portfólio de ativos de risco. Se todos a adotam, ela <b>é</b> o portfólio de mercado, formado por todos os ativos ponderados por seu valor de mercado. Na prática, esse portfólio é sintetizado por índices amplos, como o S&P 500.</p>

    <p>Falar de duração e convexidade é falar de <b>risco de taxa de juros</b> para um instrumento de renda fixa ou para uma carteira.</p>
    <h3>Intuição básica</h3>
    <p>Título de face R$ 1.000 com cupom de 6% ao ano por 20 anos, vendido no lançamento a YTM de 5,88%: o preço é <b>R$ 1.013,90</b>. Se a YTM fosse exatamente 6%, o preço seria exatamente R$ 1.000. Como se pagou <b>mais</b> que o par, a taxa interna obtida é <b>menor</b> que o cupom.</p>

    </table>
    <p>O título mais longo é muito mais sensível. E um portfólio com os dois tem volatilidade <b>maior que a do curto e menor que a do longo</b>.</p>
    <h3>As quatro características da volatilidade</h3>
    <ol>
      <li>Todos os títulos têm variação <b>oposta</b> entre taxa e preço (juros sobe, preço cai), mas essas variações <b>não são iguais</b>: quando a taxa cai, o título sobe mais, percentualmente, do que cai quando a taxa sobe.</li>

      <li>Para <b>grandes</b> mudanças, a variação do preço é bem maior e depende da direção.</li>
      <li>Para uma mesma variação grande no retorno exigido, a variação <b>positiva</b> do preço é <b>maior</b> que a negativa.</li>

  colinha: `
    <h3>Duração de Macaulay</h3>
    <p>É a <b>média ponderada do tempo de recebimento dos fluxos de caixa, pelos valores presentes desses mesmos fluxos</b>.</p>
    <p><code>D = [Σ (F<sub>t</sub> × t) ÷ (1+i)ᵗ] ÷ [Σ F<sub>t</sub> ÷ (1+i)ᵗ]</code></p>
    <p>Exemplo: 10 títulos de face R$ 1.000, cupom 6%, 5 anos, taxa 10%. Valor presente total R$ 8.484; somatório ponderado R$ 37.438. Duração = 37.438 ÷ 8.484 = <b>4,41 anos</b>.</p>
    <div class="aviso">Um título que só tem <b>um pagamento</b> no futuro tem duração <b>idêntica ao período</b> em que esse pagamento ocorre. Zero cupom de 5 anos tem duração 5,00.</div>
    <p>Relação com a taxa: o efeito é <b>inversamente proporcional</b>. Taxa sobe, duração cai; taxa cai, duração sobe.</p>
    <h3>A fórmula de sensibilidade</h3>
    <p><code>ΔV ÷ V = −D × Δi ÷ (1 + i)</code></p>
    <p>Carteira de R$ 8.484, duração 4,41, taxa 10%. Para uma queda de 0,1%: ΔV = +34,03, novo valor previsto R$ 8.517,72. O valor real calculado é R$ 8.517,81, praticamente idêntico. Para uma alta de 2%: previsto R$ 7.803,00 contra real R$ 7.837,13, já bem distante.</p>
    <p>A previsão é uma <b>reta tangente</b> à curva real, e só vale bem no entorno daquele ponto.</p>
    <h3>Duração modificada</h3>
    <p><code>DM = D ÷ (1 + i)</code></p>
    <p>No exemplo: 4,4129 ÷ 1,10 = <b>4,0117</b>. Interpretação: para cada <b>1%</b> de variação na taxa, há cerca de 4,01% de variação em <b>sentido inverso</b> no valor do título.</p>
    <p><code>Variação % no preço = −DM × Δi × 100</code></p>
    <h3>Duração modificada aproximada</h3>

  colinha: `
    <p>A variação das taxas afeta o valor da carteira de forma <b>não linear</b>. A duração aproxima razoavelmente essa relação para deslocamentos pequenos, mas, para deslocamentos grandes, as variações positivas no valor são <b>maiores</b> que as negativas.</p>
    <div class="aviso"><b>Para que serve a convexidade:</b> medir a variação no preço que <b>não é explicada pela duração</b>. A duração é a primeira aproximação; a convexidade é a segunda.</div>
    <h3>Fórmula</h3>
    <p><code>C(i) = [1 ÷ (1 + i)²] × Σ w<sub>t</sub> × (t² + t)</code></p>
    <p>Onde w<sub>t</sub> é o peso do valor presente de cada período no valor presente total. Versão equivalente, com o VP explícito:</p>
    <p><code>C(i) = [1 ÷ (VP × (1 + i)²)] × Σ [F<sub>t</sub> ÷ (1 + i)ᵗ] × (t² + t)</code></p>
    <p>No exemplo da carteira de duração 4,4129 e taxa 10%: Σ w(t² + t) = 25,36, e dividindo por (1,1)² chega-se a <b>C = 20,9566</b>.</p>
    <p>Detalhe do cálculo: a coluna (t² + t) para o ano 2 dá 2² + 2 = 6; para o ano 5, 5² + 5 = 30. O peso do ano 5 é 77,58%, porque é ali que se concentram o último cupom e o principal.</p>
    <h3>O que a convexidade significa matematicamente</h3>
    <p>Ela é a <b>derivada segunda</b> do valor da carteira em função da taxa, e a <b>derivada da duração</b> em função da taxa. Ou seja: a convexidade indica <b>como a duração muda</b> conforme a taxa se move. Antes tratávamos D como um número fixo; agora temos uma função que descreve a variação de D.</p>
    <h3>As fórmulas de estimativa</h3>
    <p>Com duração de Macaulay:</p>
    <p><code>ΔV ÷ V = −D × Δi ÷ (1 + i) + ½ × C × (Δi)²</code></p>
    <p>Com duração modificada (a mais usada em certificações):</p>
    <p><code>ΔV ÷ V = −DM × Δi + ½ × C × (Δi)²</code></p>
    <p>Repare que o termo de convexidade tem <b>(Δi)²</b>, sempre positivo, e é <b>somado</b>. Por isso a convexidade sempre <b>adiciona</b> valor à estimativa, corrigindo a subestimação sistemática da duração isolada.</p>
    <h3>A diferença de precisão</h3>
    <table class="tabela">

      <tr><td>+5,00%</td><td>−2,8691%</td><td>(erro também cai drasticamente)</td></tr>
    </table>
    <p>Com a duração isolada, o erro é <b>sempre negativo</b>: a fórmula calcula valores <b>menores</b> que os reais. Adicionando a convexidade, o erro cai de ordens de grandeza. Graficamente, a curva real é <b>convexa</b> e a curva aproximada apenas pela duração é uma <b>reta</b>.</p>
  `,

    <h3>O problema do reinvestimento</h3>
    <p>Comprar um título com cupons pela YTM de 10% e levá-lo até a maturidade <b>não garante</b> retorno de 10%. Só garantiria se os <b>cupons pudessem ser reinvestidos à mesma taxa</b>.</p>
    <p>Exemplo: 10 títulos de face R$ 1.000, cupom 6%, 5 anos, comprados por R$ 8.483,69 a 10%. Reinvestindo tudo a 10%, o valor futuro é R$ 13.663,06, exatamente igual a R$ 8.483,69 capitalizados a 10% por 5 anos. Mas se os cupons só puderem ser reinvestidos a 9%, 8%, 6% e 5%, o valor futuro cai para R$ 13.506,94 e a taxa efetiva vira <b>9,7475%</b>.</p>
    <div class="aviso">Essa é a característica menos discutida da <b>TIR</b>: ela pressupõe a capacidade de reinvestir os fluxos à mesma taxa inicial. É por isso que o <b>maturity hedge</b>, simplesmente casar o vencimento do título com o do compromisso, <b>não funciona</b>.</div>
    <h3>Imunização e duration hedge</h3>
    <p>As três condições para imunização total:</p>
    <ol>
      <li><b>Duração do ativo = Duração do passivo</b></li>
      <li><b>Valor presente do ativo ≥ Valor presente do passivo</b></li>
      <li><b>Dispersão do ativo = Dispersão do passivo</b></li>
    </ol>
    <p>Caso prático: dívida de R$ 1 milhão vencendo em 4 anos a 14% ao ano, ou seja, R$ 1.688.960 a pagar. Compra-se um título de cupom 12%, 5 anos, cotado a R$ 931,34 a 14%, com duração de <b>4,00</b>. Quantidade: 1.000.000 ÷ 931,34 = <b>1.073,72 títulos</b>.</p>
    <p>Ao fim do ano 4, somando os cupons reinvestidos (R$ 470,54), o cupom do ano (R$ 120,00) e o valor de mercado do título (R$ 982,46), tem-se R$ 1.572,99 por título, que multiplicados pelos 1.073,72 títulos dão exatamente <b>R$ 1.688.960</b>.</p>
    <p>Mas a mágica não está em taxas constantes. Está na <b>proteção contra a variação</b>:</p>
    <table class="tabela">

      <tr><td>25%</td><td>1.704.939</td><td>+0,95%</td></tr>
    </table>
    <p>Mesmo com a taxa indo de 14% para 5% ou para 25%, a diferença fica <b>abaixo de 1%</b>. Compare com o descasamento: no ano 5, a 25%, o valor seria R$ 2.131.174, muito acima dos R$ 1.688.960 necessários, por força do reinvestimento a taxas altas. No ano 3, a 5%, seria R$ 1.619.668, insuficiente.</p>
    <p>Por que fundos conseguem casar taxas de ativo e passivo? Porque não são bancos: fundos de pensão existem justamente para investir o dinheiro dos participantes e fazer pagamentos com base nessa rentabilidade, então as taxas de ativo e passivo <b>são naturalmente próximas</b>.</p>
    <h3>Custos de transação</h3>
    <p>São despesas incorridas na compra ou venda de um bem ou serviço. No sentido financeiro, incluem <b>comissões e spreads</b> dos intermediários.</p>
    <ul>
      <li>São <b>pontuais</b>: só ocorrem quando há compra ou venda. Já as <b>taxas contínuas</b> (administração de fundos, por exemplo) são cobradas periodicamente ao longo da vida do produto;</li>
      <li>Costumam ser negligenciados por investidores e pela teoria, mas afetam o ganho líquido;</li>
      <li>Diferentes classes de ativos têm faixas diferentes, e a recomendação é selecionar classes com custos no <b>limite inferior</b> da faixa;</li>
      <li>Podem ser minimizados <b>agregando negociações</b> ou adotando estratégia <b>menos ativa</b>.</li>
    </ul>
    <p>Impostos: <b>IOF</b> e <b>IR</b> incidem <b>sobre o rendimento</b>, nunca sobre o capital investido. Sem rendimento, não há cobrança. O IOF segue tabela regressiva de <b>96% a 3%</b> para resgates em menos de 30 dias, zerando a partir do 30º dia. Taxas do mercado: administração, custódia, corretagem, emolumentos, comissões e carregamento.</p>
    <h3>Coase e a teoria econômica dos custos de transação</h3>
    <p><b>Ronald Coase</b>, em <b>1937</b>, introduziu formalmente o conceito para explicar <b>a existência das empresas</b>: elas existiriam para <b>reduzir</b> esses custos. Transacionar pelo mercado exige descobrir com quem negociar, barganhar, redigir contrato e fiscalizar o cumprimento. Os três custos são:</p>

    </table>

  nome: "VaR: conceito e métodos",
  tag: "O que é, como se enuncia e as três formas de calcular",
  colinha: `
    <div class="aviso">O <b>VaR</b> mede quanto um investimento ou portfólio pode perder de valor, <b>no máximo</b>, em determinado <b>período</b>, dadas <b>condições normais de risco de mercado</b>.</div>
    <p>O VaR deve estar <b>sempre</b> associado a três elementos: um <b>montante em moeda</b> (ou percentual), um <b>período</b> e uma <b>probabilidade</b>.</p>
    <p>Exemplo: "o VaR desta carteira, para o período de 1 dia e com 99% de confiança, é de R$ 1 milhão". Leitura: a perda de R$ 1 milhão de um dia para o outro deverá acontecer em apenas <b>1 de cada 100 dias</b>.</p>
    <p>Outro exemplo: VaR diário de 4% ao nível de confiança de 95% significa haver 95% de confiança de que não haverá perda superior a 4% num único dia.</p>
    <p>Matematicamente, o VaR é o (pior) retorno da carteira no <b>percentil</b> identificado pelo intervalo de confiança.</p>
    <h3>Cuidados do modelo</h3>
    <ul>
      <li>Normalmente se <b>expurgam outliers</b> (dados muito discrepantes), porque o VaR é estimado para condições <b>normais</b> de mercado, não para crises;</li>
      <li>Para ativos <b>ilíquidos</b>, deve-se escolher intervalos <b>mais longos</b>;</li>
      <li>Recomenda-se o uso constante de <b>backtesting</b>: testar as previsões do modelo contra o que efetivamente aconteceu e ajustar o modelo se as previsões não estiverem compatíveis com a volatilidade real.</li>
    </ul>
    <p>É também usado para estimar o nível máximo de exposição que uma instituição financeira pode assumir e qual patrimônio de referência precisará manter para não ficar insolvente.</p>
    <h3>Os três métodos</h3>
    <table class="tabela">
      <tr><th>Método</th><th>Classificação</th><th>Como funciona</th></tr>
      <tr><td><b>Histórico</b></td><td>Não paramétrico</td><td>Reorganiza os retornos históricos e infere sobre o futuro com base na frequência acumulada</td></tr>
      <tr><td><b>Variância e covariância</b> (distribuição normal)</td><td><b>Paramétrico</b></td><td>Assume que a distribuição dos retornos é aproximadamente normal e usa as estatísticas dessa distribuição</td></tr>
      <tr><td><b>Simulação de Monte Carlo</b></td><td>Não paramétrico</td><td>Gera um grande volume de previsões por computador, a partir de restrições baseadas em históricos, correlações e covariâncias, e analisa os piores resultados</td></tr>
    </table>
    <p>A régua da classificação é simples: <b>paramétrico</b> é o método que faz <b>alguma inferência sobre a distribuição de probabilidades</b> dos retornos. Os não paramétricos não assumem distribuição específica.</p>
    <h3>VaR histórico na prática</h3>
    <p>Com 1.356 observações de retorno diário, média de 1,06% e desvio de 3,17%, a frequência acumulada mostra que apenas em 0,96% das vezes o retorno foi inferior a −7%. Logo, com <b>99% de confiança</b>, a perda diária não será superior a <b>7%</b>. Sobre R$ 1 milhão investidos, R$ 70.000.</p>
    <h3>Monte Carlo na prática</h3>
    <p>Define-se média e desvio dos retornos, e o software gera retornos aleatórios compatíveis com essa distribuição (no Excel, a função inversa da normal combinada com um gerador aleatório). Com 100 simulações, busca-se o retorno no <b>percentil de 5%</b> (para 95% de confiança) ou de 1% (para 99%). Os resultados ficam próximos dos demais métodos: cerca de −4,0% e −6,1% no exemplo.</p>

/* ---- 5.3 */
{
  nome: "Calculando o VaR",
  tag: "Fórmula paramétrica, z de 1,65 e 2,33 e ajuste de período",
  colinha: `
    <h3>A fórmula paramétrica</h3>
    <p><code>Retorno = Média − Φ⁻¹(α) × σ</code></p>
    <p>Onde α é o intervalo de confiança e <b>Φ⁻¹</b> é o inverso da função de distribuição normal cumulativa, que informa <b>quantos desvios-padrão</b> aquele intervalo se afasta da média.</p>
    <div class="aviso"><b>Decore os dois valores:</b> Φ⁻¹(95%) = <b>1,65</b> e Φ⁻¹(99%) = <b>2,33</b>. (No Excel, com mais casas: 1,6448.)</div>
    <p>Entendendo a notação: Φ(1,65) = 95% significa que 95% dos eventos ocorrem abaixo de 1,65 desvios acima da média. Φ(−1,65) = 5% significa que 5% dos eventos ocorrem abaixo de 1,65 desvios <b>abaixo</b> da média. A função inversa devolve o contrário: dada a probabilidade, ela dá o número de desvios.</p>
    <h3>Aplicando</h3>
    <p>Média de 1,06% e desvio de 3,17%:</p>
    <ul>
      <li>95%: 1,06% − 1,65 × 3,17% = <b>−4,17%</b></li>
      <li>99%: 1,06% − 2,33 × 3,17% = <b>−6,32%</b></li>
    </ul>
    <p>Comparando com o VaR <b>histórico</b> da mesma base: −5% a 95% e −7% a 99%. Valores próximos, obtidos por caminhos diferentes.</p>
    <p>Muitos livros apresentam a conta <b>sem a média</b>, porque assumem média zero ou muito próxima de zero.</p>
    <div class="aviso"><b>Cuidado com o sinal.</b> Existe a forma alternativa <code>Retorno = Média + Φ⁻¹(1 − α) × σ</code>. O que define o sinal é como se chama o alpha. Se o exercício disser alpha = 5%, a configuração muda. A verificação é sempre a mesma: a perda apontada pelo VaR tem de ser <b>menor que a média</b>.</div>
    <h3>Ajuste para outros períodos</h3>
    <p><code>σ<sub>mês</sub> ≅ σ<sub>diário</sub> × √N</code></p>
    <p>Com 21 dias úteis no mês e σ diário de 3,17%: 3,17% × √21 = <b>14,53%</b>. Assumindo que a média não muda:</p>
    <ul>
      <li>95%: 1,06% − 1,65 × 14,53% = <b>−22,91%</b></li>
      <li>99%: 1,06% − 2,33 × 14,53% = <b>−32,79%</b></li>
    </ul>
    <p>Como a conversão é uma aproximação, há erro embutido, estimado por:</p>
    <p><code>Erro = σ<sub>mensal</sub> ÷ √(2N)</code></p>
    <p>No exemplo: 14,53% ÷ √42 = <b>2,24%</b>.</p>
    <p>Vale registrar a advertência do material: em questões <b>numéricas</b>, as bancas não costumam ir além do que foi apresentado aqui. Elas puxam muito mais na <b>teoria</b>.</p>
  `,

  colinha: `
    <p><b>Derivativo</b> é um instrumento financeiro (ativo ou passivo) cujo <b>preço de mercado deriva</b> do preço de mercado de outro bem ou instrumento financeiro <b>subjacente</b>. São, na verdade, contratos com cláusulas bem específicas, às vezes padronizadas, que indicam como o instrumento deverá se comportar.</p>
    <div class="aviso">Dois pontos que o material faz questão de marcar:<br>
    <b>1.</b> Derivativos <b>não causam</b> o movimento dos preços. Seus preços são <b>efeito</b> das variações dos ativos a que fazem referência, moduladas por prazo, taxas de juros e volatilidade.<br>
    <b>2.</b> São, em essência, <b>trocas de direitos sobre bens</b> sem que os bens necessariamente se movam. Os direitos sobre uma ação podem ser trocados milhares de vezes sem que ela saia das mãos do detentor original.</div>
    <p>O ativo subjacente deve preferencialmente ter <b>mercado ativo</b>, para que seu preço não seja manipulável. Ações muito negociadas são adequadas para lançamento de opções; ativos que negociam poucos milhares de reais por dia são sujeitos a manipulação, e uma alta pequena no subjacente pode disparar o valor das opções.</p>
    <h3>Os quatro mercados</h3>
    <table class="tabela">
      <tr><th>Mercado</th><th>Conteúdo</th></tr>
      <tr><td><b>A termo</b></td><td>Compra ou venda de quantidade determinada de um ativo, a preço predefinido, para liquidação em prazo futuro. Liquidado <b>integralmente no vencimento</b> (há exceções). Pode ser em bolsa ou balcão.</td></tr>
      <tr><td><b>Futuro</b></td><td>Evolução do termo. Mesma promessa, mas com <b>ajuste diário</b> e negociação <b>somente em bolsas</b>.</td></tr>
      <tr><td><b>Opções</b></td><td>Negociam-se <b>direitos</b>: comprar ou vender um bem por preço fixo em data futura. Quem compra o direito paga um <b>prêmio</b>.</td></tr>
      <tr><td><b>Swap</b></td><td>Troca de rentabilidade (risco) entre dois bens. Compara-se a evolução das duas variáveis sobre uma base de cálculo. Liquidação <b>integral no vencimento</b>, muito semelhante ao termo.</td></tr>
    </table>
    <p>Características do <b>futuro</b>: padronização, elevada liquidez, negociação transparente em pregão, possibilidade de encerrar a posição com qualquer outro participante a qualquer momento, e proteção pelo mecanismo de <b>margens de garantia</b>. Desvantagens: custo elevado por exigir movimentação financeira expressiva nos ajustes diários, custos operacionais maiores que os do termo e necessidade de depósito de garantias (custo de oportunidade).</p>
    <p>Exemplo de swap: <b>DI x Dólar</b>, que troca risco cambial por risco de taxa prefixada. Ou <b>Ouro x Pré</b>: se a valorização do ouro ficar abaixo da taxa prefixada, recebe a diferença quem comprou pré e vendeu ouro.</p>
    <h3>Bolsa e balcão</h3>
    <p>Contratos de <b>balcão</b> (OTC) são negociados entre as partes e tendem a ser <b>customizados</b>. Por isso não conseguem liquidez: interessam apenas aos originadores. Contratos <b>padronizados</b> podem ser negociados em bolsa, atendem a milhares de investidores, dispensam conhecer a contraparte e permitem fechar a posição por operação inversa.</p>
    <div class="aviso">O <b>diferencial mais importante</b> entre os dois ambientes é a existência da <b>câmara de compensação</b> que, ao se interpor entre os negociantes, reduz o risco de inadimplência. Em balcão, o risco de uma parte falhar é <b>das partes</b>.</div>
    <h3>A B3</h3>
    <p>A <b>Câmara B3</b> realiza aceitação, compensação, liquidação e administração de risco de contraparte. Para isso ela: assume a posição de <b>contraparte central</b> na liquidação, exclusivamente perante os <b>membros de compensação</b>; dispõe de salvaguardas e instrumentos de controle de risco; e realiza as atividades necessárias ao cumprimento das obrigações assumidas.</p>
    <p>Aceita operações nos mercados à vista de renda variável, à vista de renda fixa privada, de derivativos de renda variável (listados e de balcão), de empréstimo de ativos, de derivativos financeiros e de commodities (listados e de balcão) e à vista de ouro.</p>
    <p>Os derivativos mais comuns na B3 dividem-se em <b>agropecuários</b> (café, boi, milho, soja), <b>financeiros</b> (juros, inflação, câmbio, índices de ações) e <b>de energia e climáticos</b> (energia elétrica, gás natural, créditos de carbono).</p>
    <p>O acesso aos pregões eletrônicos se dá pelo modelo <b>DMA</b> (acesso direto ao mercado), que admite variantes como os home brokers.</p>
  `,

      <tr><td><b>Alavancagem</b></td><td>A negociação com derivativos exige <b>menos capital</b> que a compra do ativo à vista. Uma ação a R$ 40 pode ter opção de compra a R$ 0,20; se a ação sobe para R$ 42, a opção pode ir a R$ 2,00, um ganho de 900%. O risco é simétrico: se a ação cair a R$ 39,80, o detentor do papel quase nada perde, mas o titular da opção perde <b>tudo</b>.</td></tr>
      <tr><td><b>Especulação</b></td><td>Tomar posição no mercado futuro ou de opções <b>sem posição correspondente</b> no mercado à vista. Operar a descoberto, apostando na tendência.</td></tr>
      <tr><td><b>Arbitragem</b></td><td>Aproveitar a diferença de preços de um mesmo ativo negociado em <b>mercados diferentes</b>. É bastante raro, porque os mercados têm muita liquidez e há robôs operando.</td></tr>
    </table>
    <h3>Os participantes</h3>
    <table class="tabela">
      <tr><th>Agente</th><th>Objetivo</th><th>Assume risco?</th></tr>
      <tr><td><b>Hedger</b></td><td>Proteger-se da oscilação de preços; garantir o preço de compra ou venda em data futura. Pode buscar proteção contra um <b>passivo</b> que detém.</td><td>Reduz o risco que já tinha</td></tr>
      <tr><td><b>Arbitrador</b></td><td>Lucro <b>sem assumir risco</b>: compra onde está barato e vende onde está caro, sabendo exatamente por quanto fará as duas pontas.</td><td><b>Não</b></td></tr>
      <tr><td><b>Especulador</b></td><td>Lucro na oscilação de preços, sem interesse pelo ativo-objeto e sem posição física a proteger.</td><td><b>Sim</b></td></tr>
    </table>
    <div class="aviso">O <b>especulador</b> é o principal <b>fornecedor de liquidez</b> para o hedger. Operando muito, ele ajuda a formar preço e evita que o hedger pague caro demais pela proteção. Ele é <b>fundamental</b> para o mercado. Já o <b>arbitrador</b>, embora raro, é quem aproxima o mercado das características de eficiência, fechando rapidamente qualquer oportunidade de ganho sem risco.</div>
    <h3>Posições</h3>
    <p><b>Posição</b> é o saldo líquido dos contratos negociados pelo mesmo contratante para a <b>mesma data de vencimento</b>. Abre-se posição ao assumir uma posição comprada ou vendida num vencimento que antes não se possuía.</p>
    <ul>
      <li><b>Long (comprado)</b>: número de contratos comprados maior que o de vendidos;</li>
      <li><b>Short (vendido)</b>: número de contratos vendidos maior que o de comprados;</li>
      <li><b>Contratos em aberto</b>: refletem a posição líquida de todas as operações ainda não liquidadas, por contrato e vencimento.</li>
    </ul>
    <p>A posição líquida é sempre fixada para <b>um único vencimento</b> do mesmo contrato.</p>
    <h3>Liquidação</h3>
    <table class="tabela">

    <p>Em posições especulativas a liquidação física pode ser muito dispendiosa ou indesejável. O caso extremo foi o petróleo fechando a <b>menos 40 dólares</b> durante a covid: os especuladores não tinham onde armazenar milhões de barris e preferiam pagar para que alguém recebesse o petróleo em seu lugar.</p>
    <h3>Intercambialidade</h3>
    <p>Também chamada de <b>repasse dos negócios</b>: um participante encerra sua posição repassando o compromisso a outro participante. Só é possível em contratos <b>padronizados e negociados em bolsa</b>, por serem líquidos e atenderem às necessidades de todos. Contratos de <b>balcão</b>, cujas especificações são feitas sob medida entre as partes, <b>não são intercambiáveis</b>.</p>
  `,

    <h3>Contrato a termo</h3>
    <p>Compra ou venda de quantidade determinada de um ativo, a preço predefinido, para liquidação em prazo futuro. O compromisso é assumido na <b>própria data de realização do negócio</b>, com liquidação em data futura.</p>
    <p>Costuma ser liquidado <b>integralmente no vencimento</b>, com exceções. Pode ser negociado em <b>bolsa ou balcão</b>. Não sendo padronizado, tem baixa liquidez, e quem entra tende a carregar até o fim.</p>
    <h3>Contrato futuro</h3>
    <p>Evolução do termo. O mesmo compromisso de comprar ou vender em data futura por preço estipulado, mas com duas diferenças decisivas:</p>
    <ul>
      <li><b>Ajuste diário</b>: as alterações de preço são verificadas diariamente para apuração de perdas e ganhos, e a diferença do dia é liquidada;</li>
      <li>Negociação <b>somente em bolsas</b>, porque são contratos padronizados.</li>
    </ul>
    <p>Vantagens: padronização, elevada liquidez, negociação transparente em pregão, possibilidade de encerrar a posição com <b>qualquer outro participante a qualquer momento</b> (o que não ocorre no termo) e proteção pelas <b>margens de garantia</b> exigidas pela bolsa, que evitam desequilíbrio entre o valor do contrato e as disponibilidades do contratante.</p>
    <p>Desvantagens: custo elevado pela movimentação financeira expressiva dos ajustes diários; custos operacionais maiores que no termo; e necessidade de depósito de garantias, com o respectivo <b>custo de oportunidade</b>.</p>
    <h3>Swap</h3>
    <p>Acordo entre duas partes que estabelece a <b>troca de fluxo de caixa</b>, tendo como base a comparação da <b>rentabilidade</b> entre dois bens incluídos no contrato. Negocia-se a troca de rentabilidade, ou seja, de risco.</p>
    <p>Exemplos: <b>DI x Dólar</b>, em que quem não quer exposição cambial passa a pagar taxa DI; e <b>Ouro x Pré</b>, em que, se a valorização do ouro no vencimento ficar abaixo da taxa prefixada negociada, recebe a diferença quem comprou pré e vendeu ouro, e vice-versa.</p>
    <p>A liquidação ocorre <b>integralmente no vencimento</b>, o que torna o swap muito semelhante ao termo. Como são tipicamente de balcão e feitos sob medida, quase nunca têm preço observável, e a mensuração se dá por <b>modelo de precificação</b>.</p>

      <tr><td>Encerramento antecipado</td><td>Difícil</td><td>Com qualquer participante, a qualquer momento</td><td>Difícil</td></tr>
    </table>
  `,

  nome: "Opções e derivativos de crédito",
  tag: "Call, put, titular, lançador e a Resolução CMN 5.007/23",
  colinha: `
    <h3>A opção</h3>
    <p>Contrato que fornece o <b>direito</b> de comprar ou vender número prefixado de unidades de um ativo, na data de vencimento ou durante a vigência, a preço combinado na data inicial. O preço da opção é, portanto, um <b>prêmio</b> pago por adquirir (ou recebido por fornecer) um direito.</p>
    <table class="tabela">
      <tr><th>Elemento</th><th>Significado</th></tr>
      <tr><td><b>Ativo-objeto</b></td><td>O ativo que será comprado ou vendido caso o direito seja exercido</td></tr>
      <tr><td><b>Titular</b></td><td>Quem <b>compra</b> a opção e <b>paga</b> o prêmio, assumindo o <b>direito</b> e podendo escolher se exerce</td></tr>
      <tr><td><b>Lançador</b></td><td>Quem <b>vende</b> a opção e <b>recebe</b> o prêmio, assumindo a <b>obrigação</b> de vender ou comprar se for exercido</td></tr>
      <tr><td><b>Strike</b></td><td>Preço de exercício, preestabelecido no contrato</td></tr>
      <tr><td><b>Prêmio</b></td><td>Preço pago ou recebido pela opção</td></tr>
      <tr><td><b>Fechamento de posição</b></td><td>Operação inversa: o titular vende suas opções, o lançador recompra as suas</td></tr>
    </table>
    <p><b>Call</b> é a opção de compra: dá ao titular o direito de <b>comprar</b> o ativo-objeto pelo strike. <b>Put</b> é a opção de venda: dá o direito de <b>vender</b>.</p>
    <div class="aviso"><b>Americana x europeia.</b> Na opção <b>americana</b>, o titular pode exercer a qualquer momento até o dia do exercício. Na <b>europeia</b>, o direito só pode ser exercido <b>no dia do vencimento</b>.</div>
    <h3>As quatro operações básicas</h3>
    <p>Notação: S é o preço do ativo-objeto, S* o preço no vencimento, K o strike, c o prêmio da call e p o prêmio da put.</p>
    <table class="tabela">
      <tr><th>Operação</th><th>Se S* &lt; K</th><th>Se S* &gt; K</th></tr>
      <tr><td><b>Compra de call</b> (titular)</td><td>Não exerce; prejuízo = <b>c</b></td><td>Exerce; resultado = S* − K − c</td></tr>
      <tr><td><b>Venda de call</b> (lançador)</td><td>Não é exercido; lucro = <b>c</b></td><td>É exercido; resultado = K − S* + c</td></tr>
      <tr><td><b>Compra de put</b> (titular)</td><td>Exerce; lucro = K − S* − p</td><td>Não exerce; prejuízo = <b>p</b></td></tr>
    </table>
    <p>O risco do titular é <b>perder o prêmio</b> se a opção virar pó. O risco do lançador pode, virtualmente, <b>não ter limites</b>.</p>
    <h3>Derivativos de crédito</h3>
    <p>A <b>Resolução CMN 5.070</b> reconhece <b>duas modalidades</b>:</p>
    <table class="tabela">
      <tr><th>Modalidade</th><th>Mecânica</th></tr>
      <tr><td><b>Swap de crédito (CDS)</b></td><td>A contraparte <b>transferidora</b> do risco paga à <b>receptora</b> a taxa de proteção. Ocorrendo evento de crédito previsto, a receptora paga à transferidora a proteção contratada, podendo haver liquidação antecipada parcial ou total.</td></tr>
      <tr><td><b>Swap de taxa de retorno total (TRS)</b></td><td>A transferidora repassa à receptora os encargos e contraprestações da obrigação de referência, além da <b>variação positiva</b> do valor de mercado. A receptora paga à transferidora juros a taxa fixa ou variável, além de eventual <b>variação negativa</b> do valor de mercado.</td></tr>
    </table>
    <p>O CDS funciona como um <b>seguro privado contra evento de crédito</b>. Exemplo: comprados US$ 100 milhões de recebíveis com CDS 5Y a 350 basis points, paga-se 3,5% ao ano pela garantia. Se estourar uma crise e o CDS for a 1.600 basis points, o dono da proteção não se prejudica: ele pode <b>vender a proteção</b> que comprou por 5 milhões a quem precisa dela por 16 milhões.</p>
    <h3>Definições da Resolução CMN 5.007/23</h3>
    <p><b>Derivativo de crédito</b> é o instrumento que apresenta <b>cumulativamente</b>: valor de mercado que se altera em função da variação do <b>risco de crédito</b> de entidades de referência; transferência do risco entre as contrapartes <b>sem transferência física ou contábil</b> das obrigações; investimento líquido inicial <b>inferior</b> ao valor do contrato; e liquidação em <b>data futura</b>.</p>
    <table class="tabela">
      <tr><th>Termo</th><th>Definição</th></tr>
      <tr><td><b>Entidade de referência</b></td><td>Fundo de investimento ou pessoa jurídica, no Brasil ou no exterior, emissora, devedora ou garantidora das obrigações sobre as quais podem incidir os eventos de crédito</td></tr>
      <tr><td><b>Obrigação de referência</b></td><td>A obrigação financeira da entidade de referência discriminada no contrato</td></tr>
      <tr><td><b>Transferidora do risco</b></td><td>Comprador de proteção: adquire o direito de proteção</td></tr>
      <tr><td><b>Receptora do risco</b></td><td>Provedor de proteção: assume o risco de crédito</td></tr>
      <tr><td><b>Evento de crédito</b></td><td>Evento que enseja o exercício da proteção, podendo ou não ocasionar liquidação antecipada</td></tr>
      <tr><td><b>Taxa de proteção</b></td><td>Valor pago pela transferidora à receptora, na forma e periodicidade do contrato</td></tr>
      <tr><td><b>Agente de cálculo</b></td><td>Entidade responsável por apurar os valores a pagar ou as obrigações a entregar na liquidação</td></tr>
    </table>
