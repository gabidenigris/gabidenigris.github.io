  colinha: `
    <p>O mercado financeiro se sofisticou muito além de simplesmente intermediar quem empresta e quem capta. Divide-se, a grosso modo, em quatro grandes mercados.</p>
    <table class="tabela">
      <tr><th>Mercado</th><th>Conteúdo</th></tr>
      <tr><td><b>Monetário</b></td><td>Transferências de recursos a <b>curtíssimo prazo</b>, em geral de um dia, entre instituições financeiras ou entre elas e o Banco Central. Serve ao <b>controle da liquidez</b> da economia, e é nele que o BCB intervém para conduzir a <b>política monetária</b>.</td></tr>
      <tr><td><b>Câmbio</b></td><td>Negociação de trocas de moedas estrangeiras por moeda nacional. Participam todos os agentes com recebimentos ou pagamentos em moeda estrangeira. Regulado e fiscalizado pelo <b>BCB</b>, que dele participa para executar a <b>política cambial</b>.</td></tr>
      <tr><td><b>Crédito</b></td><td>As instituições captam dos superavitários e <b>emprestam</b> a famílias e empresas, sendo remuneradas pela diferença entre o custo de captação e o que cobram do tomador: o <b>spread</b>. As instituições <b>assumem o risco de crédito</b>. Operações em geral de curto e médio prazo.</td></tr>
      <tr><td><b>Capitais</b></td><td>Os superavitários emprestam <b>diretamente</b> aos deficitários. A instituição financeira atua como <b>prestador de serviços</b>: estrutura a operação, assessora na formação de preços, oferece liquidez, distribui os valores mobiliários. É remunerada pelos <b>serviços</b>, não pelo spread.</td></tr>
    </table>
    <div class="aviso"><b>A fronteira que confunde.</b> Monetário e câmbio são bem delimitados. Já crédito e capitais se confundem. A régua: quando a empresa pega empréstimo <b>diretamente no banco</b>, é mercado de <b>crédito</b>, mesmo sendo de longo prazo. Quando ela toma dinheiro <b>diretamente do superavitário</b>, emitindo ações ou debêntures, é mercado de <b>capitais</b>.</div>
    <p>Detalhe fino: mesmo quando o banco compra os títulos que ele próprio lançou e distribuiu, para <b>encarteirar</b>, ainda se trata de mercado de capitais.</p>
    <h3>Como o BCB atua no mercado monetário</h3>
    <ul>
      <li>Volume de dinheiro <b>maior</b> que o desejado: o BCB <b>vende</b> títulos, retira moeda e <b>reduz</b> a liquidez;</li>
      <li>Volume <b>menor</b> que o desejado: o BCB <b>compra</b> títulos, injeta moeda e <b>restaura</b> a liquidez.</li>
    </ul>
    <h3>Valores mobiliários</h3>
    <p>No mercado de capitais, os investidores adquirem <b>valores mobiliários</b>, que podem ser:</p>
    <ul>
      <li><b>Títulos de dívida</b>: estabelecem relação de crédito entre tomador e poupador. É o caso das <b>debêntures</b>;</li>
      <li><b>Títulos patrimoniais ou de capital</b>: os investidores se tornam <b>sócios</b>, com todos os direitos e deveres. É o caso das <b>ações</b>.</li>
    </ul>
    <p>A aquisição pode ser <b>direta</b> ou <b>indireta</b>, por estruturas de investimento coletivo como fundos e clubes de investimento.</p>
    <h3>Dois mercados adicionais</h3>
    <p>Além dos quatro pilares, destacam-se o <b>mercado de derivativos</b> (ativos que derivam de outros ativos) e o <b>mercado de dívidas</b>. Nem todos os autores os separam, uma vez que ambos são considerados valores mobiliários pela lei.</p>
    <p>Exemplos de operações típicas do mercado de <b>crédito</b>: cheque especial, conta garantida e crédito direto ao consumidor. Instituições típicas: bancos comerciais e sociedades de crédito, financiamento e investimento (as financeiras). O <b>BCB</b> é o principal responsável pelo controle, normatização e fiscalização desse mercado.</p>
  `,

    <h3>Letras do Tesouro Nacional (LTN)</h3>
    <p>Base legal atual: Decreto nº 11.301/2022. Finalidade: cobertura de <b>déficit orçamentário</b> e operações de crédito por antecipação de receita, observados os limites fixados pelo Poder Legislativo.</p>
    <ul>
      <li><b>Prazo</b>: definido pelo Ministro da Fazenda na emissão;</li>
      <li><b>Modalidade</b>: nominativa;</li>
      <li><b>Valor nominal</b>: múltiplo de R$ 1.000,00;</li>
      <li><b>Rendimento</b>: definido pelo <b>deságio</b> sobre o valor nominal;</li>
      <li><b>Resgate</b>: pelo valor nominal, na data do vencimento;</li>
      <li><b>Custódia</b>: <b>Selic</b>.</li>
    </ul>
    <h3>Letras Financeiras do Tesouro (LFT)</h3>
    <p>Rendimento: <b>taxa média ajustada dos financiamentos diários apurados no Selic</b>, divulgada pelo BCB, calculada sobre o valor nominal. Resgate pelo valor nominal acrescido do rendimento desde a <b>data-base</b>. Podem ser emitidas em duas séries: <b>LFT-A</b> e <b>LFT-B</b>, ambas com prazo de até <b>quinze anos</b> e colocação <b>direta</b>.</p>
    <p>A LFT-A rende a taxa Selic <b>acrescida de 0,0245% ao mês</b> e tem resgate do principal em até <b>180 parcelas</b> mensais. A LFT-B rende a Selic pura e resgata pelo valor nominal acrescido do rendimento.</p>
    <p>Finalidade das LFT: cumprimento dos contratos de <b>assunção pela União</b> das dívidas de estados e do Distrito Federal (Lei 9.496/1997) e operações de redução da presença do setor público estadual na atividade bancária. As LFT-B alcançam também dívidas de <b>municípios</b>.</p>
    <h3>Notas do Tesouro Nacional (NTN)</h3>
    <p>Podem ser emitidas nas séries <b>B, B1, C, D, F e I</b>.</p>
    <h3>Nomenclatura do Tesouro Direto</h3>
    <table class="tabela">
      <tr><th>Sigla</th><th>Tesouro Direto</th><th>Rentabilidade</th></tr>
      <tr><td>LTN</td><td>Tesouro Prefixado</td><td>Prefixada, sem cupom</td></tr>
      <tr><td>NTN-F</td><td>Tesouro Prefixado com Juros Semestrais</td><td>Prefixada, com cupom</td></tr>
      <tr><td>LFT</td><td>Tesouro Selic</td><td>Pós-fixada (Selic), sem cupom</td></tr>
      <tr><td>NTN-B Principal</td><td>Tesouro IPCA+</td><td>Pós-fixada (IPCA), sem cupom</td></tr>
      <tr><td>NTN-B</td><td>Tesouro IPCA+ com Juros Semestrais</td><td>Pós-fixada (IPCA), com cupom</td></tr>
    </table>
    <p>O <b>Tesouro Educa+</b> é o título mais recente do programa, voltado ao financiamento dos estudos.</p>
    <h3>Operações compromissadas</h3>
    <p>Base: <b>Resolução CMN nº 3.339/2006</b>. O vendedor assume o compromisso de <b>recomprar</b> os títulos que alienou em data futura predefinida, com remuneração preestabelecida. O comprador assume o compromisso de <b>revender</b> na data acordada pelo preço fixado.</p>
    <div class="aviso">Diferencia-se das <b>opções</b> por ser um compromisso assumido por <b>ambas as partes</b>: a compra com compromisso de revenda e a venda com compromisso de recompra. Na opção, só uma parte tem obrigação.</div>
    <p>Pelo menos uma das partes deve ser: banco múltiplo, comercial, de investimento ou de desenvolvimento; sociedade de crédito, financiamento e investimento; corretora ou distribuidora de títulos e valores mobiliários; ou a Caixa Econômica Federal, habilitado para essas operações.</p>
    <p><b>Por que se faz:</b> quando o banco tem um ativo do qual não quer se desfazer, seja porque recebe taxa mais alta, seja porque conhece melhor o devedor do que o mercado, ele capta dinheiro no momento e recupera o ativo depois, a preço predefinido. Ele paga apenas o <b>diferencial de juros</b> entre o título bom que quer manter e o indexador que teria de pagar pelo dinheiro tomado. Usar a carteira de títulos públicos para levantar dinheiro sai mais <b>barato</b> que emitir um CDB, porque o risco do título público é menor que o do banco.</p>
    <p><b>Lastro admitido</b>, entre outros: debêntures, CDB, LCI, LCA, CRI, CRA, LH e títulos públicos.</p>
    <p><b>Tributação:</b> até 2016, todas as compromissadas eram isentas de IOF, inclusive entre instituições do mesmo grupo econômico. Com o <b>Decreto nº 8.731/2016</b>, as compromissadas de emissores do <b>mesmo grupo econômico</b> e com prazo <b>inferior a 30 dias</b> passaram a ser tributadas pelo IOF.</p>

    <h3>Letra Hipotecária (LH)</h3>
    <p>Emitida por instituições autorizadas a conceder <b>créditos hipotecários</b>, com lastro em créditos garantidos por <b>hipoteca de primeiro grau</b> de bens imóveis. A maior emissora é a <b>Caixa Econômica Federal</b>.</p>

      <tr><td>Remuneração</td><td>Taxa fixa ou flutuante, combinadas ou não, ou outras taxas de conhecimento público e regularmente calculadas</td></tr>

    </table>
    <p>A <b>cláusula de subordinação</b> indica que, em caso de inadimplemento, o credor do título não possui garantias: fica em último lugar na fila, acima apenas dos acionistas. Emissores: bancos múltiplos, comerciais, de desenvolvimento e de investimento; SCFI; caixas econômicas; companhias hipotecárias; sociedades de crédito imobiliário; cooperativas de crédito (apenas para composição do PR); e BNDES.</p>
    <h3>Caderneta de poupança</h3>

      <li><b>Regra de rendimento (desde 4 de maio de 2012)</b>: Selic <b>acima de 8,5%</b> ao ano, rende <b>0,5% ao mês mais TR</b>; Selic <b>igual ou abaixo de 8,5%</b>, rende <b>70% da Selic mais TR</b>. Depósitos anteriores a essa data seguem a regra antiga (0,5% ao mês mais TR).</li>

    <h3>Tipos de depósitos</h3>
    <table class="tabela">
      <tr><th>Instrumento</th><th>Características</th></tr>
      <tr><td><b>Depósito à vista</b></td><td><b>Não</b> há remuneração nem prazo para saque; movimentação livre. Parte é recolhida ao BCB como <b>compulsório</b>.</td></tr>
      <tr><td><b>Depósito a prazo</b></td><td>Tem remuneração e prazo. Mesmo por um dia, se há promessa de remuneração, é depósito a prazo.</td></tr>
      <tr><td><b>RDB</b></td><td>Recibo. Título <b>nominativo e intransferível</b>: <b>não</b> admite negociação em mercado secundário. Pode ser resgatado junto ao emissor após o prazo mínimo; antes dele, não há rendimento.</td></tr>
      <tr><td><b>CDB</b></td><td>Certificado. Instituído pela <b>Lei nº 4.728/1965</b>. Permite liquidez diária e é elegível ao <b>FGC</b>. Aplicações acima de <b>R$ 5 mil</b> devem ser registradas em câmara, com identificação do investidor. Indexador mais usado: <b>Taxa DI</b>.</td></tr>
      <tr><td><b>DPGE</b></td><td>Criado em 2009 (Resolução 3.692) para auxiliar instituições de <b>porte pequeno e médio</b>. O <b>DPGE II</b> (Resolução 4.415/2012) é elegível ao FGC e exige que os prazos se ajustem aos empréstimos usados como lastro. Prazo <b>não inferior a 6 meses nem superior a 36</b>, sem resgate antecipado nem parcial.</td></tr>

    <p>Muitos bancos transferem o dinheiro da conta corrente para fundos de baixa rentabilidade não para remunerar o cliente, mas para <b>escapar dos percentuais maiores de compulsório</b>.</p>

{
  nome: "Ações, debêntures e securitização",
  tag: "Espécies, classes, garantias, fundos e recebíveis",
  colinha: `
    <h3>Ações: espécies</h3>
    <table class="tabela">
      <tr><th>Espécie</th><th>Conteúdo</th></tr>
      <tr><td><b>Ordinárias</b></td><td>Dão <b>direito de voto</b>. Devem representar, no <b>mínimo, 50%</b> do total das ações emitidas.</td></tr>
      <tr><td><b>Preferenciais</b></td><td>Dão preferências <b>econômicas</b>, ao preço da supressão ou restrição do voto. Não podem ultrapassar <b>50%</b> do total das ações emitidas.</td></tr>
      <tr><td><b>De fruição</b></td><td>Resultam da <b>amortização</b> de ações comuns ou preferenciais (art. 44, §5º). Não são negociadas no mercado de valores mobiliários.</td></tr>
    </table>
    <h3>Ações: classes</h3>
    <p>As <b>ordinárias de companhia fechada</b> podem ser de classes diversas em função de: conversibilidade em preferenciais; exigência de nacionalidade brasileira do acionista; ou direito de voto em separado para preenchimento de cargos administrativos.</p>
    <div class="aviso"><b>Atualização da Lei 14.195.</b> Na companhia <b>aberta</b> é vedada mais de uma classe de ações ordinárias, <b>ressalvado o voto plural</b> (art. 16-A). O voto plural é limitado a <b>10 votos por ação ordinária</b> e a classe deve ser criada <b>antes</b> da negociação de quaisquer ações ou valores mobiliários conversíveis em mercados organizados (art. 110-A).</div>
    <p>As preferenciais <b>negociadas</b> em mercado precisam oferecer, além das preferências de emissão, ao menos uma destas vantagens: dividendo de pelo menos <b>25% do lucro líquido</b> com prioridade de no mínimo <b>3% do valor do patrimônio líquido da ação</b>; ou dividendo <b>pelo menos 10% maior</b> que o das ordinárias; ou inclusão na oferta pública de alienação de controle com <b>tag along de 80%</b>, assegurado dividendo ao menos igual ao das ordinárias.</p>
    <p>As ações só podem ser negociadas depois de realizados <b>30% do preço de emissão</b>.</p>
    <h3>Debêntures</h3>
    <p>Títulos de <b>dívida</b> emitidos por sociedades por ações, que conferem aos titulares direito de crédito contra a companhia. As condições de emissão são deliberadas pela <b>assembleia geral de acionistas</b>, e o contrato se chama <b>escritura de emissão</b>.</p>
    <table class="tabela">
      <tr><th>Garantia</th><th>Conteúdo</th></tr>
      <tr><td><b>Real</b></td><td>Bens ou direitos comprometidos, que não podem ser negociados sem aprovação dos debenturistas</td></tr>
      <tr><td><b>Flutuante</b></td><td>Privilégio geral sobre o ativo da companhia, <b>sem impedir</b> a negociação dos bens que o compõem</td></tr>
      <tr><td><b>Quirografária</b></td><td>Sem garantia; em falência, equipara-se aos demais credores quirografários</td></tr>
      <tr><td><b>Subordinada</b></td><td>Sem garantia; preferência apenas sobre os <b>acionistas</b>. Em liquidação, as quirografárias <b>precedem</b> as subordinadas</td></tr>
    </table>
    <p>Quanto à conversibilidade: <b>simples</b> (não conversíveis), <b>conversíveis</b> em ações da emissora, e <b>permutáveis</b> (transformáveis em ações de <b>outra</b> empresa ou em outros bens). Quanto à forma, todas são <b>nominativas</b>, já que as ao portador foram extintas pela Lei 9.457/1997; a forma mais usada é a <b>escritural</b>.</p>
    <p><b>Covenants</b> são cláusulas com exigências sobre condições financeiras da empresa (múltiplos máximos de endividamento, ratings mínimos). São <b>positivos</b> (boas práticas a seguir) ou <b>negativos</b> (fatores a evitar). A punição típica é a <b>antecipação do vencimento</b>, mas a assembleia de debenturistas pode conceder <b>waiver</b>.</p>
    <p><b>Amortização</b> reduz o valor nominal de todas as debêntures em circulação; <b>resgate</b> retira e cancela unidades. <b>Repactuação</b> é renegociar as condições para adequá-las ao mercado; não aceitando o investidor, a empresa terá de adquirir os papéis. As <b>debêntures incentivadas</b> (Lei 12.431/2011) financiam projetos de <b>infraestrutura</b> ou de produção intensiva em pesquisa e inovação.</p>
    <h3>Fundos de investimento</h3>
    <p>Pela <b>RCVM 175</b>, os <b>fundos de investimento financeiro (FIF)</b> podem ser, conforme a política de investimento: <b>Ações</b>, <b>Cambial</b>, <b>Multimercado</b> e <b>Renda Fixa</b>. A classe <b>Renda Fixa</b> deve ter como principal fator de risco a variação de <b>taxa de juros, índice de preços ou ambos</b>, e nela é <b>vedada a taxa de performance</b>, salvo classes destinadas a investidores qualificados, classes com compromisso de tratamento fiscal de longo prazo, ou a classe Renda Fixa Dívida Externa.</p>
    <p>São ativos financeiros, entre outros: títulos públicos federais; contratos derivativos; <b>CBIO e créditos de carbono</b> registrados em sistema autorizado; <b>criptoativos</b> negociados em entidades autorizadas pelo BCB, CVM ou supervisor local; ações, debêntures, notas comerciais e demais valores mobiliários ofertados publicamente; ouro negociado em padrão internacionalmente aceito; e obrigações ou coobrigações de instituição financeira.</p>
    <h3>Securitização</h3>
    <p>Vem de <b>securities</b>: processo pelo qual um emissor <b>segrega um portfólio de ativos</b> e emite um novo instrumento de dívida ou valor mobiliário por meio de um <b>veículo independente</b>, com prioridades distintas de recebimento em relação ao portfólio original.</p>
    <p>Exemplos: <b>FIDC</b>, <b>CRI</b> e <b>CRA</b> emitidos por securitizadoras, <b>CCCB</b> e <b>CDCA</b>.</p>
    <div class="aviso">Securitização é uma <b>forma</b> de crédito estruturado, mas <b>nem todo crédito estruturado é securitização</b>. <b>Over collateral</b> é oferecer mais garantias do que o valor da dívida, comum em FIDCs porque permite ao gestor trocar créditos ruins por bons.</div>
    <p>A <b>LCI</b> é emitida por bancos comerciais, múltiplos e de investimento, sociedades de crédito imobiliário, APEs e companhias hipotecárias, com lastro em <b>créditos imobiliários</b>. É <b>isenta de IR</b> para pessoa física, elegível ao <b>FGC</b>, não pode ser resgatada a qualquer momento mas pode ser negociada no secundário. Pela <b>Resolução CMN 5.119/2024</b>, o prazo mínimo passou a ser de <b>36 meses</b> quando atualizada mensalmente por índice de preços e <b>12 meses</b> nos demais casos (o prazo de 90 dias foi revogado).</p>
  `,

    <p><b>ESG</b> significa <i>environmental, social and governance</i>, ou seja, práticas <b>ambientais, sociais e de governança</b> de uma organização. Em português, <b>ASG</b>.</p>
    <div class="aviso">O termo foi cunhado em <b>2004</b>, em publicação do <b>Pacto Global</b> em parceria com o <b>Banco Mundial</b>, chamada <b>Who Cares Wins</b>. Surgiu de uma provocação do secretário-geral da ONU <b>Kofi Annan</b> a 50 CEOs de grandes instituições financeiras, sobre como integrar fatores sociais, ambientais e de governança aos mercados financeiro e de capitais.</div>

/* ---- 8.3 */
{
  nome: "Mercado de carbono",
  tag: "Precificação de emissões, imposto ou mercado, tipos de mercado",
  colinha: `
    <p>O <b>mercado de carbono</b> é o ambiente em que se dá a <b>precificação das emissões de gases de efeito estufa</b> (GEE ou GHG), com vistas a transacionar créditos de carbono.</p>
    <div class="aviso">A precificação de carbono é um <b>instrumento econômico essencial</b> para permitir a incorporação dos <b>custos sociais, econômicos e ambientais negativos</b> causados pelas emissões, além de ser mecanismo com custo-benefício testado e de importância relevante na <b>transição para uma economia de baixo carbono</b>.</div>
    <h3>Não é só carbono</h3>
    <p>Costuma-se chamar de mercado de carbono, mas os gases de efeito estufa são vários: <b>metano (CH₄)</b>, <b>óxido nitroso (N₂O)</b>, <b>hexafluoreto de enxofre (SF₆)</b>, além do <b>hidrofluorcarbono (HFC)</b> e do <b>perfluorcarbono (PFC)</b>. O impacto climático de todos pode ser medido em <b>dióxido de carbono equivalente (tCO₂e)</b>.</p>
    <h3>Imposto ou mercado?</h3>
    <p>Durante a discussão regulatória, sempre surgiu a hipótese de <b>sobretaxar</b> as emissões, aproveitando inclusive o debate sobre a reforma tributária. À primeira vista faria sentido: o governo padronizaria a medição e tributaria os excessos.</p>
    <p>Mas a medida <b>poderia não endereçar o problema real</b>, que são as emissões. Aumentar impostos, em regra, apenas adiciona <b>custos à cadeia produtiva</b>, que seriam pagos pelo consumidor, <b>sem qualquer esforço de redução de emissões</b>. Some-se a isso a ausência de garantia de que o dinheiro arrecadado seria usado exclusiva ou eficientemente para mitigar os efeitos nocivos.</p>
    <p>Daí a preferência pela discussão de um <b>mercado livre de precificação do carbono</b>: países ricos, produtores de carbono, pagariam aos países que preservam pelo direito de emitir mais, promovendo distribuição de renda e estimulando a preservação dos biomas.</p>
    <h3>Os tipos de mercado</h3>
    <table class="tabela">
      <tr><th>Tipo</th><th>Características</th></tr>
      <tr><td><b>Voluntário</b></td><td>Comércio de redução de emissões entre empresas e indivíduos, atendendo a metas <b>voluntárias</b> corporativas ou individuais, por meio de créditos gerados por outras empresas e indivíduos. Os créditos são certificados por <b>terceiros</b>, com princípios que <b>variam entre si</b>. As transações <b>não obedecem</b> a marco regulatório comum com metas compulsórias e <b>não seguem</b> as regras do Acordo de Paris.</td></tr>
      <tr><td><b>Regulado (internacional)</b></td><td>Regulado por regras e metas estabelecidas em <b>acordos internacionais</b>. Dentro da <b>Convenção do Clima (UNFCCC)</b> há instrumentos e mecanismos de cooperação internacional para trocas de emissões ou créditos de redução entre governos e entidades, incluindo empresas.</td></tr>
    </table>

/* ---------- persistência (silenciosa se o navegador bloquear) ---------- */
function carregar() {
  try {
    const bruto = localStorage.getItem(CHAVE);
    if (bruto) salvo = Object.assign(salvo, JSON.parse(bruto));
  } catch (e) { /* segue sem salvar */ }
}
function gravar() {
  try { localStorage.setItem(CHAVE, JSON.stringify(salvo)); } catch (e) {}
}
function reg(m, f) { return salvo.fases[m + ":" + f]; }

/* ---------- som ---------- */
let ctxAudio = null;
function bip(freq, dur, tipo) {
  if (!salvo.som) return;
  try {
    if (!ctxAudio) ctxAudio = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctxAudio.createOscillator();
    const g = ctxAudio.createGain();
    o.type = tipo || "triangle";
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, ctxAudio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.09, ctxAudio.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, ctxAudio.currentTime + dur);
    o.connect(g); g.connect(ctxAudio.destination);
    o.start(); o.stop(ctxAudio.currentTime + dur + 0.02);
  } catch (e) {}
}
const somCerto = () => { bip(660, 0.09); setTimeout(() => bip(990, 0.12), 90); };
const somErro  = () => bip(160, 0.22, "sawtooth");
const somFase  = () => { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => bip(f, 0.14), i * 110)); };

/* ---------- utilitários ---------- */
function embaralhar(a) {
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
function semTags(s) { return String(s).replace(/<[^>]+>/g, ""); }
function opcoesDe(mod, fase, q) {
  return q.t === "pool" ? (q.pool || fase.pool) : q.o;
}
function digitoControle(cod) {
  const d = String(cod).replace(/\D/g, "");
  if (d.length !== 9) return null;
  const pesos = [3, 7, 1, 3, 7, 1, 3, 7, 1];
  let soma = 0, detalhe = [];
  for (let i = 0; i < 9; i++) {
    const alg = Number(d[8 - i]);
    soma += alg * pesos[i];
    detalhe.push({ alg: alg, peso: pesos[i], prod: alg * pesos[i] });
  }
  const resto = soma % 10;
  return { soma: soma, resto: resto, dv: resto === 0 ? 0 : 10 - resto, detalhe: detalhe };
}

/* ---------- progresso ---------- */
function fasesFeitas(m) {
  let n = 0;
  MODULOS[m].fases.forEach(function (_, f) { if (reg(m, f)) n++; });
  return n;
}
function moduloCompleto(m) { return fasesFeitas(m) === MODULOS[m].fases.length; }
function totalFases() {
  return MODULOS.reduce(function (a, mo) { return a + mo.fases.length; }, 0);
}
function totalFeitas() {
  return MODULOS.reduce(function (a, _, m) { return a + fasesFeitas(m); }, 0);
}
function medalhaDe(pct) { return pct === 100 ? "🏅" : pct >= 80 ? "🥈" : "🥉"; }

/* ---------- barra de status ---------- */
function pintarPlacar() {
  if (!jogo) { placar.classList.add("oculto"); return; }
  placar.classList.remove("oculto");
  let hp = "";
  for (let i = 0; i < 3; i++) hp += "<span class='" + (i < jogo.vidas ? "" : "gasta") + "'>◆</span>";
  elVidas.innerHTML = hp;
  elXp.textContent = salvo.xp + jogo.xpFase;
  elCombo.textContent = jogo.seq >= 3 ? "×" + multiplicador() : "";
}
function multiplicador() { return jogo.seq >= 6 ? 3 : (jogo.seq >= 3 ? 2 : 1); }

    '<p class="contexto">' + mo.nome.toUpperCase() + " · FASE " + (i + 1) + " DE " + mo.fases.length + '</p>' +
    '<h2>' + f.nome + '</h2>' +
    '<p class="sub">' + f.tag + '</p>' +
    '<div class="colinha">' + f.colinha + '</div>' +
    '<div class="acoes"><button class="btn selo" id="jogar">Jogar esta fase</button>' +
    '<button class="btn fantasma" id="voltar">Voltar às fases</button></div>';
  document.getElementById("jogar").onclick = function () { comecarFase(m, i); };
  document.getElementById("voltar").onclick = function () { telaMapa(m); };
  montarOficina();
  window.scrollTo(0, 0);
}

/* oficina do dígito de controle, usada na colinha da Aula 00 */
function montarOficina() {
  const alvo = document.getElementById("oficina-dv");
  if (!alvo) return;
  alvo.innerHTML =
    '<label for="cod-dv">Digite os nove dígitos de um código e veja a conta:</label>' +
    '<input id="cod-dv" maxlength="14" value="1.1.1.00.00.00" inputmode="numeric">' +
    '<div class="saida" id="saida-dv"></div>';
  const inp = document.getElementById("cod-dv");
  const out = document.getElementById("saida-dv");
  function calcular() {
    const r = digitoControle(inp.value);
    if (!r) { out.textContent = "Faltam dígitos: o código precisa ter nove algarismos."; return; }
    let txt = "algarismo × peso = produto\n";
    r.detalhe.forEach(function (d) {
      txt += "    " + d.alg + "   ×  " + d.peso + "  =   " + d.prod + "\n";
    });
    txt += "soma = " + r.soma + "   ·   resto de " + r.soma + " ÷ 10 = " + r.resto + "\n";
    out.innerHTML = esc(txt) + '<span class="dv">dígito de controle = ' +
      (r.resto === 0 ? "0 (resto zero)" : "10 − " + r.resto + " = " + r.dv) + '</span>';
  }
  inp.addEventListener("input", calcular);
  calcular();
}

/* ============================================================
   PARTIDA
   ============================================================ */

function comecarFase(m, i) {
  const f = MODULOS[m].fases[i];
  jogo = {
    mod: m,
    fase: i,
    qs: embaralhar(f.qs),
    idx: 0,
    vidas: 3,
    acertos: 0,
    seq: 0,
    xpFase: 0,
    errados: [],
    travado: false
  };
  elMarca.textContent = MODULOS[m].nome.toUpperCase() + " · " + f.nome.toUpperCase();
  desenharPergunta();
}

function desenharPergunta() {
  const f = MODULOS[jogo.mod].fases[jogo.fase];
  const q = jogo.qs[jogo.idx];
  jogo.travado = false;
  pintarPlacar();

  let html = '<div class="trilho"><i style="width:' + (jogo.idx / jogo.qs.length * 100) + '%"></i></div>';
  html += '<p class="contexto">PERGUNTA ' + (jogo.idx + 1) + " DE " + jogo.qs.length + " · " + f.nome.toUpperCase() + '</p>';
  html += '<p class="enunciado">' + q.p + '</p>';

  if (q.lanc) {
    html += '<div class="lancamento">';
    q.lanc.forEach(function (l) {
      html += '<div class="lin"><span class="dc ' + (l[0] === "D" ? "d" : "c") + '">' + l[0] + '</span>' +
              '<span>' + l[1] + '</span><span>R$ ' + l[2] + '</span></div>';
    });
    html += '</div>';
  }

  if (q.t === "num") {
    html += '<div class="campo-num"><input id="resp-num" inputmode="numeric" maxlength="3" autocomplete="off">' +
            '<button class="btn" id="conf-num">Conferir</button></div>';
  } else {
    const opcoes = opcoesDe(jogo.mod, f, q);
    const ordem = q.t === "pool" ? opcoes.map(function (_, k) { return k; }) : embaralhar(opcoes.map(function (_, k) { return k; }));
    const teclas = ["A", "B", "C", "D", "E", "F", "G", "H"];
    html += '<div class="opcoes' + (opcoes.length > 4 ? " grade" : "") + '" id="opcoes">';
    ordem.forEach(function (orig, pos) {
      html += '<button class="op" data-orig="' + orig + '">' +
              '<span class="tecla">' + teclas[pos] + '</span><span>' + opcoes[orig] + '</span></button>';
    });
    html += '</div>';
  }

  html += '<div id="area-resposta"></div>';
  tela.innerHTML = html;

  if (q.t === "num") {
    const inp = document.getElementById("resp-num");
    inp.focus();
    const enviarNum = function () {
      if (inp.value.trim() === "") { inp.focus(); return; }
      responder(Number(inp.value), q.r);
    };
    document.getElementById("conf-num").onclick = enviarNum;
    inp.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") { ev.preventDefault(); enviarNum(); }
    });
  } else {
    Array.prototype.forEach.call(tela.querySelectorAll(".op"), function (b) {
      b.onclick = function () { responder(Number(b.dataset.orig), q.r); };
    });
  }
  window.scrollTo(0, 0);
}

function responder(escolha, correta) {
  if (jogo.travado) return;
  jogo.travado = true;
  const q = jogo.qs[jogo.idx];
  const acertou = escolha === correta;

  if (q.t !== "num") {
    Array.prototype.forEach.call(tela.querySelectorAll(".op"), function (b) {
      const o = Number(b.dataset.orig);
      b.disabled = true;
      if (o === correta) b.classList.add("certa");
      else if (o === escolha) b.classList.add("errada");
      else b.classList.add("apagada");
    });
  } else {
    document.getElementById("resp-num").disabled = true;
    document.getElementById("conf-num").disabled = true;
  }

  if (acertou) {
    jogo.acertos++;
    jogo.seq++;
    jogo.xpFase += 10 * multiplicador();
    somCerto();
  } else {
    jogo.seq = 0;
    jogo.vidas--;
    jogo.errados.push(q);
    somErro();
  }
  pintarPlacar();

  const area = document.getElementById("area-resposta");
  area.innerHTML =
    '<div class="resposta" role="status">' +
      '<span class="carimbo ' + (acertou ? "ok" : "nao") + ' bate">' + (acertou ? "EXECUTADA" : "REJEITADA") + '</span>' +
      '<p class="explica">' + q.e + '</p>' +
      '<div class="acoes"><button class="btn" id="seguir">' +
        (jogo.vidas === 0 ? "Ver o resultado" : (jogo.idx + 1 >= jogo.qs.length ? "Encerrar a fase" : "Próxima")) +
      '</button></div>' +
    '</div>';
  const b = document.getElementById("seguir");
  b.onclick = avancar;
  b.focus();
}

function avancar() {
  if (jogo.vidas === 0) return telaFimFase(false);
  jogo.idx++;
  if (jogo.idx >= jogo.qs.length) return telaFimFase(true);
  desenharPergunta();
}

function telaFimFase(concluiu) {
  const m = jogo.mod;
  const i = jogo.fase;
  const mo = MODULOS[m];
  const total = jogo.qs.length;
  const pct = Math.round(jogo.acertos / total * 100);
  const errados = jogo.errados.slice();
  const parciais = jogo.idx + 1;
  const acertos = jogo.acertos;
  const xpFase = jogo.xpFase;

  if (concluiu) {
    salvo.xp += xpFase;
    const r = reg(m, i);
    salvo.fases[m + ":" + i] = { melhor: r ? Math.max(r.melhor, pct) : pct };
    gravar();
    somFase();
  }

  let html = '<p class="contexto">' + mo.nome.toUpperCase() + " · FASE " + (i + 1) + " · " + mo.fases[i].nome.toUpperCase() + '</p>';

  if (concluiu) {
    html += '<div class="nota">' + pct + '%<small>' + acertos + " de " + total +
            " · " + xpFase + ' XP ganhos · ' + medalhaDe(pct) + '</small></div>';
  } else {
    html += '<h2>Acabaram as chances</h2><p class="sub">Você acertou ' + acertos + ' de ' + parciais +
            ' antes de perder as três. A fase reabre com as perguntas embaralhadas, e você já sabe onde tropeçou.</p>';
  }

  if (errados.length) {
    html += '<div class="revisar"><h3>Para revisar</h3><ul>';
    errados.forEach(function (q) {
      html += '<li><b>' + semTags(q.p) + '</b><br>' + q.e + '</li>';
    });
    html += '</ul></div>';
  } else if (concluiu) {
    html += '<p class="sub" style="margin-top:14px">Fase limpa, sem nenhum erro. Guarde essa sensação para a prova.</p>';
  }

  const proxima = i + 1 < mo.fases.length;
  html += '<div class="acoes">';
  if (concluiu && proxima) html += '<button class="btn selo" id="prox">Fase ' + (i + 2) + ': ' + mo.fases[i + 1].nome + '</button>';
  if (concluiu && !proxima) html += '<button class="btn selo" id="dipm">Diploma desta aula</button>';
  html += '<button class="btn fantasma" id="rep">Refazer a fase</button>';
  html += '<button class="btn fantasma" id="col">Reler a colinha</button>';
  html += '<button class="btn fantasma" id="mapa">Fases da aula</button></div>';

  jogo = null; pintarPlacar();
  tela.innerHTML = html;
  elMarca.textContent = mo.nome.toUpperCase() + " · XP " + salvo.xp;

  const p = document.getElementById("prox"); if (p) p.onclick = function () { telaColinha(m, i + 1); };
  const dm = document.getElementById("dipm"); if (dm) dm.onclick = function () { telaDiplomaModulo(m); };
  document.getElementById("rep").onclick = function () { comecarFase(m, i); };
  document.getElementById("col").onclick = function () { telaColinha(m, i); };
  document.getElementById("mapa").onclick = function () { telaMapa(m); };
  window.scrollTo(0, 0);
}

function telaDiplomaModulo(m) {
  jogo = null; pintarPlacar();
  const mo = MODULOS[m];
  const notas = mo.fases.map(function (_, i) { const r = reg(m, i); return r ? r.melhor : 0; });
  const media = Math.round(notas.reduce(function (a, b) { return a + b; }, 0) / notas.length);
  const fracas = mo.fases.filter(function (_, i) { return notas[i] < 80; });
  elMarca.textContent = "DIPLOMA · " + mo.nome.toUpperCase();

  let html =
    '<div class="diploma">' +
      '<p class="contexto" style="margin-bottom:16px">' + mo.subtitulo.toUpperCase() + '</p>' +
      '<h2>' + mo.nome + '</h2>' +
      '<div class="nota" style="margin:18px 0">' + media + '%<small>média das melhores notas nas ' + mo.fases.length + ' fases · ' + salvo.xp + ' XP acumulados</small></div>' +
      '<span class="selo-final">AULA CONCLUÍDA</span>' +
    '</div>';

  if (fracas.length) {
    html += '<div class="revisar"><h3>Onde ainda vale voltar</h3><ul>';
    fracas.forEach(function (f) { html += '<li><b>' + f.nome + '</b>: ' + f.tag + '</li>'; });
    html += '</ul></div>';
  }

  const proxMod = m + 1 < MODULOS.length;
  html += '<div class="acoes">';
  if (proxMod) html += '<button class="btn selo" id="prox">Aula ' + (m + 2) + ': ' + MODULOS[m + 1].nome + '</button>';
  html += '<button class="btn fantasma" id="mapa">Fases desta aula</button>';
  html += '<button class="btn fantasma" id="todas">Todas as aulas</button></div>';
  tela.innerHTML = html;
  const p = document.getElementById("prox"); if (p) p.onclick = function () { telaMapa(m + 1); };
  document.getElementById("mapa").onclick = function () { telaMapa(m); };
  document.getElementById("todas").onclick = telaModulos;
  window.scrollTo(0, 0);
}

function telaDiploma() {
  jogo = null; pintarPlacar();
  let soma = 0, n = 0;
  const fracas = [];
  MODULOS.forEach(function (mo, m) {
    mo.fases.forEach(function (f, i) {
      const r = reg(m, i);
      const nota = r ? r.melhor : 0;
      soma += nota; n++;
      if (nota < 80) fracas.push(mo.nome + " · " + f.nome);
    });
  });
  const media = Math.round(soma / n);
  elMarca.textContent = "DIPLOMA DO CURSO · XP " + salvo.xp;

  let html =
    '<div class="diploma">' +
      '<p class="contexto" style="margin-bottom:16px">FRONTEIRA EFICIENTE · FINANÇAS · AULAS 01 A 08</p>' +
      '<h2>As oito aulas, fase por fase</h2>' +
      '<div class="nota" style="margin:18px 0">' + media + '%<small>média das melhores notas em ' + n + ' fases · ' + salvo.xp + ' XP acumulados</small></div>' +
      '<span class="selo-final">PRONTA PARA A PROVA</span>' +
    '</div>';

  if (fracas.length) {
    html += '<div class="revisar"><h3>Onde ainda vale voltar</h3><ul>';
    fracas.forEach(function (t) { html += '<li>' + t + '</li>'; });
    html += '</ul></div>';
  }

  html += '<p class="sub" style="margin-top:18px">Revisão espaçada funciona: refaça daqui a dois dias, e de novo em uma semana, as fases de CAPM, as quatro teorias da curva, duração, VaR e os quatro movimentos da ETTJ. São as que mais rendem em prova.</p>';
  html += '<div class="acoes"><button class="btn fantasma" id="todas">Todas as aulas</button></div>';
  tela.innerHTML = html;
  document.getElementById("todas").onclick = telaModulos;
  window.scrollTo(0, 0);
}

/* ============================================================
   ATALHOS E RODAPÉ
   ============================================================ */

document.addEventListener("keydown", function (ev) {
  const seguir = document.getElementById("seguir");
  if (ev.key === "Enter" && seguir) { ev.preventDefault(); seguir.click(); return; }
  if (!jogo || jogo.travado) return;
  const teclas = { "1": 0, "2": 1, "3": 2, "4": 3, "5": 4, "6": 5, "7": 6, "8": 7,
                   "a": 0, "b": 1, "c": 2, "d": 3, "e": 4, "f": 5, "g": 6, "h": 7 };
  const pos = teclas[ev.key.toLowerCase()];
  if (pos === undefined) return;
  const botoes = tela.querySelectorAll(".op");
  if (botoes[pos]) { ev.preventDefault(); botoes[pos].click(); }
});

const btnSom = document.getElementById("btn-som");
btnSom.onclick = function () {
  salvo.som = !salvo.som;
  btnSom.textContent = "som: " + (salvo.som ? "ligado" : "desligado");
  gravar();
  if (salvo.som) bip(880, 0.08);
};

document.getElementById("btn-zerar").onclick = function () {
  if (!confirm("Apagar todo o progresso e recomeçar do zero?")) return;
  salvo = { xp: 0, fases: {}, som: salvo.som };
  gravar();
  telaCapa();
};

/* ---------- início ---------- */
carregar();
btnSom.textContent = "som: " + (salvo.som ? "ligado" : "desligado");
telaCapa();
</script>
